      parameters:
        - { name: account_id, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: currency, in: query, schema: { type: string, minLength: 3, maxLength: 3 } }
        - { name: party_type, in: query, schema: { type: string, enum: [customer, supplier, employee] } }
        - { name: party_id, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [csv, xlsx, pdf], default: csv } }
        - { name: language, in: query, schema: { type: string, enum: [ar, en, bilingual], default: bilingual } }
      responses:
        '200':
          description: UTF-8 CSV with BOM
          content:
            text/csv:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
