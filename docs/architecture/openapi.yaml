openapi: 3.1.0
info:
  title: Tourism ERP API
  version: 0.1.0-draft
  description: |
    Draft contract for the self-hosted Tourism ERP. Additive changes within v1.
    Money is serialized as a decimal string plus the authoritative minor-unit integer.
    Every endpoint is authorized by policy and branch scope.
  contact:
    name: Architecture
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Platform
  - name: Accounting
  - name: Schedules
  - name: Fixed Assets
  - name: Treasury
  - name: Parties
  - name: Bookings
  - name: Payments
  - name: Reports
  - name: CRM
  - name: Webhooks

paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Authenticate and issue a Sanctum token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string, default: web }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      responses:
        '204': { description: Revoked }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user, roles, permissions, branches
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }

  /branches:
    get:
      tags: [Platform]
      summary: List branches visible to the user
      responses:
        '200':
          description: Branches
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Branch' }
    post:
      tags: [Platform]
      summary: Create a branch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /settings:
    get:
      tags: [Platform]
      summary: Read installation settings (secrets redacted)
      responses:
        '200': { description: Settings }
    put:
      tags: [Platform]
      summary: Update settings
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }

  /feature-flags:
    get:
      tags: [Platform]
      summary: Non-sensitive installation flags (any authenticated user, no extra permission)
      responses:
        '200':
          description: Flags derived from settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [tax_enabled, credit_limit_policy, base_currency, refund_segregation]
                    properties:
                      tax_enabled: { type: boolean }
                      credit_limit_policy: { type: string, enum: [off, warn, block] }
                      base_currency: { type: string, example: EGP }
                      refund_segregation: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /decisions:
    get:
      tags: [Platform]
      summary: List unresolved product/accounting decisions (requires settings.view)
      responses:
        '200':
          description: Unresolved decisions mirroring docs/product/decisions-needed.md
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Decision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /health:
    get:
      tags: [Platform]
      security: []
      summary: Liveness and dependency status (database, cache, redis, queue, scheduler)
      description: Returns 503 only when the database is down; other failures report `degraded`.
      responses:
        '200':
          description: ok or degraded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Database unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /ready:
    get:
      tags: [Platform]
      security: []
      summary: Readiness probe (database reachable)
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ready: { type: boolean }
        '503': { description: Not ready }

  /currencies:
    get:
      tags: [Platform]
      summary: List enabled currencies
      responses:
        '200': { description: Currencies }
  /fx-rates:
    get:
      tags: [Platform]
      summary: List FX rates
      parameters:
        - { name: currency, in: query, schema: { type: string } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: FX rates }
    post:
      tags: [Platform]
      summary: Record a manual FX rate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency, rate, rate_date]
              properties:
                currency: { type: string, minLength: 3, maxLength: 3 }
                rate: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
                rate_date: { type: string, format: date }
                source: { type: string, default: manual }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation' }

  /accounts:
    get:
      tags: [Accounting]
      summary: Chart of accounts tree
      responses:
        '200': { description: Accounts }
    post:
      tags: [Accounting]
      summary: Create an account
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation' }
  /cash-accounts:
    get:
      tags: [Accounting]
      summary: Registered cash and bank accounts with ledger balances (falls back to the chart of accounts until any are registered)
      parameters:
        - { name: include_inactive, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Cash accounts }
    post:
      tags: [Accounting]
      summary: Register a cash or bank account against a postable asset account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashAccountInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /cash-accounts/{cashAccount}:
    patch:
      tags: [Accounting]
      summary: Update a registered cash or bank account
      parameters:
        - { name: cashAccount, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashAccountInput' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /transfers:
    get:
      tags: [Accounting]
      summary: List transfers between cash and bank accounts
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Transfers }
    post:
      tags: [Accounting]
      summary: Create and post a same-currency or cross-currency transfer (idempotent)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferInput' }
      responses:
        '201': { description: Posted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /transfers/{transfer}:
    get:
      tags: [Accounting]
      summary: Get a transfer
      parameters:
        - { name: transfer, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Transfer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /transfers/{transfer}/reverse:
    post:
      tags: [Accounting]
      summary: Reverse a posted transfer exactly once
      parameters:
        - { name: transfer, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '200': { description: Reversed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /expense-categories:
    get:
      tags: [Accounting]
      summary: List expense categories mapped to postable expense accounts
      parameters:
        - { name: include_inactive, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Expense categories }
    post:
      tags: [Accounting]
      summary: Create an expense category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseCategoryInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /expense-categories/{category}:
    patch:
      tags: [Accounting]
      summary: Update an expense category
      parameters:
        - { name: category, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseCategoryInput' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /expenses:
    get:
      tags: [Accounting]
      summary: List expenses
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, submitted, approved, rejected, cancelled, reversed] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Expenses }
    post:
      tags: [Accounting]
      summary: Create a draft expense, optionally submitting it for approval (idempotent)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /expenses/{expense}:
    get:
      tags: [Accounting]
      summary: Get an expense
      parameters:
        - { name: expense, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Expense }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
    patch:
      tags: [Accounting]
      summary: Edit a draft expense
      parameters:
        - { name: expense, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /expenses/{expense}/submit:
    post:
      tags: [Accounting]
      summary: Submit a draft expense for approval
      parameters:
        - { name: expense, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Submitted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /expenses/{expense}/cancel:
    post:
      tags: [Accounting]
      summary: Cancel an unposted expense
      parameters:
        - { name: expense, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Cancelled }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /expenses/{expense}/approve:
    post:
      tags: [Accounting]
      summary: Approve a submitted expense and post it to the ledger (idempotent)
      parameters:
        - { name: expense, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Approved and posted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /expenses/{expense}/reject:
    post:
      tags: [Accounting]
      summary: Reject a submitted expense with a reason
      parameters:
        - { name: expense, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '200': { description: Rejected }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /expenses/{expense}/reverse:
    post:
      tags: [Accounting]
      summary: Reverse an approved expense exactly once
      parameters:
        - { name: expense, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '200': { description: Reversed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /opening-balances:
    get:
      tags: [Accounting]
      summary: List opening balance batches
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, posted, reversed] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Opening balance batches }
    post:
      tags: [Accounting]
      summary: Create a draft opening balance batch; each currency must balance on its own
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpeningBalanceInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /opening-balances/{batch}:
    get:
      tags: [Accounting]
      summary: Get an opening balance batch with its lines
      parameters:
        - { name: batch, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Opening balance batch }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
    delete:
      tags: [Accounting]
      summary: Discard a draft opening balance batch
      parameters:
        - { name: batch, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Discarded }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
  /opening-balances/{batch}/reconciliation:
    get:
      tags: [Accounting]
      summary: Reconcile a batch against the ledger and AR/AP control accounts
      parameters:
        - { name: batch, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Reconciliation report }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /opening-balances/{batch}/post:
    post:
      tags: [Accounting]
      summary: Post a draft opening balance batch as one journal entry per currency (idempotent)
      parameters:
        - { name: batch, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Posted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /opening-balances/{batch}/reverse:
    post:
      tags: [Accounting]
      summary: Reverse a posted opening balance batch by reversing each journal entry
      parameters:
        - { name: batch, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '200': { description: Reversed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /fiscal-years/{fiscalYear}/close-checks:
    get:
      tags: [Accounting]
      summary: Pre-close validation checks for a fiscal year
      description: Each check has code, passed, message and count; draft_entries and submitted_expenses also carry `details` ([{branch_code, count}], across all branches including ones the caller cannot access).
      parameters:
        - { name: fiscalYear, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Close checks }
  /fiscal-years/{fiscalYear}/close-preview:
    get:
      tags: [Accounting]
      summary: Preview the closing entries close would post (posts nothing; permission periods.view)
      description: Per branch with profit-and-loss activity, the lines in base currency minor units (account code/name, debit_minor, credit_minor) and net_profit_minor moved to retained earnings. Uses the same computation as close.
      parameters:
        - { name: fiscalYear, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Closing entries preview }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /fiscal-years/{fiscalYear}/close:
    post:
      tags: [Accounting]
      summary: "Close a fiscal year: post one closing entry per branch moving profit and loss into retained earnings"
      parameters:
        - { name: fiscalYear, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Closed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /fiscal-years/{fiscalYear}/reopen:
    post:
      tags: [Accounting]
      summary: Reopen a closed fiscal year by reversing its closing entries
      parameters:
        - { name: fiscalYear, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
                restore_period_status: { type: boolean, default: false, description: "After the closing entries are reversed, restore soft_closed/closed periods to their status before the reopen." }
      responses:
        '200': { description: "Reopened; data includes previous_period_status ({periodId: status} before the reopen)" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /cost-centers:
    get:
      tags: [Accounting]
      summary: List cost centers (analytical dimension on journal lines)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, archived] } }
        - { name: include_archived, in: query, schema: { type: boolean } }
        - { name: with_children, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Cost centers }
    post:
      tags: [Accounting]
      summary: Create a cost center
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CostCenterInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /cost-centers/{center}:
    get:
      tags: [Accounting]
      summary: Get a cost center with its children
      parameters:
        - { name: center, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Cost center }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
    patch:
      tags: [Accounting]
      summary: Update a cost center
      parameters:
        - { name: center, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CostCenterInput' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /cost-centers/{center}/archive:
    post:
      tags: [Accounting]
      summary: Archive a cost center (rejected if it carries allocations)
      parameters:
        - { name: center, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Archived }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /journal-lines/{line}/cost-allocations:
    get:
      tags: [Accounting]
      summary: Get cost center allocations for a journal line
      parameters:
        - { name: line, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Allocations }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
    post:
      tags: [Accounting]
      summary: Allocate a posted journal line to cost centers
      parameters:
        - { name: line, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CostCenterAllocationInput' }
      responses:
        '201': { description: Allocations created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /reports/cost-center-pl:
    get:
      tags: [Accounting]
      summary: Cost center profit and loss for a period
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Cost center P&L }
  /reports/cost-center-unallocated:
    get:
      tags: [Accounting]
      summary: Journal lines without cost center allocations
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Unallocated lines }
  /fiscal-periods:
    get:
      tags: [Accounting]
      summary: List fiscal periods and status
      responses:
        '200': { description: Periods }
    post:
      tags: [Accounting]
      summary: Create a fiscal year with monthly periods (requires periods.manage)
      description: >-
        Despite the path, this creates a fiscal year and its monthly periods
        (status open). Missing `starts_on`/`ends_on`/`name` default from
        `GET /fiscal-years/suggested`. A start date that does not match the
        configured fiscal year start needs `confirm_custom_start`; dates that
        overlap an existing year are refused with 422. Audited as
        `fiscal_year.created`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 50 }
                starts_on: { type: string, format: date }
                ends_on: { type: string, format: date, description: Must be after starts_on }
                months: { type: integer, minimum: 1, maximum: 12 }
                confirm_custom_start: { type: boolean }
      responses:
        '201':
          description: Created year with its periods
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      periods:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            starts_on: { type: string, format: date }
                            ends_on: { type: string, format: date }
                            status: { type: string, enum: [open, soft_closed, closed] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
