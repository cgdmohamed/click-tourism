      parameters:
        - { name: period, in: query, schema: { type: string, enum: [today, thisMonth, lastMonth, customRange] } }
        - { name: from, in: query, description: 'Required with period=customRange', schema: { type: string, format: date } }
        - { name: to, in: query, description: 'Required with period=customRange; on or after from', schema: { type: string, format: date } }
        - { name: currency, in: query, schema: { type: string, minLength: 3, maxLength: 3 } }
      responses:
        '200':
          description: Dashboard aggregates
          content:
            application/json:
              schema:
