        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '201': { description: Reversal posted }
        '409': { $ref: '#/components/responses/Conflict' }

