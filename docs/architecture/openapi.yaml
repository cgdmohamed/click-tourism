openapi: 3.1.0
info:
  title: Tourism ERP API
  version: 0.1.0-draft
  description: |
    Draft contract for the self-hosted Tourism ERP. Additive changes within v1.
    Money is serialized as a decimal string plus the authoritative minor-unit integer.
    Every endpoint is authorized by policy and branch scope.
  contact:
    name: Architecture
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: IAM
  - name: Platform
  - name: Accounting
  - name: Commissions
  - name: Schedules
  - name: Fixed Assets
  - name: Treasury
  - name: Parties
  - name: Bookings
  - name: Payments
  - name: Reports
  - name: CRM
  - name: Webhooks

paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Authenticate and issue a Sanctum token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string, default: web }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      responses:
        '204': { description: Revoked }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user, roles, permissions, branches
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
    patch:
      tags: [Auth]
      summary: Update own profile (locale and password)
      description: Changes the caller's locale and/or password. A password change requires `current_password` and revokes every other Sanctum token, keeping only the token used for this request. Audited as `user.profile_updated` / `user.password_changed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                locale: { type: string, enum: [ar, en] }
                current_password: { type: string, format: password }
                password: { type: string, format: password, minLength: 12 }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }

  /branches:
    get:
      tags: [Platform]
      summary: List branches visible to the user
      responses:
        '200':
          description: Branches
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Branch' }
    post:
      tags: [Platform]
      summary: Create a branch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /settings:
    get:
      tags: [Platform]
      summary: Read installation settings (secrets redacted)
      responses:
        '200': { description: Settings }
    put:
      tags: [Platform]
      summary: Update settings
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }

  /feature-flags:
    get:
      tags: [Platform]
      summary: Non-sensitive installation flags (any authenticated user, no extra permission)
      responses:
        '200':
          description: Flags derived from settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [tax_enabled, credit_limit_policy, base_currency, refund_segregation]
                    properties:
                      tax_enabled: { type: boolean }
                      credit_limit_policy: { type: string, enum: [off, warn, block] }
                      base_currency: { type: string, example: EGP }
                      refund_segregation: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /decisions:
    get:
      tags: [Platform]
      summary: List unresolved product/accounting decisions (requires settings.view)
      responses:
        '200':
          description: Unresolved decisions mirroring docs/product/decisions-needed.md
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Decision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /health:
    get:
      tags: [Platform]
      security: []
      summary: Liveness and dependency status (database, cache, redis, queue, scheduler)
      description: Returns 503 only when the database is down; other failures report `degraded`.
      responses:
        '200':
          description: ok or degraded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Database unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /ready:
    get:
      tags: [Platform]
      security: []
      summary: Readiness probe (database reachable)
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ready: { type: boolean }
        '503': { description: Not ready }

  /currencies:
    get:
      tags: [Platform]
      summary: List enabled currencies
      responses:
        '200': { description: Currencies }
  /fx-rates:
    get:
      tags: [Platform]
      summary: List FX rates
      parameters:
        - { name: currency, in: query, schema: { type: string } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: FX rates }
    post:
      tags: [Platform]
      summary: Record a manual FX rate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency, rate, rate_date]
              properties:
                currency: { type: string, minLength: 3, maxLength: 3 }
                rate: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
                rate_date: { type: string, format: date }
                source: { type: string, default: manual }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation' }

  /accounts:
    get:
      tags: [Accounting]
      summary: Chart of accounts tree
      responses:
        '200': { description: Accounts }
    post:
      tags: [Accounting]
      summary: Create an account
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation' }
  /cash-accounts:
    get:
      tags: [Accounting]
      summary: Registered cash and bank accounts with ledger balances (falls back to the chart of accounts until any are registered)
      parameters:
        - { name: include_inactive, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Cash accounts }
    post:
      tags: [Accounting]
      summary: Register a cash or bank account against a postable asset account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashAccountInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /cash-accounts/{cashAccount}:
    patch:
      tags: [Accounting]
      summary: Update a registered cash or bank account
      parameters:
        - { name: cashAccount, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashAccountInput' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /transfers:
    get:
      tags: [Accounting]
      summary: List transfers between cash and bank accounts
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Transfers }
    post:
      tags: [Accounting]
      summary: Create and post a same-currency or cross-currency transfer (idempotent)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferInput' }
      responses:
        '201': { description: Posted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /transfers/{transfer}:
    get:
      tags: [Accounting]
      summary: Get a transfer
      parameters:
        - { name: transfer, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Transfer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /transfers/{transfer}/reverse:
    post:
      tags: [Accounting]
      summary: Reverse a posted transfer exactly once
      parameters:
        - { name: transfer, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '200': { description: Reversed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /expense-categories:
    get:
      tags: [Accounting]
      summary: List expense categories mapped to postable expense accounts
      parameters:
        - { name: include_inactive, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Expense categories }
    post:
      tags: [Accounting]
      summary: Create an expense category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseCategoryInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /expense-categories/{category}:
    patch:
      tags: [Accounting]
      summary: Update an expense category
      parameters:
        - { name: category, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseCategoryInput' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /expenses:
    get:
      tags: [Accounting]
      summary: List expenses
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, submitted, approved, rejected, cancelled, reversed] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Expenses }
    post:
      tags: [Accounting]
      summary: Create a draft expense, optionally submitting it for approval (idempotent)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /expenses/{expense}:
    get:
      tags: [Accounting]
      summary: Get an expense
      parameters:
        - { name: expense, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Expense }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
    patch:
      tags: [Accounting]
      summary: Edit a draft expense
      parameters:
        - { name: expense, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /expenses/{expense}/submit:
    post:
      tags: [Accounting]
      summary: Submit a draft expense for approval
      parameters:
        - { name: expense, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Submitted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /expenses/{expense}/cancel:
    post:
      tags: [Accounting]
      summary: Cancel an unposted expense
      parameters:
        - { name: expense, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Cancelled }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /expenses/{expense}/approve:
    post:
      tags: [Accounting]
      summary: Approve a submitted expense and post it to the ledger (idempotent)
      parameters:
        - { name: expense, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Approved and posted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /expenses/{expense}/reject:
    post:
      tags: [Accounting]
      summary: Reject a submitted expense with a reason
      parameters:
        - { name: expense, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '200': { description: Rejected }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /expenses/{expense}/reverse:
    post:
      tags: [Accounting]
      summary: Reverse an approved expense exactly once
      parameters:
        - { name: expense, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '200': { description: Reversed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /commission-rules:
    get:
      tags: [Commissions]
      summary: List commission rule versions
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, pending_approval, approved, rejected, retired] } }
        - { name: beneficiary_type, in: query, schema: { type: string, enum: [employee, agent, branch] } }
        - { name: code, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Rules }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Commissions]
      summary: Create a draft commission rule (version 1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommissionRuleInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /commission-rules/{commissionRule}:
    get:
      tags: [Commissions]
      summary: Get a commission rule version
      parameters:
        - { name: commissionRule, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Rule }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
    patch:
      tags: [Commissions]
      summary: Edit a draft or rejected rule version (approved versions are immutable)
      parameters:
        - { name: commissionRule, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommissionRuleInput' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Commissions]
      summary: Delete a draft rule version
      parameters:
        - { name: commissionRule, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /commission-rules/{commissionRule}/new-version:
    post:
      tags: [Commissions]
      summary: Start the next version of a rule as a draft
      parameters:
        - { name: commissionRule, in: path, required: true, schema: { type: string } }
      responses:
        '201': { description: Draft version }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /commission-rules/{commissionRule}/submit:
    post:
      tags: [Commissions]
      summary: Submit a draft rule for approval
      parameters:
        - { name: commissionRule, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Submitted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /commission-rules/{commissionRule}/approve:
    post:
      tags: [Commissions]
      summary: 'Approve a submitted rule (the previous version ends the day before this one starts)'
      parameters:
        - { name: commissionRule, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Approved }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /commission-rules/{commissionRule}/reject:
    post:
      tags: [Commissions]
      summary: Reject a submitted rule
      parameters:
        - { name: commissionRule, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 255 } } }
      responses:
        '200': { description: Rejected }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /commission-rules/{commissionRule}/retire:
    post:
      tags: [Commissions]
      summary: Disable an approved rule (existing accruals are untouched)
      parameters:
        - { name: commissionRule, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Retired }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /commissions:
    get:
      tags: [Commissions]
      summary: List commission accruals of the current branch
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [accrued, approved, posted, paid, rejected, reversed, cancelled] } }
        - { name: beneficiary_type, in: query, schema: { type: string, enum: [employee, agent, branch] } }
        - { name: booking_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Commissions }
        '403': { $ref: '#/components/responses/Forbidden' }
  /commissions/beneficiaries:
    get:
      tags: [Commissions]
      summary: Beneficiaries with commission activity and their payable totals
      parameters:
        - { name: beneficiary_type, in: query, schema: { type: string, enum: [employee, agent, branch] } }
      responses:
        '200': { description: One row per beneficiary }
        '403': { $ref: '#/components/responses/Forbidden' }
  /commissions/statement:
    get:
      tags: [Commissions]
      summary: Commission statement of one beneficiary (accruals, payouts, reversals)
      parameters:
        - { name: beneficiary_type, in: query, required: true, schema: { type: string, enum: [employee, agent, branch] } }
        - { name: beneficiary_id, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Statement }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Beneficiary not found }
        '422': { $ref: '#/components/responses/Validation' }
  /commissions/{commission}:
    get:
      tags: [Commissions]
      summary: Get a commission with its payments
      parameters:
        - { name: commission, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Commission }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /commissions/{commission}/override:
    post:
      tags: [Commissions]
      summary: 'Propose a different amount (takes effect once someone else approves)'
      parameters:
        - { name: commission, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
