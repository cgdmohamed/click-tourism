        '404': { description: Not found }
  /opening-balances/{batch}/post:
    post:
      tags: [Accounting]
      summary: Post a draft opening balance batch as one journal entry per currency (idempotent)
      parameters:
        - { name: batch, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Posted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /opening-balances/{batch}/reverse:
    post:
      tags: [Accounting]
      summary: Reverse a posted opening balance batch by reversing each journal entry
      parameters:
        - { name: batch, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
