                    properties:
                      total: { type: integer }
                      imported: { type: integer }
                      preview: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
