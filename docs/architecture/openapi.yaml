                type: object
                properties:
                  data: { $ref: '#/components/schemas/SupplierPayment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /supplier-payments/{id}/invoice-applications:
    post:
      tags: [Payments]
      summary: Apply a supplier payment to an issued supplier invoice (requires supplier_payments.create; idempotent)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceApplicationInput' }
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/InvoiceApplication' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /leads/{id}:
    patch:
      tags: [CRM]
      summary: Update a lead (requires leads.update)
      description: Sending `stage` moves the lead; `note` is recorded as a lead activity; `notes` replaces the lead notes field.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadUpdateInput' }
      responses:
        '200':
          description: Updated lead
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Lead' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /users:
    get:
      tags: [CRM]
      summary: List branch users for assignment pickers (requires leads.update)
      parameters:
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200':
          description: Users in the caller's branch (id, name, email)
        '403': { $ref: '#/components/responses/Forbidden' }
  /assignment-rules:
    get:
      tags: [CRM]
      summary: List lead assignment rules (requires leads.view)
      description: Returns branch-specific and global rules ordered by priority. Inactive rules are omitted unless `include_inactive` is true.
      parameters:
        - { name: include_inactive, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AssignmentRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [CRM]
      summary: Create an assignment rule (requires leads.update)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentRuleInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AssignmentRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /assignment-rules/{id}:
    patch:
      tags: [CRM]
      summary: Update an assignment rule (requires leads.update)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentRuleUpdateInput' }
      responses:
        '200':
          description: Updated rule
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AssignmentRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [CRM]
      summary: Delete an assignment rule (requires leads.update)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Permission or branch scope denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Validation:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: State, idempotency, or concurrency conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
        code: { type: string }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
        requestId: { type: string }
    Decision:
      type: object
      properties:
        id: { type: string, example: DEC-001 }
        type: { type: string, example: ACC }
        title_en: { type: string }
        title_ar: { type: string }
        blocks: { type: string }
        status: { type: string, enum: [open, decided] }
    Health:
      type: object
      properties:
        data:
          type: object
          properties:
            status: { type: string, enum: [ok, degraded, down] }
            version: { type: string }
            checks:
              type: object
              properties:
                app: { type: object, properties: { status: { type: string } } }
                database: { type: object, properties: { status: { type: string }, latency_ms: { type: integer } } }
                cache: { type: object, properties: { status: { type: string }, driver: { type: string } } }
                redis: { type: object, properties: { status: { type: string, enum: [ok, down, not_configured] } } }
                queue: { type: object, properties: { status: { type: string }, driver: { type: string }, failed_jobs: { type: integer } } }
                scheduler: { type: object, properties: { status: { type: string, enum: [ok, stale, unknown] }, last_run_at: { type: [string, 'null'] } } }
            unresolved_decisions:
              type: array
              items: { $ref: '#/components/schemas/Decision' }
    GeneralLedger:
      type: object
      properties:
        data:
          type: object
          properties:
            currency: { type: string }
            basis: { type: string, enum: [base, original] }
            account: { type: object }
            from: { type: string, format: date }
            to: { type: string, format: date }
            opening_minor: { type: integer }
            total_debit_minor: { type: integer }
            total_credit_minor: { type: integer }
            closing_minor: { type: integer }
            lines:
              type: array
              items:
                type: object
                properties:
                  entry_id: { type: string }
                  number: { type: string }
                  entry_date: { type: string, format: date }
                  memo: { type: [string, 'null'] }
                  description: { type: [string, 'null'] }
                  account_code: { type: string }
                  source_type: { type: [string, 'null'] }
                  currency: { type: string }
                  debit_minor: { type: integer }
                  credit_minor: { type: integer }
                  base_debit_minor: { type: integer }
                  base_credit_minor: { type: integer }
                  balance_minor: { type: integer }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            last_page: { type: integer }
            total: { type: integer }
            per_page: { type: integer }
    Money:
      type: object
      required: [amount, currency, amountMinor]
      properties:
        amount: { type: string, example: '1234.50' }
        amountMinor: { type: integer, example: 123450 }
        currency: { type: string, example: EGP }
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        locale: { type: string, enum: [ar, en] }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
        branches:
          type: array
          items: { $ref: '#/components/schemas/Branch' }
    Branch:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name_ar: { type: string }
        name_en: { type: string }
        accounting_mode: { type: string, enum: [dimension, customer, independent] }
        is_active: { type: boolean }
    BranchInput:
      type: object
      required: [code, name_ar, name_en]
      properties:
        code: { type: string, maxLength: 20 }
        name_ar: { type: string }
        name_en: { type: string }
        accounting_mode: { type: string, enum: [dimension, customer, independent], default: dimension }
    Account:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name_ar: { type: string }
        name_en: { type: string }
        type: { type: string, enum: [asset, liability, equity, revenue, expense] }
        parent_id: { type: string, nullable: true }
        is_postable: { type: boolean }
        is_active: { type: boolean }
    JournalLineInput:
      type: object
      required: [account_id]
      properties:
        account_id: { type: string }
        debit_minor: { type: integer, minimum: 0, default: 0 }
        credit_minor: { type: integer, minimum: 0, default: 0 }
        party_type: { type: string, enum: [customer, supplier, payee], nullable: true }
        party_id: { type: string, nullable: true }
        description: { type: string }
    JournalEntryInput:
      type: object
      required: [entry_date, branch_id, currency, fx_rate, lines]
      properties:
        entry_date: { type: string, format: date }
        branch_id: { type: string }
        currency: { type: string }
        fx_rate: { type: string, example: '1.0000000000' }
        fx_rate_date: { type: string, format: date }
        fx_rate_source: { type: string, default: manual }
        memo: { type: string }
        post: { type: boolean, default: true }
        lines:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/JournalLineInput' }
    CustomerInput:
      type: object
      required: [type, name_ar, name_en, branch_id]
      properties:
        type: { type: string, enum: [individual, company] }
        name_ar: { type: string }
        name_en: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        tax_id: { type: string }
        branch_id: { type: string }
        credit_limit_minor: { type: integer, default: 0 }
    BookingItemInput:
      type: object
      required: [service_type, description, quantity, unit_cost_minor, unit_sell_minor]
      properties:
        service_type: { type: string, enum: [flight, hotel, transport, visa, program, other] }
        supplier_id: { type: string, nullable: true }
        description: { type: string }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        quantity: { type: number, default: 1 }
        unit_cost_minor: { type: integer, minimum: 0 }
        unit_sell_minor: { type: integer, minimum: 0 }
        cost_currency: { type: string }
        sell_currency: { type: string }
        tax_profile_id: { type: string, nullable: true }
    BookingInput:
      type: object
      required: [customer_id, branch_id, owner_user_id, start_date, currency, fx_rate, items]
      properties:
        customer_id: { type: string }
        branch_id: { type: string }
        owner_user_id: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        pax_adults: { type: integer, minimum: 1, default: 1 }
        pax_children: { type: integer, minimum: 0, default: 0 }
        pax_infants: { type: integer, minimum: 0, default: 0 }
        currency: { type: string }
        fx_rate: { type: string }
        notes: { type: string }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/BookingItemInput' }
    PaymentInput:
      type: object
      required: [customer_id, branch_id, cash_account_id, amount_minor, currency, fx_rate]
      properties:
        customer_id: { type: string }
        booking_id: { type: string, nullable: true }
        branch_id: { type: string }
        method: { type: string, enum: [cash, bank_transfer, card, wallet] }
        cash_account_id: { type: string }
        amount_minor: { type: integer, minimum: 1 }
        currency: { type: string }
        fx_rate: { type: string }
        paid_at: { type: string, format: date-time }
        allocations:
          type: array
          items:
            type: object
            required: [booking_id, amount_minor]
            properties:
              booking_id: { type: string }
              amount_minor: { type: integer, minimum: 1 }
    CashAccount:
      type: object
      properties:
        id: { type: string }
        cash_account_id: { type: string }
        code: { type: string }
        name_ar: { type: string }
        name_en: { type: string }
        kind: { type: string, enum: [cash, bank] }
        currency: { type: string }
        bank_name: { type: string, nullable: true }
        account_last4: { type: string, nullable: true }
        is_active: { type: boolean }
        registered: { type: boolean }
        balance_minor: { type: integer, nullable: true }
        balance_currency: { type: string, nullable: true }
    CashAccountInput:
      type: object
      required: [kind, name_ar, name_en, currency]
      properties:
        kind: { type: string, enum: [cash, bank] }
        name_ar: { type: string }
        name_en: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        account_id: { type: string }
        account_code: { type: string }
        branch_id: { type: string }
        bank_name: { type: string }
        account_last4: { type: string, pattern: '^\\d{4}$' }
    Transfer:
      type: object
      properties:
        id: { type: string }
        number: { type: string }
        transfer_date: { type: string, format: date }
        from: { $ref: '#/components/schemas/CashAccount' }
        to: { $ref: '#/components/schemas/CashAccount' }
        from_currency: { type: string }
        from_amount_minor: { type: integer }
        from_fx_rate: { type: string }
        to_currency: { type: string }
        to_amount_minor: { type: integer }
        to_fx_rate: { type: string }
        fee_minor: { type: integer }
        memo: { type: string, nullable: true }
        status: { type: string, enum: [posted, reversed] }
        journal_entry_id: { type: string, nullable: true }
    TransferInput:
      type: object
      required: [from_cash_account_id, to_cash_account_id, transfer_date, amount_minor]
      properties:
        from_cash_account_id: { type: string }
        to_cash_account_id: { type: string }
        transfer_date: { type: string, format: date }
        amount_minor: { type: integer, minimum: 1 }
        to_amount_minor: { type: integer, minimum: 1 }
        from_fx_rate: { type: string }
        to_fx_rate: { type: string }
        fee_minor: { type: integer, minimum: 0, default: 0 }
        memo: { type: string }
    Expense:
      type: object
      properties:
        id: { type: string }
        number: { type: string }
        expense_date: { type: string, format: date }
        category: { $ref: '#/components/schemas/ExpenseCategory' }
        payee_type: { type: string, enum: [none, supplier] }
        payee_name: { type: string, nullable: true }
        cash_account_id: { type: string, nullable: true }
        currency: { type: string }
        fx_rate: { type: string }
        amount_minor: { type: integer }
        tax_minor: { type: integer }
        net_minor: { type: integer }
        description: { type: string }
        reference: { type: string, nullable: true }
        status: { type: string, enum: [draft, submitted, approved, rejected, cancelled, reversed] }
        rejection_reason: { type: string, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        journal_entry_id: { type: string, nullable: true }
    ExpenseInput:
      type: object
      required: [category_id, expense_date, amount_minor, currency, description]
      properties:
        category_id: { type: string }
        expense_date: { type: string, format: date }
        amount_minor: { type: integer, minimum: 1 }
        tax_minor: { type: integer, minimum: 0, default: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        fx_rate: { type: string }
        description: { type: string }
        reference: { type: string }
        payee_type: { type: string, enum: [none, supplier] }
        payee_id: { type: string }
        payee_name: { type: string }
        cash_account_id: { type: string }
        submit: { type: boolean, default: false }
    ExpenseCategory:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name_ar: { type: string }
        name_en: { type: string }
        account_id: { type: string }
        account_code: { type: string }
        is_active: { type: boolean }
    ExpenseCategoryInput:
      type: object
      required: [code, name_ar, name_en, account_id]
      properties:
        code: { type: string, maxLength: 30 }
        name_ar: { type: string }
        name_en: { type: string }
        account_id: { type: string }
    OpeningBalanceBatch:
      type: object
      properties:
        id: { type: string }
        branch_id: { type: string }
        as_of_date: { type: string, format: date }
        memo: { type: string, nullable: true }
        status: { type: string, enum: [draft, posted, reversed] }
        posted_at: { type: string, format: date-time, nullable: true }
        reversal_reason: { type: string, nullable: true }
        lines:
          type: array
          items: { $ref: '#/components/schemas/OpeningBalanceLine' }
    OpeningBalanceLine:
      type: object
      properties:
        account: { $ref: '#/components/schemas/Account' }
        currency: { type: string }
        fx_rate: { type: string }
        debit_minor: { type: integer }
        credit_minor: { type: integer }
        party_type: { type: string, nullable: true }
        party_id: { type: string, nullable: true }
        description: { type: string, nullable: true }
    OpeningBalanceInput:
      type: object
      required: [as_of_date, lines]
      properties:
        as_of_date: { type: string, format: date }
        memo: { type: string }
        lines:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/OpeningBalanceLineInput' }
    OpeningBalanceLineInput:
      type: object
      required: [account_id]
      properties:
        account_id: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        fx_rate: { type: string }
        debit_minor: { type: integer, minimum: 0, default: 0 }
        credit_minor: { type: integer, minimum: 0, default: 0 }
        party_type: { type: string, enum: [customer, supplier], nullable: true }
        party_id: { type: string }
        description: { type: string }
    FiscalYear:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        status: { type: string, enum: [open, closed] }
        closed_at: { type: string, format: date-time, nullable: true }
        close_count: { type: integer }
        periods:
          type: array
          items: { type: object }
    Invoice:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [customer_invoice, supplier_invoice, credit_note] }
        series: { type: string }
        number: { type: string }
        party_type: { type: string, enum: [customer, supplier] }
        party_id: { type: string }
        party: { type: object }
        branch_id: { type: string }
        booking_id: { type: string }
        issue_date: { type: string, format: date }
        due_date: { type: string, format: date, nullable: true }
        currency: { type: string }
        fx_rate: { type: string }
        status: { type: string, enum: [draft, submitted, approved, issued, voided] }
        subtotal_minor: { type: integer }
        tax_minor: { type: integer }
        total_minor: { type: integer }
        outstanding_minor: { type: integer }
        journal_entry_id: { type: string, nullable: true }
        credit_note_of_id: { type: string, nullable: true }
        memo: { type: string, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        issued_at: { type: string, format: date-time, nullable: true }
        created_by: { type: string }
        lines:
          type: array
          items: { $ref: '#/components/schemas/InvoiceLine' }
    InvoiceLine:
      type: object
      properties:
        account: { $ref: '#/components/schemas/Account' }
        description: { type: string, nullable: true }
        debit_minor: { type: integer }
        credit_minor: { type: integer }
        tax_minor: { type: integer }
        tax_account: { $ref: '#/components/schemas/Account' }
        party_type: { type: string, nullable: true }
        party_id: { type: string, nullable: true }
    InvoiceInput:
      type: object
      required: [type, party_type, party_id, issue_date, currency, lines]
      properties:
        type: { type: string, enum: [customer_invoice, supplier_invoice] }
        series: { type: string }
        party_type: { type: string, enum: [customer, supplier] }
        party_id: { type: string }
        booking_id: { type: string }
        issue_date: { type: string, format: date }
        due_date: { type: string, format: date }
        currency: { type: string, minLength: 3, maxLength: 3 }
        fx_rate: { type: string }
        memo: { type: string }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/InvoiceLineInput' }
    InvoiceLineInput:
      type: object
      required: [account_id]
      properties:
        account_id: { type: string }
        description: { type: string }
        debit_minor: { type: integer, minimum: 0, default: 0 }
        credit_minor: { type: integer, minimum: 0, default: 0 }
        tax_minor: { type: integer, minimum: 0, default: 0 }
        tax_account_id: { type: string }
        party_type: { type: string, enum: [customer, supplier], nullable: true }
        party_id: { type: string }
    CostCenter:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name_ar: { type: string }
        name_en: { type: string }
        parent_id: { type: string, nullable: true }
        status: { type: string, enum: [active, archived] }
        effective_from: { type: string, format: date, nullable: true }
        effective_to: { type: string, format: date, nullable: true }
        is_active: { type: boolean }
        children:
          type: array
          items: { $ref: '#/components/schemas/CostCenter' }
    CostCenterInput:
      type: object
      required: [code, name_ar, name_en]
      properties:
        code: { type: string, maxLength: 40 }
        name_ar: { type: string }
        name_en: { type: string }
        parent_id: { type: string }
        status: { type: string, enum: [active, archived] }
        effective_from: { type: string, format: date }
        effective_to: { type: string, format: date }
        is_active: { type: boolean }
    CostCenterAllocation:
      type: object
      properties:
