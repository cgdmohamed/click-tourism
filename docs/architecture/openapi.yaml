                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '200': { description: Reversed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /fiscal-years/{fiscalYear}/close-checks:
    get:
      tags: [Accounting]
      summary: Pre-close validation checks for a fiscal year
      description: Each check has code, passed, message and count; draft_entries and submitted_expenses also carry `details` ([{branch_code, count}], across all branches including ones the caller cannot access).
      parameters:
        - { name: fiscalYear, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Close checks }
  /fiscal-years/{fiscalYear}/close-preview:
    get:
      tags: [Accounting]
      summary: Preview the closing entries close would post (posts nothing; permission periods.view)
      description: Per branch with profit-and-loss activity, the lines in base currency minor units (account code/name, debit_minor, credit_minor) and net_profit_minor moved to retained earnings. Uses the same computation as close.
      parameters:
        - { name: fiscalYear, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Closing entries preview }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /fiscal-years/{fiscalYear}/close:
    post:
      tags: [Accounting]
      summary: "Close a fiscal year: post one closing entry per branch moving profit and loss into retained earnings"
      parameters:
        - { name: fiscalYear, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Closed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /fiscal-years/{fiscalYear}/reopen:
    post:
      tags: [Accounting]
      summary: Reopen a closed fiscal year by reversing its closing entries
      parameters:
        - { name: fiscalYear, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
                restore_period_status: { type: boolean, default: false, description: "After the closing entries are reversed, restore soft_closed/closed periods to their status before the reopen." }
      responses:
        '200': { description: "Reopened; data includes previous_period_status ({periodId: status} before the reopen)" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /cost-centers:
