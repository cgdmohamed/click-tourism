      summary: Straight-line depreciation schedule for one asset
      parameters:
        - { name: asset, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'Period rows with amount, accumulated and carrying value' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /fixed-assets/{asset}/audit-trail:
    get:
      tags: [Fixed Assets]
      summary: Audit events and transfer history for one asset
      parameters:
        - { name: asset, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'Asset, events and transfers' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /depreciation-runs:
    get:
      tags: [Fixed Assets]
      summary: List depreciation runs
      parameters:
        - { name: period, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [draft, posted, failed, reversed] } }
      responses:
        '200': { description: Runs with items }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Fixed Assets]
      summary: Create a draft depreciation run for one branch and period
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepreciationRunInput' }
      responses:
        '201': { description: Draft run; a second run for the same period skips already-claimed assets }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /depreciation-runs/preview:
    get:
      tags: [Fixed Assets]
      summary: Preview depreciation due for a branch and period without storing anything
      parameters:
