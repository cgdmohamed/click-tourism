        debit_minor: { type: integer, minimum: 0, default: 0 }
        credit_minor: { type: integer, minimum: 0, default: 0 }
        party_type: { type: string, enum: [customer, supplier], nullable: true }
        party_id: { type: string }
        description: { type: string }
    FiscalYear:
