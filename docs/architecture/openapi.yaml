        - { name: as_of, in: query, required: true, schema: { type: string, format: date } }
        - { name: compare_as_of, in: query, description: 'Prior comparison date', schema: { type: string, format: date } }
      responses:
        '200': { description: 'Balance sheet with balanced flag, comparison and variance when requested' }
  /reports/balance-sheet/export:
    get:
      tags: [Reports]
      summary: Balance sheet export (requires reports.export; audited)
      parameters:
        - { name: as_of, in: query, required: true, schema: { type: string, format: date } }
        - { name: format, in: query, schema: { type: string, enum: [csv, xlsx, pdf], default: csv } }
        - { name: language, in: query, schema: { type: string, enum: [ar, en, bilingual], default: bilingual } }
      responses:
        '200': { description: UTF-8 CSV with BOM }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports/aging:
    get:
      tags: [Reports]
      summary: Operational AR/AP aging
      parameters:
        - { name: type, in: query, required: true, schema: { type: string, enum: [ar, ap] } }
        - { name: as_of, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Aging buckets }
  /reports/aging/export:
    get:
      tags: [Reports]
      summary: Operational AR/AP aging export (requires reports.export; audited)
      parameters:
        - { name: type, in: query, required: true, schema: { type: string, enum: [ar, ap] } }
        - { name: as_of, in: query, required: true, schema: { type: string, format: date } }
        - { name: format, in: query, schema: { type: string, enum: [csv, xlsx, pdf], default: csv } }
        - { name: language, in: query, schema: { type: string, enum: [ar, en, bilingual], default: bilingual } }
      responses:
        '200': { description: UTF-8 CSV with BOM }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports/aging-reconciliation:
    get:
      tags: [Reports]
      summary: Ledger-based AR/AP aging reconciliation
      description: Compares the posted control-account family with open invoice balances and unapplied advances. Differences are returned explicitly with codes; nothing is written off.
      parameters:
        - { name: type, in: query, required: true, schema: { type: string, enum: [ar, ap] } }
        - { name: as_of, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: 'Ledger, operational totals, buckets, advances, differences and per-party breakdown' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /reports/aging-reconciliation/export:
    get:
      tags: [Reports]
      summary: AR/AP aging reconciliation export (requires reports.export; audited)
      parameters:
        - { name: type, in: query, required: true, schema: { type: string, enum: [ar, ap] } }
        - { name: as_of, in: query, required: true, schema: { type: string, format: date } }
        - { name: format, in: query, schema: { type: string, enum: [csv, xlsx, pdf], default: csv } }
        - { name: language, in: query, schema: { type: string, enum: [ar, en, bilingual], default: bilingual } }
      responses:
        '200': { description: UTF-8 CSV with BOM }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /reports/party-statement:
    get:
      tags: [Reports]
      summary: Customer, supplier or employee statement from the posted ledger
      description: Reads the party control-account family plus genuine subaccounts; reconciles closing balance to operational open invoices/advances and returns explicit differences.
      parameters:
        - { name: party_type, in: query, required: true, schema: { type: string, enum: [customer, supplier, employee] } }
        - { name: party_id, in: query, required: true, description: 'Public id', schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: currency, in: query, description: 'Original-currency view of one transaction currency', schema: { type: string, minLength: 3, maxLength: 3 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        '200': { description: 'Statement with opening, movements, closing, subaccount split and reconciliation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /reports/party-statement/export:
    get:
      tags: [Reports]
      summary: Party statement export (requires reports.export; audited; max 50,000 rows)
      parameters:
        - { name: party_type, in: query, required: true, schema: { type: string, enum: [customer, supplier, employee] } }
        - { name: party_id, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
