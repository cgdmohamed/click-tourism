      responses:
        '200': { description: Preview rows and total }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /depreciation-runs/{run}/reverse:
    post:
      tags: [Fixed Assets]
      summary: Reverse a posted depreciation run (journal reversed, register restored, period can be run again)
      parameters:
        - { name: run, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 255 } } }
      responses:
        '200': { description: Run with status reversed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /depreciation-runs/{run}:
    get:
      tags: [Fixed Assets]
      summary: Read a depreciation run and its items
      parameters:
        - { name: run, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Run }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
    delete:
      tags: [Fixed Assets]
      summary: Delete a draft or failed run (posted runs are immutable)
      parameters:
        - { name: run, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { description: A posted run cannot be deleted }
  /depreciation-runs/{run}/post:
    post:
      tags: [Fixed Assets]
      summary: Approve and post a run; idempotent and refused in closed periods
      parameters:
        - { name: run, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Posted run with its single journal entry }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { description: 'Closed period, no assets due, or missing account mapping' }
  /reports/fixed-assets/roll-forward:
    get:
