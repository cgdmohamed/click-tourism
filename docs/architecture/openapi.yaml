  /reports/trial-balance:
    get:
      tags: [Reports]
      summary: Trial balance for a period/branch
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: branch_id, in: query, schema: { type: string } }
        - name: currency
          in: query
          description: Limit to lines posted in this transaction currency and sum original-currency amounts (`basis=original`). Omit for base-currency totals.
          schema: { type: string, minLength: 3, maxLength: 3 }
        - { name: pre_closing, in: query, description: 'Exclude year-end closing entries and show pre-close balances', schema: { type: boolean, default: false } }
        - { name: max_level, in: query, description: 'Roll every posting up to this chart-of-accounts depth (root = 1) without double counting', schema: { type: integer, minimum: 1, maximum: 20 } }
        - { name: cost_center_id, in: query, description: 'Limit to the analytical portion allocated to this cost center (public id)', schema: { type: string } }
        - { name: adjustments, in: query, description: 'Period-end adjustment voucher scope: include, exclude, or only', schema: { type: string, enum: [include, exclude, only], default: include } }
      responses:
        '200': { description: 'Trial balance with opening, period movements, closing balances and balance totals' }
  /reports/trial-balance/export:
    get:
      tags: [Reports]
      summary: Trial balance export (requires reports.export; audited)
      description: >-
        CSV layout is stable: Code, Name (EN), Name (AR), Opening debit,
        Opening credit, Debit, Credit, Closing debit, Closing credit, Abnormal
        (Yes or blank), Currency. Amounts are decimal strings in the report
        currency; the last row is the Total row with blank Code and Name (EN).
        Note that `Abnormal` was added after the first release, so consumers
        that read columns by position must select by header name.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: currency, in: query, schema: { type: string, minLength: 3, maxLength: 3 } }
        - { name: max_level, in: query, schema: { type: integer, minimum: 1, maximum: 20 } }
        - { name: cost_center_id, in: query, schema: { type: string } }
        - { name: adjustments, in: query, schema: { type: string, enum: [include, exclude, only] } }
        - { name: format, in: query, schema: { type: string, enum: [csv, xlsx, pdf], default: csv } }
        - { name: language, in: query, schema: { type: string, enum: [ar, en, bilingual], default: bilingual } }
      responses:
        '200':
          description: UTF-8 CSV with BOM; formula-like cells are neutralised
          content:
            text/csv:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports/general-ledger:
    get:
      tags: [Reports]
      summary: General ledger for one account (descendants included) with opening, running and closing balance
      description: Posted entries only, scoped to the active branch (X-Branch-Id). Balances are debit minus credit.
      parameters:
        - { name: account_id, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: currency, in: query, description: 'Original-currency view of one transaction currency', schema: { type: string, minLength: 3, maxLength: 3 } }
        - { name: party_type, in: query, schema: { type: string, enum: [customer, supplier, employee] } }
        - { name: party_id, in: query, description: 'Public id; required with party_type', schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: 'Ledger with pagination meta and source-document/party drilldown fields'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneralLedger' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
