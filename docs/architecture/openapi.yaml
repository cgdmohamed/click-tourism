  /accounting-documents:
    get:
      tags: [Accounting]
      summary: List accounting documents / vouchers
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [receipt_voucher, payment_voucher, transfer_voucher, adjustment_voucher, refund_voucher] } }
        - { name: status, in: query, schema: { type: string, enum: [draft, submitted, approved, posted, voided, rejected, cancelled] } }
        - { name: party_type, in: query, schema: { type: string, enum: [customer, supplier, employee] } }
        - { name: party_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Documents }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Accounting]
      summary: Create a draft voucher with balanced lines (idempotent)
      description: >-
        Lines must balance (total debit equals total credit). Tax breakdown per
        line is recorded as document metadata; vouchers do not auto-post tax
        lines (DEC-036).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountingDocumentInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /accounting-documents/{document}:
