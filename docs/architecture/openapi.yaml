      responses:
        '200': { description: Approved }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /commissions/{commission}/reject:
    post:
      tags: [Commissions]
      summary: Reject an accrued commission
      parameters:
        - { name: commission, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 255 } } }
      responses:
        '200': { description: Rejected }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /commissions/{commission}/post:
    post:
      tags: [Commissions]
      summary: 'Post an approved commission through the ledger (Dr commission expense, Cr beneficiary payable; idempotent)'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: commission, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Posted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /commissions/{commission}/pay:
    post:
      tags: [Commissions]
      summary: 'Pay (part of) a posted commission (Dr payable, Cr cash or bank; idempotent)'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: commission, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [cash_account_id], properties: { cash_account_id: { type: string }, amount_minor: { type: integer, minimum: 1 }, paid_on: { type: string, format: date }, reference: { type: string, maxLength: 255 } } }
      responses:
        '201': { description: Payment }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /commissions/{commission}/reverse:
    post:
      tags: [Commissions]
      summary: 'Reverse a commission (cancels an unposted accrual, reverses a posted one in the ledger)'
      parameters:
        - { name: commission, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 255 } } }
      responses:
        '200': { description: Reversed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /opening-balances:
