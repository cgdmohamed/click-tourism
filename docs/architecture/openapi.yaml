    patch:
      tags: [Accounting]
      summary: Update an account (requires accounts.update)
      description: Fields are optional. Changes that would invalidate existing postings or system account mappings are refused with 422.
      parameters:
        - { name: account, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
