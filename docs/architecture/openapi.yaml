      properties:
        customer_id: { type: string }
        branch_id: { type: string }
        owner_user_id: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        pax_adults: { type: integer, minimum: 1, default: 1 }
        pax_children: { type: integer, minimum: 0, default: 0 }
        pax_infants: { type: integer, minimum: 0, default: 0 }
        currency: { type: string }
        fx_rate: { type: string }
        notes: { type: string }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/BookingItemInput' }
    PaymentInput:
      type: object
      required: [customer_id, branch_id, cash_account_id, amount_minor, currency, fx_rate]
      properties:
        customer_id: { type: string }
