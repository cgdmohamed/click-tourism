        - { name: advance, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Cancelled }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /employees/{employee}/custody:
    post:
      tags: [Parties]
      summary: Issue a custody item to an employee (posts Dr custody / Cr cash when monetary)
      parameters:
        - { name: employee, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeCustodyInput' }
      responses:
        '201': { description: Issued }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /employees/{employee}/custody/{custody}/clear:
    post:
      tags: [Parties]
      summary: Clear a custody item (employee returned/accounted for it)
      parameters:
        - { name: employee, in: path, required: true, schema: { type: string } }
        - { name: custody, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Cleared }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /employees/{employee}/custody/{custody}/return:
    post:
      tags: [Parties]
      summary: Return a custody item to the company
      parameters:
        - { name: employee, in: path, required: true, schema: { type: string } }
        - { name: custody, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Returned }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }

  /accounting-documents:
    get:
      tags: [Accounting]
      summary: List accounting documents / vouchers
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [receipt_voucher, payment_voucher, transfer_voucher, adjustment_voucher, refund_voucher] } }
        - { name: status, in: query, schema: { type: string, enum: [draft, submitted, approved, posted, voided, rejected, cancelled] } }
        - { name: party_type, in: query, schema: { type: string, enum: [customer, supplier, employee] } }
        - { name: party_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Documents }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Accounting]
      summary: Create a draft voucher with balanced lines (idempotent)
      description: >-
        Lines must balance (total debit equals total credit). Tax breakdown per
        line is recorded as document metadata; vouchers do not auto-post tax
        lines (DEC-036).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountingDocumentInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /accounting-documents/{document}:
    get:
      tags: [Accounting]
      summary: Get a document with its lines, journal entry and reversals
      parameters:
        - { name: document, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Document }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
    patch:
      tags: [Accounting]
      summary: Edit a draft document (lines re-validated, totals recomputed)
      parameters:
        - { name: document, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountingDocumentInput' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /accounting-documents/{document}/submit:
    post:
      tags: [Accounting]
      summary: Submit a draft document for approval (idempotent)
      parameters:
        - { name: document, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Submitted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /accounting-documents/{document}/approve:
    post:
      tags: [Accounting]
      summary: Approve a submitted document (idempotent; maker-checker enforced via documents.segregation)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: document, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Approved }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /accounting-documents/{document}/post:
    post:
      tags: [Accounting]
      summary: Post an approved document to the ledger (idempotent — exactly one journal entry)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: document, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Posted with journal_entry_id }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /accounting-documents/{document}/cancel:
    post:
      tags: [Accounting]
      summary: Cancel a draft or submitted document (posted documents are corrected instead)
      parameters:
        - { name: document, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Cancelled }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /accounting-documents/{document}/reject:
    post:
      tags: [Accounting]
      summary: Reject a submitted document with a reason
      parameters:
        - { name: document, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        '200': { description: Rejected }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /accounting-documents/{document}/correct:
    post:
      tags: [Accounting]
      summary: Create the linked reversal document for a posted document (submitted for approval)
      description: >-
        Swaps every line debit/credit, keeps the original trail via
        reversal_of_id, and leaves the reversal in the submitted state so it
        goes through the normal approval workflow.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: document, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 255 }
                series: { type: string, maxLength: 10 }
                memo: { type: string, maxLength: 255 }
      responses:
        '201': { description: Reversal document created (submitted) }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }

  /bank-statements:
    get:
      tags: [Treasury]
      summary: List imported bank statements
      parameters:
        - { name: cash_account_id, in: query, schema: { type: string }, description: Registered cash account public id }
      responses:
        '200': { description: Statements }
        '403': { $ref: '#/components/responses/Forbidden' }
  /bank-statements/import:
    post:
      tags: [Treasury]
      summary: Import a CSV or XLSX bank statement for a registered bank account
      description: >-
        Amounts use bank convention: money in the bank is positive (the book
        debits the bank account), money out is negative. Duplicate lines from
        overlapping statements are skipped and reported. Re-uploading the exact
        same file is rejected. Foreign-currency bank accounts reconcile in
        their own currency.

        Opening and closing balances are never defaulted. The opening balance is
        the entered value, else derived from the file's running-balance column
        (`mapping.balance`), else the closing balance of the previous approved
        reconciliation of the account (Odoo behaviour). The closing balance is
        the entered value or the last running balance. When none is available the
        import is refused with 422. The origin is returned as `balance_source`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/BankStatementImportInput' }
      responses:
        '201': { description: Statement imported with imported_lines and skipped_duplicates }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /bank-statements/{statement}:
    get:
      tags: [Treasury]
      summary: Get an imported statement with its lines
      parameters:
        - { name: statement, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Statement }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /reconciliations:
    get:
      tags: [Treasury]
      summary: List reconciliation sessions
      parameters:
        - { name: cash_account_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [open, approved] } }
        - { name: period_from, in: query, schema: { type: string, format: date } }
        - { name: period_to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Sessions }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Treasury]
      summary: Open a reconciliation session for a bank account and period
      description: >-
        The opening book balance is derived from posted journal lines dated
        before the period start, so the session always reconciles against the
        general ledger rather than a manual figure.

        Bank opening/closing balances must be known: the entered values, the
        balances of a statement covering exactly the period, the closing of the
        previous approved session (opening) or the running balance of the
        statement lines; otherwise 422. The origin is stored as `balance_source`
        (`explicit`, `statement`, `line_balance`, `previous_session`).

        Ledger lines posted up to `treasury.reconciliation_lookahead_days`
        (default 31) after `period_to` are loaded for matching only
        (`after_period_end`): they never change the period book balance or its
        outstanding items. A look-ahead line matched in the session is added to
        the adjusted book side as `recorded_after_period_minor`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankReconciliationInput' }
      responses:
        '201': { description: 'Session with computed summary, lines, candidates and differences' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /reconciliations/{reconciliation}:
    get:
      tags: [Treasury]
      summary: Get a reconciliation with bank lines, book lines, matches and differences
      parameters:
        - { name: reconciliation, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Reconciliation detail }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /reconciliations/{reconciliation}/auto-match:
    post:
      tags: [Treasury]
      summary: Match unambiguous one-to-one candidates (never posts)
      description: >-
        Only candidates with a single bank line and a single book line of the
        same amount and direction inside tolerance and the date window are
        matched. Ambiguous pairs are counted and left for human review.
      parameters:
        - { name: reconciliation, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'Result with created, ambiguous, remaining and refreshed reconciliation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /reconciliations/{reconciliation}/matches:
    post:
      tags: [Treasury]
      summary: Match bank lines to journal lines as one group (split matches allowed)
      description: >-
        All items in one request form a single match group. Every bank line and
        journal line in the group must be fully consumed within tolerance;
        partial matches are rejected in v1. A journal line can only be consumed
        by one session.
      parameters:
        - { name: reconciliation, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankReconciliationMatchInput' }
      responses:
        '200': { description: Updated reconciliation detail }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /reconciliations/{reconciliation}/matches/{group}:
    delete:
      tags: [Treasury]
      summary: Remove a match group and release its lines
      parameters:
        - { name: reconciliation, in: path, required: true, schema: { type: string } }
        - { name: group, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated reconciliation detail }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /reconciliations/{reconciliation}/adjustment-voucher:
    post:
      tags: [Treasury]
      summary: Propose a draft adjustment voucher for unrecorded bank items
      description: >-
        Creates a draft adjustment_voucher through the normal document workflow
        (bank charges to accounting.bank_charges_account_code, interest to
        accounting.bank_interest_account_code). Nothing is posted until the
        voucher is submitted, approved and posted; the voucher is dated on the
        oldest selected bank line so it can be matched within the date window.
      parameters:
        - { name: reconciliation, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankAdjustmentVoucherInput' }
      responses:
        '201': { description: Draft adjustment voucher and updated reconciliation }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /reconciliations/{reconciliation}/approve:
    post:
      tags: [Treasury]
      summary: Approve and lock a reconciled session (idempotent)
      description: >-
        Refused while unrecorded bank items remain or the adjusted balances do
        not agree within tolerance, and when the bank balances were never
        confirmed (no `balance_source`, or an unverified legacy statement) and
        disagree with the statement movement. Approved sessions store a JSON snapshot and
        stay locked until reopened (see reopen) or corrected by a new session.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: reconciliation, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Approved session with snapshot }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /reconciliations/{reconciliation}/reopen:
    post:
      tags: [Treasury]
      summary: Reopen the newest approved session of an account (requires reconciliation.approve)
      description: Requires a reason; audited. Only the newest approved session per account can be reopened.
      parameters:
        - { name: reconciliation, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: Reopened session }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /notifications:
    get:
      tags: [Notifications]
      summary: List the signed-in user's in-app notifications
      description: >
        Newest first. `meta.unread_count` is the unread total for the user
        regardless of pagination. Notifications are per user, never shared.
      parameters:
        - { name: unread, in: query, description: 'Only unread notifications', schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Notifications and unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      last_page: { type: integer }
                      total: { type: integer }
                      per_page: { type: integer }
                      unread_count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark every notification of the signed-in user as read
      responses:
        '200':
          description: Number of notifications updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      updated: { type: integer }
                      unread_count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark one notification as read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The updated notification
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /accounting-schedules:
    get:
      tags: [Schedules]
      summary: List accrual, prepayment and deferred revenue schedules
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [prepaid_expense, deferred_revenue, accrued_expense, accrued_revenue] } }
        - { name: status, in: query, schema: { type: string, enum: [draft, active, completed, cancelled] } }
      responses:
        '200': { description: Schedules with their recognition and reversal events }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Schedules]
      summary: Create a draft schedule with its recognition events
      description: >-
        Events are generated on creation and split the total exactly; the
        rounding residual is added to the final period. Nothing is posted until
        the schedule is activated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountingScheduleInput' }
      responses:
        '201': { description: Draft schedule }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /accounting-schedules/upcoming:
    get:
      tags: [Schedules]
      summary: Recognition and reversal events due in the next N days
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
      responses:
        '200':
          description: Upcoming event rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AccountingScheduleEventRow' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /accounting-schedules/exceptions:
    get:
      tags: [Schedules]
      summary: Exception queue of failed schedule events awaiting retry
      responses:
        '200':
          description: Failed event rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AccountingScheduleEventRow' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /accounting-schedules/{schedule}:
    get:
      tags: [Schedules]
      summary: Get a schedule with its events and journal links
      parameters:
        - { name: schedule, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Schedule detail }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
    patch:
      tags: [Schedules]
      summary: Edit a draft schedule and regenerate its events
      description: Refused once the schedule is active; posted history is immutable.
      parameters:
        - { name: schedule, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountingScheduleInput' }
      responses:
        '200': { description: Updated draft schedule }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /accounting-schedules/{schedule}/activate:
    post:
      tags: [Schedules]
      summary: Approve a draft schedule and post events that are already due
      parameters:
        - { name: schedule, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Active schedule }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /accounting-schedules/{schedule}/cancel:
    post:
      tags: [Schedules]
      summary: Cancel a schedule without altering posted history
      description: >-
        Open recognitions are cancelled; a reversal of an already posted accrual
        still runs. An unamortized prepayment/deferred-revenue balance can be
        written off through a draft adjustment voucher that needs normal
        approval before it reaches the ledger.
      parameters:
        - { name: schedule, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountingScheduleCancelInput' }
      responses:
        '200':
          description: Cancelled schedule and optional draft adjustment voucher
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      schedule: { $ref: '#/components/schemas/AccountingSchedule' }
                      adjustment_document: { $ref: '#/components/schemas/AccountingDocument' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /accounting-schedules/{schedule}/events/{event}/post:
    post:
      tags: [Schedules]
      summary: Retry one pending or failed event (for example after reopening a period)
      parameters:
        - { name: schedule, in: path, required: true, schema: { type: string } }
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Schedule with the posted event }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { description: The event still cannot be posted; the failure reason is kept in the exception queue }
  /fiscal-periods/{period}/checklist:
    get:
      tags: [Accounting]
      summary: Period-end checklist (unposted documents, open reconciliations, bank accounts without a reconciliation (warning), schedules, balances, trial balance)
      parameters:
        - { name: period, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Checklist with per-check pass/fail and whether the period may be closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PeriodEndChecklist' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }

  /fiscal-periods/{period}/revaluation:
    get:
      tags: [Accounting]
      summary: Review the estimated unrealized FX gain or loss of a period for the active branch (permission `periods.view`)
      description: Read-only (DEC-008). The rows are exactly what the confirmation would post, valued at the closing rates in the exchange-rate table; `totals` separates unrealized gain and loss. Nothing is posted.
      parameters:
        - { name: period, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Estimate, switches (`enabled`, `policy_approved`, `auto_reverse`), the existing run status and the reversal date
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      period: { type: object }
                      enabled: { type: boolean }
                      policy_approved: { type: boolean }
                      auto_reverse: { type: boolean }
                      reversal_date: { type: string, format: date }
                      run_status: { type: string, nullable: true }
                      rows: { type: array, items: { type: object } }
                      totals:
                        type: object
                        properties:
                          gain_minor: { type: integer }
                          loss_minor: { type: integer }
                          net_minor: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Accounting]
      summary: Confirm and post the revaluation of a period for the active branch (permission `periods.close`)
      description: Idempotent. A period already revalued answers `already_posted` and posts nothing. 422 when revaluation is disabled or the accounting policy is not approved.
      parameters:
        - { name: period, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Outcome `posted`, `already_posted` or `nothing_to_revalue`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string }
                      entry_number: { type: string, nullable: true }
                      reversal_number: { type: string, nullable: true }
                      rows: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Revaluation disabled or policy not approved }

  /fiscal-periods/{period}/cost-accrual:
    get:
      tags: [Accounting]
      summary: Supplier costs incurred but not yet invoiced that the period would accrue (permission `periods.view`)
      description: Read-only (DEC-002). One row per booking of the active branch whose service has started by the period end and whose estimated cost exceeds the cost the ledger already carries; `already_accrued` rows are not posted again. Amounts are base-currency minor units.
      parameters:
        - { name: period, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Accrual rows, the date the accrual reverses and the total still to post
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      period: { type: object }
                      reversal_date: { type: string, format: date }
                      rows: { type: array, items: { type: object } }
                      total_minor: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Accounting]
      summary: Post the period-end cost accruals for the active branch (permission `periods.close`)
      description: Dr cost of services / Cr accrued supplier costs (setting `accounting.accrued_costs_account_code`, default 2170) per booking, dated the last day of the period and reversed automatically on the first day of the next open period (`accounting:reverse-cost-accruals`, daily). Idempotent per booking and period; the supplier invoice posts normally when it arrives, so the cost is never counted twice. 422 when the period is closed or the account is missing.
      parameters:
        - { name: period, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: '`posted` or `nothing_to_accrue` with the number of entries and the total'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string }
                      entries: { type: integer }
                      total_minor: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Period closed or account missing }

  /attachments:
    get:
      tags: [Attachments]
      summary: Documents of a record (permission `attachments.view`)
      description: |
        Lists the documents of one customer, supplier, booking, invoice, payment or expense. The caller must be allowed to view that record (permission and branch). Documents of personal-data categories (passport, visa, travel document) are left out unless the caller has `attachments.sensitive`; `hidden_sensitive_count` says how many.
      parameters:
        - { name: attachable_type, in: query, required: true, schema: { type: string, enum: [customer, supplier, booking, invoice, payment, expense] } }
        - { name: attachable_id, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: items and hidden_sensitive_count
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Record not found }
    post:
      tags: [Attachments]
      summary: Upload one or more documents to a record (permission `attachments.upload`)
      description: |
        multipart/form-data with `attachable_type`, `attachable_id`, `category` (passport, visa, booking_confirmation, supplier_invoice, payment_receipt, bank_transfer, travel_document, contract, other), optional `notes` and `files[]` (up to 10; PDF, JPEG, PNG or WebP up to 10 MB, checked by content). A file already stored for the record is not stored twice (`duplicate: true`). Refused files come back in `rejected` with a reason and do not block the others. Personal-data categories need `attachments.sensitive`.
      responses:
        '201':
          description: Stored documents and refused files
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Validation failed }
        '503': { description: 'The disk is full or not writable (`storage_unavailable`); nothing is recorded for the failing file, files stored earlier in the same request remain' }
  /attachments/{attachment}:
    get:
      tags: [Attachments]
      summary: Document metadata (permission `attachments.view`)
      parameters:
        - { name: attachment, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
    patch:
      tags: [Attachments]
      summary: Change the category or notes (permission `attachments.upload`)
      parameters:
        - { name: attachment, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
    delete:
      tags: [Attachments]
      summary: Remove a document from the record (permission `attachments.delete`)
      description: 'Soft delete: the record disappears from lists and the file is kept for audit. Audited.'
      parameters:
        - { name: attachment, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /attachments/{attachment}/download:
    get:
      tags: [Attachments]
      summary: Download the file (permission `attachments.view`)
      description: |
        Streamed through the API with `Content-Disposition: attachment`, `X-Content-Type-Options: nosniff` and a sandbox CSP; audited. Documents are never reachable by a public URL.
      parameters:
        - { name: attachment, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The file }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /attachments/{attachment}/preview:
    get:
      tags: [Attachments]
      summary: Preview the file inline (permission `attachments.view`)
      description: 'Same checks and headers as download with `Content-Disposition: inline`; audited.'
      parameters:
        - { name: attachment, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The file }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /attachments/{attachment}/extraction:
    get:
      tags: [Attachments]
      summary: Latest extraction of a document (permission `attachments.view`)
      parameters:
        - { name: attachment, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The latest extraction or null
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
    post:
      tags: [Attachments]
      summary: Ask the provider to read the document (permission `attachments.extract`)
      description: |
        A proposal only (ADR-0021): it creates no invoice, payment or customer change, posts nothing and approves nothing. Needs `attachments.extraction_enabled`, the accepted data-processing notice and a provider key (422 `extraction_unavailable` otherwise, or when the category cannot be read or the file is too large). A provider failure answers 200 with `status: failed` so the user continues by hand. An unreviewed proposal is reused instead of asking again. Unclear or missing values are flagged (`flag`: `missing` or `unclear`), never guessed. Throttled to 10 a minute.
      parameters:
        - { name: attachment, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The extraction (status succeeded or failed)
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: extraction_unavailable }
  /attachment-extractions/{extraction}/confirm:
    post:
      tags: [Attachments]
      summary: Confirm the reviewed values (permission `attachments.extract`)
      description: "`values` holds the reviewer's final value for each field (null leaves it empty). Unknown fields and values invalid for their type (date YYYY-MM-DD, plain decimal amount, 3-letter currency) are refused with 422. Confirming twice returns the first confirmation. Stores the values with the document and writes nothing else: invoices, payments and customers are changed only through their own forms and rules."
      parameters:
        - { name: extraction, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [values], properties: { values: { type: object, additionalProperties: { type: string, nullable: true } } } }
      responses:
        '200':
          description: The confirmed extraction
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Invalid values or not awaiting review }
  /attachment-extractions/{extraction}/reject:
    post:
      tags: [Attachments]
      summary: Reject a proposal (permission `attachments.extract`)
      parameters:
        - { name: extraction, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The rejected extraction
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /fixed-asset-categories:
    get:
      tags: [Fixed Assets]
      summary: List fixed-asset categories and their GL mappings
      responses:
        '200': { description: Categories }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Fixed Assets]
      summary: Create a fixed-asset category
      description: >-
        The code is optional; blank or omitted generates the next free code (FAC-001 style) and returns it. A supplied code is validated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixedAssetCategoryInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /fixed-asset-categories/{category}:
    get:
      tags: [Fixed Assets]
