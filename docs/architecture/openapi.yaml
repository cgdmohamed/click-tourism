        rate_bp: { type: integer, minimum: 1, maximum: 10000, nullable: true }
        fixed_minor: { type: integer, minimum: 1, nullable: true }
        branch_id: { type: string, nullable: true, description: Only bookings of this branch }
        service_type: { type: string, nullable: true, enum: [flight, hotel, transport, visa, program, other] }
        allow_cross_branch: { type: boolean, default: false, description: Pay a beneficiary attached to another branch }
