        branch_id: { type: string, nullable: true }
        statement_id: { type: string, nullable: true }
        period_from: { type: string, format: date }
        period_to: { type: string, format: date }
        currency: { type: string }
        status: { type: string, enum: [open, approved] }
        notes: { type: string, nullable: true }
        adjustment_document_ids:
          type: array
          items: { type: string }
