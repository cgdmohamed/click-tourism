      summary: Release one application of a supplier payment (requires supplier_payments.create)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [application_id]
              properties:
                application_id: { type: string }
      responses:
        '200':
          description: Updated supplier payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SupplierPayment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /supplier-payments/{id}/invoice-applications:
    post:
      tags: [Payments]
      summary: Apply a supplier payment to an issued supplier invoice (requires supplier_payments.create; idempotent)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceApplicationInput' }
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/InvoiceApplication' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /leads/{id}:
    patch:
      tags: [CRM]
      summary: Update a lead (requires leads.update)
      description: Sending `stage` moves the lead; `note` is recorded as a lead activity; `notes` replaces the lead notes field.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadUpdateInput' }
      responses:
        '200':
          description: Updated lead
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Lead' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /users:
    get:
      tags: [IAM]
      summary: List users (requires users.view)
      description: Global management directory across all branches (ADR-0005) — branch scope never filters this list. Inactive users are included by default; use `status` to narrow.
      parameters:
        - { name: search, in: query, schema: { type: string }, description: Matches name or email; wildcards are treated literally }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, all], default: all } }
        - { name: role, in: query, schema: { type: string }, description: Exact role name }
        - { name: branch_id, in: query, schema: { type: string }, description: Branch public id }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Paginated user accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UserAccount' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [IAM]
      summary: Create a user (requires users.manage)
      description: Audited as `user.created`. Assignable roles and branches are limited to the actor's own privileges (403 `You may not assign privileges you do not hold.` / `You may not assign a branch you are not assigned to.`); a `primary_branch_id` outside `branch_ids` fails with 422 `The primary branch must be one of the assigned branches.`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserAccountInput' }
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UserAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /users/assignable:
    get:
      tags: [CRM]
      summary: List branch users for assignment pickers (requires leads.update)
      description: Active users of the caller's branch only (X-Branch-Id), minimal fields.
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Users in the caller's branch (id, name, email)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        email: { type: string, format: email }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/{user}:
    get:
      tags: [IAM]
      summary: Show a user with effective permissions (requires users.view)
      parameters:
        - { name: user, in: path, required: true, schema: { type: string }, description: User public id }
      responses:
        '200':
          description: User account including the effective permission list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/UserAccount'
                      - type: object
                        properties:
                          permissions: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
    patch:
      tags: [IAM]
      summary: Update a user (requires users.manage)
      description: Audited as `user.updated`. `roles` and `branch_ids` replace the full sets when present. Guards apply to the fields actually changed. Deactivating the last active administrator (via role removal) fails with 422 `The last active administrator cannot be deactivated or demoted.`.
      parameters:
        - { name: user, in: path, required: true, schema: { type: string }, description: User public id }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/UserAccountInput'
                - type: object
                  description: All fields optional
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UserAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /users/{user}/deactivate:
    post:
      tags: [IAM]
      summary: Deactivate a user (requires users.manage)
      description: Idempotent. Audited as `user.deactivated` with the reason. Tokens are left in place but rejected by the active middleware while the account is disabled. Self-deactivation fails with 422 `You cannot deactivate your own account.` and the last active administrator with 422 `The last active administrator cannot be deactivated or demoted.`.
      parameters:
        - { name: user, in: path, required: true, schema: { type: string }, description: User public id }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Deactivated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UserAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /users/{user}/activate:
    post:
      tags: [IAM]
      summary: Reactivate a user (requires users.manage)
      description: Idempotent. Audited as `user.activated`.
      parameters:
        - { name: user, in: path, required: true, schema: { type: string }, description: User public id }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Reactivated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UserAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /roles:
    get:
      tags: [IAM]
      summary: List roles (requires roles.view)
      description: All installation roles (system and custom) with their permission sets and user counts.
      responses:
        '200':
          description: Role directory
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RoleRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [IAM]
      summary: Create a custom role (requires roles.manage)
      description: Audited as `role.created`. The permission set may not exceed the actor's own privileges (403 `You may not assign privileges you do not hold.`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201':
          description: Created role
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RoleRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /roles/{role}:
    patch:
      tags: [IAM]
      summary: Update a custom role (requires roles.manage)
      description: Audited as `role.updated`. System roles are immutable (422 `This role is a system role and cannot be modified or deleted.`).
      parameters:
        - { name: role, in: path, required: true, schema: { type: integer }, description: Role id }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/RoleInput'
                - type: object
                  description: All fields optional
      responses:
        '200':
          description: Updated role
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RoleRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [IAM]
      summary: Delete a custom role (requires roles.manage)
      description: Audited as `role.deleted`. System roles are immutable (422 `This role is a system role and cannot be modified or deleted.`); roles still assigned to users are refused with 422 `This role is assigned to users and cannot be deleted.`.
      parameters:
        - { name: role, in: path, required: true, schema: { type: integer }, description: Role id }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /permissions:
    get:
      tags: [IAM]
      summary: Permission catalog (requires roles.view)
      description: Every permission name known to the installation, sorted. Permission names are an API contract — additive changes only.
      responses:
        '200':
          description: Permission names
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /assignment-rules:
    get:
      tags: [CRM]
      summary: List lead assignment rules (requires leads.view)
      description: Returns branch-specific and global rules ordered by priority. Inactive rules are omitted unless `include_inactive` is true.
      parameters:
        - { name: include_inactive, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AssignmentRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [CRM]
      summary: Create an assignment rule (requires leads.update)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentRuleInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AssignmentRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /assignment-rules/{id}:
    patch:
      tags: [CRM]
      summary: Update an assignment rule (requires leads.update)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentRuleUpdateInput' }
      responses:
        '200':
          description: Updated rule
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AssignmentRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [CRM]
      summary: Delete an assignment rule (requires leads.update)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Permission or branch scope denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Validation:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: State, idempotency, or concurrency conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
        code: { type: string }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
        requestId: { type: string }
    Decision:
      type: object
      properties:
        id: { type: string, example: DEC-001 }
        type: { type: string, example: ACC }
        title_en: { type: string }
        title_ar: { type: string }
        blocks: { type: string }
        status: { type: string, enum: [open, decided] }
    Health:
      type: object
      properties:
        data:
          type: object
          properties:
            status: { type: string, enum: [ok, degraded, down] }
            version: { type: string }
            checks:
              type: object
              properties:
                app: { type: object, properties: { status: { type: string } } }
                database: { type: object, properties: { status: { type: string }, latency_ms: { type: integer } } }
                cache: { type: object, properties: { status: { type: string }, driver: { type: string } } }
                redis: { type: object, properties: { status: { type: string, enum: [ok, down, not_configured] } } }
                queue: { type: object, properties: { status: { type: string }, driver: { type: string }, failed_jobs: { type: integer } } }
                scheduler: { type: object, properties: { status: { type: string, enum: [ok, stale, unknown] }, last_run_at: { type: [string, 'null'] } } }
            unresolved_decisions:
              type: array
              items: { $ref: '#/components/schemas/Decision' }
    GeneralLedger:
      type: object
      properties:
        data:
          type: object
          properties:
            currency: { type: string }
            basis: { type: string, enum: [base, original] }
            account: { type: object }
            from: { type: string, format: date }
            to: { type: string, format: date }
            opening_minor: { type: integer }
            total_debit_minor: { type: integer }
            total_credit_minor: { type: integer }
            closing_minor: { type: integer }
            lines:
              type: array
              items:
                type: object
                properties:
                  entry_id: { type: string }
                  number: { type: string }
                  entry_date: { type: string, format: date }
                  memo: { type: [string, 'null'] }
                  description: { type: [string, 'null'] }
                  account_code: { type: string }
                  source_type: { type: [string, 'null'] }
                  currency: { type: string }
                  debit_minor: { type: integer }
                  credit_minor: { type: integer }
                  base_debit_minor: { type: integer }
                  base_credit_minor: { type: integer }
                  balance_minor: { type: integer }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            last_page: { type: integer }
            total: { type: integer }
            per_page: { type: integer }
    Money:
      type: object
      required: [amount, currency, amountMinor]
      properties:
        amount: { type: string, example: '1234.50' }
        amountMinor: { type: integer, example: 123450 }
        currency: { type: string, example: EGP }
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        locale: { type: string, enum: [ar, en] }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
        branches:
          type: array
          items: { $ref: '#/components/schemas/Branch' }
        primary_branch_id: { type: [string, 'null'], description: Public id of the user's default branch }
    UserAccount:
      type: object
      description: Management view of a login user (users.view / users.manage).
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        locale: { type: string, enum: [ar, en] }
        is_active: { type: boolean }
        is_available_for_leads: { type: boolean }
        roles: { type: array, items: { type: string } }
        branches:
          type: array
          items: { $ref: '#/components/schemas/Branch' }
        primary_branch_id: { type: [string, 'null'] }
        employee:
          type: [object, 'null']
          properties:
            id: { type: string }
            internal_code: { type: string }
            name_ar: { type: string }
            name_en: { type: string }
            category: { type: string }
        last_login_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
    UserAccountInput:
      type: object
      description: Fields for user create; on update all fields are optional (`roles` and `branch_ids` replace the full sets).
      required: [name, email, password, locale]
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, format: password, minLength: 12 }
        locale: { type: string, enum: [ar, en] }
        roles: { type: array, items: { type: string }, description: Existing role names }
        branch_ids: { type: array, items: { type: string }, description: Branch public ids }
        primary_branch_id: { type: [string, 'null'], description: Must be one of branch_ids when set }
        is_available_for_leads: { type: boolean, default: true }
    RoleRecord:
      type: object
      description: Role directory record. System roles are owned by the product and re-applied by `roles:sync` on every upgrade.
      properties:
        id: { type: integer }
        name: { type: string }
        guard: { type: string }
        permissions: { type: array, items: { type: string } }
        is_system: { type: boolean }
        users_count: { type: integer }
    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          maxLength: 255
          pattern: '^[a-z][a-z0-9_]*$'
          description: Lower snake_case, unique per installation
        permissions: { type: array, minItems: 1, items: { type: string }, description: Permission names from the catalog }
    Branch:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name_ar: { type: string }
        name_en: { type: string }
        accounting_mode: { type: string, enum: [dimension, customer, independent] }
        is_active: { type: boolean }
    BranchInput:
      type: object
      required: [code, name_ar, name_en]
      properties:
        code: { type: string, maxLength: 20 }
        name_ar: { type: string }
        name_en: { type: string }
        accounting_mode: { type: string, enum: [dimension, customer, independent], default: dimension }
    Account:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name_ar: { type: string }
        name_en: { type: string }
        type: { type: string, enum: [asset, liability, equity, revenue, expense] }
        parent_id: { type: string, nullable: true }
        is_postable: { type: boolean }
        is_active: { type: boolean }
    JournalLineInput:
      type: object
      required: [account_id]
      properties:
        account_id: { type: string }
        debit_minor: { type: integer, minimum: 0, default: 0 }
        credit_minor: { type: integer, minimum: 0, default: 0 }
        party_type: { type: string, enum: [customer, supplier, payee], nullable: true }
        party_id: { type: string, nullable: true }
        description: { type: string }
    JournalEntryInput:
      type: object
      required: [entry_date, branch_id, currency, fx_rate, lines]
      properties:
        entry_date: { type: string, format: date }
        branch_id: { type: string }
        currency: { type: string }
        fx_rate: { type: string, example: '1.0000000000' }
        fx_rate_date: { type: string, format: date }
        fx_rate_source: { type: string, default: manual }
        memo: { type: string }
        post: { type: boolean, default: true }
        lines:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/JournalLineInput' }
    CustomerInput:
      type: object
      required: [type, name_ar, name_en, branch_id]
      properties:
        type: { type: string, enum: [individual, company] }
        name_ar: { type: string }
        name_en: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        tax_id: { type: string }
        branch_id: { type: string }
        credit_limit_minor: { type: integer, default: 0 }
    BookingItemInput:
      type: object
      required: [service_type, description, quantity, unit_cost_minor, unit_sell_minor]
      properties:
