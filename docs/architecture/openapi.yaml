        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Cost center P&L }
  /reports/cost-center-unallocated:
    get:
      tags: [Accounting]
      summary: Journal lines without cost center allocations
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Unallocated lines }
  /fiscal-periods:
    get:
      tags: [Accounting]
      summary: List fiscal periods and status
      responses:
        '200': { description: Periods }
    post:
      tags: [Accounting]
      summary: Create a fiscal year with monthly periods (requires periods.manage)
      description: >-
        Despite the path, this creates a fiscal year and its monthly periods
        (status open). Missing `starts_on`/`ends_on`/`name` default from
        `GET /fiscal-years/suggested`. A start date that does not match the
        configured fiscal year start needs `confirm_custom_start`; dates that
        overlap an existing year are refused with 422. Audited as
        `fiscal_year.created`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 50 }
                starts_on: { type: string, format: date }
                ends_on: { type: string, format: date, description: Must be after starts_on }
                months: { type: integer, minimum: 1, maximum: 12 }
                confirm_custom_start: { type: boolean }
      responses:
        '201':
          description: Created year with its periods
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      periods:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            starts_on: { type: string, format: date }
                            ends_on: { type: string, format: date }
                            status: { type: string, enum: [open, soft_closed, closed] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /journal-entries:
    get:
      tags: [Accounting]
      summary: List journal entries
      responses:
        '200': { description: Entries }
    post:
      tags: [Accounting]
      summary: Create and optionally post a journal entry
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JournalEntryInput' }
      responses:
        '201': { description: Created }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /journal-entries/{id}/reverse:
