    get:
      tags: [Bookings]
      summary: List bookings
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: customer_id, in: query, schema: { type: string } }
        - { name: branch_id, in: query, schema: { type: string } }
      responses:
        '200': { description: Bookings }
    post:
      tags: [Bookings]
      summary: Create a draft booking
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingInput' }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation' }
  /bookings/{id}:
    get:
      tags: [Bookings]
      summary: Booking with customer, items, tax profiles and status history (requires bookings.view)
      description: Adds `payments_count` (distinct receipts allocated to the booking) and `invoices_count` to the booking payload.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Booking
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
    patch:
      tags: [Bookings]
      summary: Edit a draft or quoted booking (requires bookings.update)
      description: >-
        Allowed only while nothing financial exists for the booking: no
        payments, invoices, supplier obligations or journal entries. Confirmed
        bookings are corrected with adjustment documents instead. Omitting
        `items` keeps the current service lines; sending `items` replaces them
        and recalculates totals and tax.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingInput' }
      responses:
        '200': { description: Updated booking }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
