      parameters:
        - { name: as_of, in: query, schema: { type: string, format: date } }
        - { name: global, in: query, schema: { type: boolean, description: Required for installation-wide agreement after branch transfers } }
      responses:
        '200': { description: Reconciliation with per-category differences }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports/fixed-assets/schedule:
    get:
      tags: [Fixed Assets]
      summary: Depreciation schedule for one asset or the whole register
      parameters:
        - { name: asset, in: query, schema: { type: string } }
      responses:
        '200': { description: Schedule }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /reports/fixed-assets/{report}/export:
    get:
      tags: [Fixed Assets, Reports]
      summary: Fixed-asset report export (CSV, XLSX or PDF; requires assets.view and reports.export; audited)
      description: >-
        Server-side export of the same fixed-asset reports shown on screen, with the same
        branch scope (`global=1` is honoured only for users with branches.view_all; it is
        ignored for everyone else). Money columns are decimal strings in CSV and numeric
        cells in XLSX; formula-like text is neutralised. PDF is limited to 5,000 rows.
        Exports share the `report-exports` throttle (20 per minute per user, 6 per minute for PDF).
        Report parameters match the on-screen endpoint: `roll-forward` and `movements` take
        `from` and `to` (YYYY-MM); `carrying-values` takes `as_of` and `include_disposed`;
        `reconciliation` takes `as_of`; `schedule` takes an optional `asset` public id.
      parameters:
        - { name: report, in: path, required: true, schema: { type: string, enum: [roll-forward, carrying-values, movements, reconciliation, schedule] } }
        - { name: from, in: query, description: 'YYYY-MM (roll-forward, movements)', schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
        - { name: to, in: query, description: 'YYYY-MM (roll-forward, movements)', schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
        - { name: as_of, in: query, description: 'carrying-values, reconciliation', schema: { type: string, format: date } }
        - { name: include_disposed, in: query, schema: { type: boolean } }
        - { name: asset, in: query, description: 'schedule: one asset (public id)', schema: { type: string } }
        - { name: global, in: query, description: 'Installation-wide figures; requires branches.view_all', schema: { type: boolean } }
        - { name: format, in: query, schema: { type: string, enum: [csv, xlsx, pdf], default: csv } }
        - { name: language, in: query, schema: { type: string, enum: [ar, en, bilingual], default: bilingual } }
      responses:
        '200':
          description: CSV (UTF-8 with BOM), XLSX workbook or PDF document
          content:
            text/csv: { schema: { type: string } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ---------------------------------------------------------------------------
  # Operations added by the OpenAPI sync (docs/architecture README, "Contract
  # coverage"). OpenApiCoverageTest keeps this file and routes/api.php aligned.
  # ---------------------------------------------------------------------------
  /demo/status:
    get:
      tags: [Platform]
      security: []
      summary: Demo-mode status (public, throttled)
      description: Reports whether the installation runs in demo mode and when the next scheduled reset happens. `reset_seconds`, `next_reset_at` and `generation` are null when demo mode is off.
      responses:
        '200':
          description: Demo status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      reset_seconds: { type: integer, nullable: true }
                      next_reset_at: { type: string, nullable: true }
                      generation: { type: [string, integer, 'null'] }
        '429': { $ref: '#/components/responses/RateLimited' }
  /search:
    get:
      tags: [Platform]
      summary: Cross-entity quick search for the header (authenticated, throttled)
      description: Results are branch-scoped and each group is returned only when the caller holds the matching `.view` permission. Queries shorter than 2 characters return no groups. Up to 5 items per group.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        '200':
          description: Result groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total: { type: integer }
                      groups:
                        type: array
                        items:
                          type: object
                          properties:
                            type: { type: string, example: customers }
                            items:
                              type: array
                              items:
                                type: object
                                properties:
                                  id: { type: string }
                                  title_ar: { type: string }
                                  title_en: { type: string }
                                  subtitle: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
