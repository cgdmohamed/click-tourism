                type: object
                properties:
                  data: { $ref: '#/components/schemas/JournalEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
    delete:
      tags: [Accounting]
      summary: Delete a draft journal entry (requires journal.create or journal.delete_drafts)
      description: Without journal.delete_drafts a user may delete only drafts they created. Posted entries are reversed, never deleted.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
