      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [quoted, confirmed, in_progress, completed, closed, cancelled, no_show]
                reason: { type: string }
      responses:
        '200': { description: Transitioned }
