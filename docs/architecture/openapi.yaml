      properties:
        action: { type: string, enum: [assigned, reassigned, escalated] }
        from: { $ref: '#/components/schemas/LeadOwner' }
        to: { $ref: '#/components/schemas/LeadOwner' }
        attempt: { type: integer, nullable: true }
        at: { type: string, format: date-time }
    LeadOwner:
      type: object
      nullable: true
      properties:
        id: { type: string, description: User public id }
        name: { type: string }
    LeadActivity:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, description: 'created, note, stage_changed, assigned, reassigned, escalated, converted' }
        body: { type: string, nullable: true }
        actor: { $ref: '#/components/schemas/LeadOwner' }
        created_at: { type: string, format: date-time }
    PipelineReport:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        branch_id: { type: string, nullable: true }
        totals:
          type: object
          properties:
            captured: { type: integer }
            open: { type: integer }
            won: { type: integer }
            lost: { type: integer }
            converted: { type: integer }
            unassigned: { type: integer }
            conversion_rate: { type: number, description: 'won / captured * 100, one decimal' }
        by_stage:
          type: array
          items:
            type: object
            properties:
              stage: { type: string }
              name_ar: { type: string }
              name_en: { type: string }
              is_won: { type: boolean }
              is_lost: { type: boolean }
              count: { type: integer }
              share: { type: number }
        by_source:
          type: array
          items:
            type: object
            properties:
              source: { type: string, nullable: true }
              name_ar: { type: string }
              name_en: { type: string }
              count: { type: integer }
              won: { type: integer }
              conversion_rate: { type: number }
        by_owner:
          type: array
          items:
            type: object
            properties:
              owner: { type: string, nullable: true, description: 'User public id; null for unassigned leads' }
              name: { type: string, nullable: true }
              count: { type: integer }
              open: { type: integer }
              won: { type: integer }
              lost: { type: integer }
              conversion_rate: { type: number }
    Notification:
      type: object
      properties:
        id: { type: string, description: ULID public id }
        type:
          type: string
          description: Stable event type, e.g. lead.reassigned, lead.escalated, invoice.approved, expense.approved
        title: { type: string }
        body: { type: string, nullable: true }
        data:
          type: object
          additionalProperties: true
          description: Entity reference used by the UI (lead_id, invoice_id, number, ...)
        branch_id: { type: string, nullable: true }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    AssignmentRuleInput:
      type: object
      required: [strategy]
      properties:
        priority: { type: integer, minimum: 0, default: 0 }
        branch_id: { type: string, nullable: true, description: Null makes the rule global }
        source_id: { type: string, nullable: true, description: 'Lead source code (e.g. whatsapp), not the internal id' }
        service_category: { type: string, maxLength: 40, nullable: true }
        strategy: { type: string, enum: [least_loaded, round_robin, manual] }
        target_user_id: { type: string, nullable: true }
        max_leads_per_user: { type: integer, minimum: 1, nullable: true }
        is_active: { type: boolean, default: true }
    AssignmentRuleUpdateInput:
      type: object
      description: All fields optional; `branch_id` cannot be changed
      properties:
        priority: { type: integer, minimum: 0 }
        source_id: { type: string, nullable: true, description: 'Lead source code (e.g. whatsapp), not the internal id' }
        service_category: { type: string, maxLength: 40, nullable: true }
        strategy: { type: string, enum: [least_loaded, round_robin, manual] }
        target_user_id: { type: string, nullable: true }
        max_leads_per_user: { type: integer, minimum: 1, nullable: true }
        is_active: { type: boolean }
    AssignmentRule:
      type: object
      properties:
        id: { type: string }
        priority: { type: integer }
        branch_id: { type: string, nullable: true }
        source_id: { type: string, nullable: true, description: 'Lead source code (e.g. whatsapp), not the internal id' }
        service_category: { type: string, nullable: true }
        strategy: { type: string, enum: [least_loaded, round_robin, manual] }
        target_user_id: { type: [string, integer, 'null'] }
        max_leads_per_user: { type: integer, nullable: true }
        is_active: { type: boolean }
    ImportTemplate:
      type: object
      properties:
        entity: { type: string }
        version: { type: integer, description: 'Bumped on incompatible column changes' }
        label_en: { type: string }
        label_ar: { type: string }
        supports_duplicate_policy: { type: boolean }
        default_duplicate_policy: { type: string, enum: [skip, update, fail] }
        atomic: { type: boolean, description: 'All-or-nothing file (accounts, opening balances)' }
        permissions: { type: array, items: { type: string } }
        columns:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label_en: { type: string }
              label_ar: { type: string }
              type: { type: string, enum: [string, email, phone, enum, bool, currency, money, int, decimal, date] }
              required: { type: boolean }
              allowed_values: { type: array, nullable: true, items: { type: string } }
              max_length: { type: integer, nullable: true }
              example: { type: string }
              description_en: { type: string }
              description_ar: { type: string }
        options:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label_en: { type: string }
              label_ar: { type: string }
              required: { type: boolean }
    ImportJob:
      type: object
      properties:
        id: { type: string }
        entity: { type: string }
        template_version: { type: integer }
        status: { type: string, enum: [previewed, queued, running, completed, partial, failed] }
        mode: { type: string, enum: [dry_run, commit] }
        duplicate_policy: { type: string, enum: [skip, update, fail] }
        on_error: { type: string, enum: [skip, abort] }
        options: { type: object, additionalProperties: true, description: 'Upload options; after an opening-balance import `result.opening_balance_batch_id` is the created draft batch.' }
        original_name: { type: string }
        file_format: { type: string, enum: [csv, xlsx] }
        file_size: { type: integer }
        branch_id: { type: string, nullable: true }
        created_by: { type: string, nullable: true }
        total_rows: { type: integer }
        created_count: { type: integer }
        updated_count: { type: integer }
        skipped_count: { type: integer }
        error_count: { type: integer, description: 'Number of rows with at least one error' }
        preview:
          type: array
          description: First 50 rows with their planned or failed action
          items:
            type: object
            properties:
              row: { type: integer }
              action: { type: string, enum: [create, update, skip, error] }
              message: { type: string }
              values: { type: object, additionalProperties: true }
        errors:
          type: array
          description: First 200 row errors
          items:
            type: object
            properties:
              row: { type: integer, description: 'Spreadsheet row number; 0 for file-level errors' }
              field: { type: string, nullable: true }
              code: { type: string }
              message: { type: string }
              params: { type: object, additionalProperties: true }
        warnings: { type: array, items: { type: object, additionalProperties: true }, description: 'e.g. unknown_columns that were ignored' }
        has_error_report: { type: boolean }
        failure_code: { type: string, nullable: true }
        failure_message: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
