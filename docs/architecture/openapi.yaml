  /fixed-assets/{asset}/transfer:
    post:
      tags: [Fixed Assets]
      summary: Transfer an asset between branches, cost centers or custodians
      description: >-
        A change of branch posts two balanced journals at net book value, one
        per branch (events `transfer_out` and `transfer_in` of source
        `fixed_asset_transfer`), through the inter-branch clearing accounts
        (`accounting.interbranch_receivable_account_code` /
        `interbranch_payable_account_code`): source Dr accumulated depreciation,
        Dr inter-branch receivable, Cr cost; destination Dr cost, Cr accumulated
        depreciation, Cr inter-branch payable. Amounts are base-currency register
        figures. Both branches must be in the actor's branch scope (403
        otherwise) and the transfer date must fall in an open period (422).
        Cost-center or custodian changes within a branch post nothing.
      parameters:
        - { name: asset, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixedAssetTransferInput' }
      responses:
        '201': { description: 'Transfer recorded (with cost, accumulated depreciation, NBV and the two journal references) and asset attribution updated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
