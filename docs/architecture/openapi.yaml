  # ---------------------------------------------------------------------------
  # Operations added by the OpenAPI sync (docs/architecture README, "Contract
  # coverage"). OpenApiCoverageTest keeps this file and routes/api.php aligned.
  # ---------------------------------------------------------------------------
  /demo/status:
    get:
      tags: [Platform]
      security: []
      summary: Demo-mode status (public, throttled)
      description: Reports whether the installation runs in demo mode and when the next scheduled reset happens. `reset_seconds`, `next_reset_at` and `generation` are null when demo mode is off.
      responses:
        '200':
          description: Demo status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      reset_seconds: { type: integer, nullable: true }
                      next_reset_at: { type: string, nullable: true }
                      generation: { type: [string, integer, 'null'] }
        '429': { $ref: '#/components/responses/RateLimited' }
  /search:
    get:
      tags: [Platform]
      summary: Cross-entity quick search for the header (authenticated, throttled)
      description: Results are branch-scoped and each group is returned only when the caller holds the matching `.view` permission. Queries shorter than 2 characters return no groups. Up to 5 items per group.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        '200':
          description: Result groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total: { type: integer }
                      groups:
                        type: array
                        items:
                          type: object
                          properties:
                            type: { type: string, example: customers }
                            items:
                              type: array
                              items:
                                type: object
                                properties:
                                  id: { type: string }
                                  title_ar: { type: string }
                                  title_en: { type: string }
                                  subtitle: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /decisions/{id}/resolve:
    post:
      tags: [Platform]
      summary: Record the resolution of a product/accounting decision (requires settings.update)
      description: Stored in the settings registry and audited as `decision.resolved`. Unknown decision ids return 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, note]
              properties:
                status: { type: string, enum: [approved, rejected, deferred] }
                option: { type: string, maxLength: 100 }
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Resolution recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      resolution:
                        type: object
                        properties:
                          status: { type: string, enum: [approved, rejected, deferred] }
                          option: { type: string }
                          note: { type: string }
                          decided_by: { type: string }
                          decided_by_name: { type: string }
                          decided_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Unknown decision }
        '422': { $ref: '#/components/responses/Validation' }
  /accounts/{account}:
    patch:
      tags: [Accounting]
      summary: Update an account (requires accounts.update)
      description: Fields are optional. Changes that would invalidate existing postings or system account mappings are refused with 422.
      parameters:
        - { name: account, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUpdateInput' }
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /accounts/export:
    get:
      tags: [Accounting]
      summary: Export the chart of accounts as CSV (requires accounts.view)
      description: UTF-8 CSV with a BOM, in the same column layout the import accepts, so an export can be re-imported.
      responses:
        '200':
          description: chart-of-accounts.csv attachment
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /accounts/import:
    post:
      tags: [Accounting]
      summary: Import or preview a chart of accounts from CSV (requires accounts.update)
      description: Preview and real import share one validation pass; any row error rejects the whole file with 422 and `row_errors`. Parents are linked after all rows exist, so file order does not matter.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'CSV file, max 10 MB' }
                preview_only: { type: boolean, description: Validate and return the preview without writing }
      responses:
        '200':
          description: Preview (`preview`, `total`) or import result (`imported`, `preview`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total: { type: integer }
                      imported: { type: integer }
                      preview: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Validation failed (`message`, `code` validation_failed, `row_errors`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /fiscal-years/suggested:
    get:
      tags: [Accounting]
      summary: Suggested next fiscal year (requires periods.view)
      description: Derived from the configured fiscal year start and the existing years; used as the default for `POST /fiscal-periods`.
      responses:
        '200':
          description: Suggestion (starts_on, ends_on, name)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /fiscal-periods/{period}/status:
    patch:
      tags: [Accounting]
      summary: Open, soft-close or close a fiscal period (requires periods.manage)
      description: Refused with 422 for periods of a closed fiscal year (reopen the year instead) and when closing a period that still has draft journal entries.
      parameters:
        - { name: period, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, soft_closed, closed] }
                reason: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Period status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      status: { type: string, enum: [open, soft_closed, closed] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /journal-entries/{id}:
    get:
