          type: array
          items: { $ref: '#/components/schemas/BankReconciliationBankLine' }
        book_lines:
          type: array
          items: { $ref: '#/components/schemas/BankReconciliationBookLine' }
        matches:
          type: array
          items: { $ref: '#/components/schemas/BankReconciliationMatch' }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/BankReconciliationCandidate' }
        differences:
          type: array
          items: { $ref: '#/components/schemas/BankReconciliationDifference' }
    BankBalanceSource:
      type: object
      nullable: true
      description: Where the bank opening/closing balances came from; null on rows created before this was recorded (balances unverified)
      properties:
        opening: { type: string, enum: [explicit, statement, statement_unverified, line_balance, previous_session] }
        closing: { type: string, enum: [explicit, statement, statement_unverified, line_balance] }
    BankReconciliationSummary:
      type: object
      properties:
        opening_book_minor: { type: integer }
        book_movement_minor: { type: integer }
        book_closing_minor: { type: integer }
        opening_bank_minor: { type: integer }
        bank_movement_minor: { type: integer }
        bank_closing_minor: { type: integer }
        statement_balanced: { type: boolean }
        matched_bank_minor: { type: integer }
        matched_book_minor: { type: integer }
        deposits_in_transit_minor: { type: integer }
        outstanding_payments_minor: { type: integer }
        unrecorded_bank_credits_minor: { type: integer }
        unrecorded_bank_debits_minor: { type: integer }
        tolerance_difference_minor: { type: integer }
        adjusted_bank_minor: { type: integer }
        adjusted_book_minor: { type: integer }
        difference_minor: { type: integer }
        tolerance_minor: { type: integer }
        window_days: { type: integer }
        lookahead_days: { type: integer, description: 'Days after period_to in which ledger lines may be matched (setting treasury.reconciliation_lookahead_days, 0-366)' }
        recorded_after_period_minor: { type: integer, description: 'Net signed ledger amount posted after period_to that clears bank lines of this session; added to the adjusted book side, never to book_closing_minor' }
        after_period_matched_lines: { type: integer }
        reconciled: { type: boolean, description: Adjusted balances agree and no unrecorded bank item remains }
        bank_lines: { type: integer }
        book_lines: { type: integer }
    BankReconciliationBankLine:
      type: object
      properties:
        id: { type: string }
        line_date: { type: string, format: date }
        value_date: { type: string, format: date, nullable: true }
        amount_minor: { type: integer }
        balance_after_minor: { type: integer, nullable: true }
        bank_reference: { type: string, nullable: true }
        description: { type: string, nullable: true }
        party_name: { type: string, nullable: true }
        direction: { type: string, enum: [in, out] }
        matched_minor: { type: integer }
        remaining_minor: { type: integer }
    BankReconciliationBookLine:
      type: object
      properties:
        id: { type: string }
        journal_entry_id: { type: string, nullable: true }
        entry_number: { type: string, nullable: true }
        entry_date: { type: string, format: date, nullable: true }
        entry_memo: { type: string, nullable: true }
        after_period_end: { type: boolean, description: 'Posted after period_to (look-ahead): matchable, but not part of the period balance or its outstanding items' }
        matched_here_minor: { type: integer, description: Amount matched by this session (matched_minor counts every session) }
        description: { type: string, nullable: true }
        source_type: { type: string, nullable: true }
        branch_id: { type: string, nullable: true }
        debit_minor: { type: integer }
        credit_minor: { type: integer }
        amount_minor: { type: integer }
        direction: { type: string, enum: [in, out] }
        matched_minor: { type: integer }
        remaining_minor: { type: integer }
    BankReconciliationMatch:
      type: object
      properties:
        id: { type: string }
        group: { type: string, description: ULID shared by the rows of one match group }
        bank_line_id: { type: string, nullable: true }
        bank_line_date: { type: string, format: date, nullable: true }
        bank_line_description: { type: string, nullable: true }
        bank_line_amount_minor: { type: integer, nullable: true }
        journal_line_id: { type: string, nullable: true }
        journal_entry_number: { type: string, nullable: true }
        journal_entry_date: { type: string, format: date, nullable: true }
        journal_line_description: { type: string, nullable: true }
        amount_minor: { type: integer }
        kind: { type: string, enum: [auto, manual] }
        note: { type: string, nullable: true }
    BankReconciliationCandidate:
      type: object
      properties:
        bank_line_id: { type: string }
        journal_line_id: { type: string }
        line_date: { type: string, format: date }
        entry_date: { type: string, format: date }
        bank_amount_minor: { type: integer }
        book_amount_minor: { type: integer }
        amount_minor: { type: integer }
        difference_minor: { type: integer }
        days_apart: { type: integer }
        reference_match: { type: boolean }
        evidence: { type: integer, minimum: 0, maximum: 4, description: '4 bank reference = entry number, 3 = memo/description, 2 = bank description contains entry number, 1 shared word, 0 none' }
        disambiguated: { type: boolean, description: 'Equal-amount candidates resolved because this pair has strictly the best evidence for both lines' }
        after_period_end: { type: boolean }
        ambiguous: { type: boolean, description: 'Several equal-amount candidates with no single best evidence: left for manual matching' }
    BankReconciliationDifference:
      type: object
      properties:
        side: { type: string, enum: [bank, book] }
        category:
          type: string
          enum: [outstanding_payment, deposit_in_transit, unrecorded_bank_debit, unrecorded_bank_credit, tolerance_difference]
        line_id: { type: string }
        date: { type: string, format: date, nullable: true }
        description: { type: string, nullable: true }
        amount_minor: { type: integer }
        action:
          type: string
          enum: [post_adjustment, explain, carry_forward]
          description: >-
            post_adjustment when the item must be recorded in the books,
            explain when only a tolerance/timing explanation is needed, and
            carry_forward for a posted book line still outstanding at period
            end (unpresented payment or deposit in transit) that rolls into the
            next session.
