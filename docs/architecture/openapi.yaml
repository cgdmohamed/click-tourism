      responses:
        '200': { description: Unallocated lines }
  /reports/cost-center-pl/export:
    get:
      tags: [Reports]
      summary: Cost center profit and loss export (requires cost_centers.view and reports.export; audited)
      description: >-
        CSV layout: Code, Name (EN), Name (AR), Allocated revenue, Allocated
        expense, Allocated net, Currency. The last row is the Total row.
        Amounts are base-currency decimal strings (the report itself has no
        currency). Same `format`/`language` options, 5,000-row PDF cap and
        `report-exports` throttle as the other report exports.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: format, in: query, schema: { type: string, enum: [csv, xlsx, pdf], default: csv } }
        - { name: language, in: query, schema: { type: string, enum: [ar, en, bilingual], default: bilingual } }
      responses:
        '200': { description: Cost center P&L export }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports/cost-center-unallocated/export:
    get:
      tags: [Reports]
      summary: Unallocated cost center lines export (requires cost_centers.view and reports.export; audited)
      description: >-
        CSV layout: Entry no., Date, Account, Amount, Allocation, Currency.
        The last row is the Total row. Amounts are base-currency decimal
        strings. Same `format`/`language` options, 5,000-row PDF cap and
        `report-exports` throttle as the other report exports.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: format, in: query, schema: { type: string, enum: [csv, xlsx, pdf], default: csv } }
        - { name: language, in: query, schema: { type: string, enum: [ar, en, bilingual], default: bilingual } }
      responses:
        '200': { description: Unallocated lines export }
        '403': { $ref: '#/components/responses/Forbidden' }
  /fiscal-periods:
    get:
      tags: [Accounting]
      summary: List fiscal periods and status
      responses:
        '200': { description: Periods }
    post:
      tags: [Accounting]
      summary: Create a fiscal year with monthly periods (requires periods.manage)
      description: >-
        Despite the path, this creates a fiscal year and its monthly periods
        (status open). Missing `starts_on`/`ends_on`/`name` default from
        `GET /fiscal-years/suggested`. A start date that does not match the
        configured fiscal year start needs `confirm_custom_start`; dates that
        overlap an existing year are refused with 422. Audited as
        `fiscal_year.created`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 50 }
                starts_on: { type: string, format: date }
                ends_on: { type: string, format: date, description: Must be after starts_on }
                months: { type: integer, minimum: 1, maximum: 12 }
                confirm_custom_start: { type: boolean }
      responses:
        '201':
          description: Created year with its periods
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      periods:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            starts_on: { type: string, format: date }
                            ends_on: { type: string, format: date }
                            status: { type: string, enum: [open, soft_closed, closed] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /journal-entries:
    get:
      tags: [Accounting]
      summary: List journal entries
      responses:
        '200': { description: Entries }
    post:
      tags: [Accounting]
      summary: Create and optionally post a journal entry
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JournalEntryInput' }
      responses:
        '201': { description: Created }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /journal-entries/{id}/reverse:
    post:
      tags: [Accounting]
      summary: Reverse a posted entry
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '201': { description: Reversal posted }
        '409': { $ref: '#/components/responses/Conflict' }

  /imports/templates:
    get:
      tags: [Imports]
      summary: List the versioned import templates the caller may run
      description: >-
        Only entities for which the caller holds the create permission (customers.create,
        suppliers.create, employees.manage, bookings.create, accounts.update,
        opening_balances.manage) are listed. Each template carries its `version`, columns
        (stable key plus English and Arabic header), upload options and the global file limits.
      responses:
        '200':
          description: Templates and limits
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      limits:
                        type: object
                        properties:
                          max_file_bytes: { type: integer }
                          max_rows: { type: integer }
                          formats: { type: array, items: { type: string } }
                      templates: { type: array, items: { $ref: '#/components/schemas/ImportTemplate' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /imports/templates/{entity}:
    get:
      tags: [Imports]
      summary: Download a blank import template (CSV or XLSX, Arabic or English headers)
      description: >-
        Entities: customers, suppliers, employees, tour-packages, accounts, opening-balance-lines.
        The file name carries the template version (`customers-template-v1-ar.csv`). CSV is UTF-8 with
        BOM; XLSX adds a Guide sheet. Requires the entity's import permission.
      parameters:
        - { name: entity, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [csv, xlsx], default: csv } }
        - { name: locale, in: query, required: false, schema: { type: string, enum: [ar, en] }, description: 'Header language; defaults to the request locale' }
      responses:
        '200':
          description: Template file
          content:
            text/csv: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown entity (`unknown_entity`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /imports:
    get:
      tags: [Imports]
      summary: List import jobs of the current branch
      description: Limited to the caller's branches and to entities the caller may import. Preview and error payloads are omitted; fetch a job for them.
      parameters:
        - { name: entity, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [previewed, queued, running, completed, partial, failed] } }
        - { name: all_branches, in: query, required: false, schema: { type: boolean }, description: 'Include every branch the caller is assigned to' }
        - { name: per_page, in: query, required: false, schema: { type: integer, maximum: 100 } }
      responses:
        '200':
          description: Paged jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ImportJob' } }
                  meta: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Imports]
      summary: Upload a CSV/XLSX file; dry-run (default) or import directly
      description: >-
        The file is fully scanned before anything is stored: encoding (UTF-8 / UTF-16 with BOM),
        size (`IMPORTS_MAX_FILE_BYTES`, default 5 MB), row count (`IMPORTS_MAX_ROWS`, default 10000),
        cell length, header columns (key, English label, Arabic label or alias) and template version.
        File problems reject the upload with 4xx and a `code` (`invalid_encoding`, `file_too_large`,
        `too_many_rows`, `cell_too_long`, `missing_columns`, `duplicate_column`, `empty_file`,
        `no_data_rows`, `unsupported_file_type`, `unreadable_file`, `unsupported_template_version`) and
        no job is created. Small files are processed inside the request; larger ones are queued
        (job status `queued`, poll `GET /imports/{id}`).
        With `dry_run` true (default) the job ends in `previewed` and nothing is written; confirm it with
        `POST /imports/{id}/confirm`. Rows containing spreadsheet formulas (leading `=`, `@`, or `+`/`-` followed by
        non-numeric text, or a leading tab/CR) are rejected row by row with `formula_detected`.
        Requires the entity's create permission, plus its update permission when `duplicate_policy` is `update`
        (accounts: accounts.update; opening balances: opening_balances.manage). Throttled to 30 uploads per minute.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [entity, file]
              properties:
                entity: { type: string, enum: [customers, suppliers, employees, tour-packages, accounts, opening-balance-lines] }
                file: { type: string, format: binary }
                dry_run: { type: boolean, default: true }
                duplicate_policy: { type: string, enum: [skip, update, fail], description: 'Default skip (accounts: update, for compatibility). Ignored for opening-balance-lines.' }
                on_error: { type: string, enum: [skip, abort], default: skip, description: 'skip imports the valid rows (status partial); abort writes nothing when any row fails.' }
                template_version: { type: integer, description: 'Reject the upload when it does not match the current version' }
                options:
                  type: object
                  description: 'Entity options, sent as options[as_of_date]=YYYY-MM-DD and options[memo] (opening-balance-lines).'
                  additionalProperties: true
      responses:
        '201':
          description: Job created (and already finished for small files)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ImportJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown entity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: File larger than the configured limit (`file_too_large`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /imports/{job}:
    get:
      tags: [Imports]
      summary: Import job status, counts, preview rows and first row errors
      description: Requires the import permission of the job's entity and assignment to the job's branch. `preview` holds the first 50 rows; `errors` the first 200 row errors (the full list is in the error report).
      parameters:
        - { name: job, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ImportJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Imports]
      summary: Discard a previewed import
      description: Only a `previewed` job can be discarded; the stored upload and report are deleted. Other states return 409 `invalid_state`.
      parameters:
        - { name: job, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Discarded }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /imports/{job}/confirm:
    post:
      tags: [Imports]
      summary: Confirm a previewed import and run it
      description: >-
        Moves the job `previewed` to `queued` atomically (a second call returns 409 `invalid_state`) and
        re-validates every row at write time. Final statuses: `completed` (no row errors), `partial` (some rows
        imported, some failed; see the error report), `failed` (nothing imported: all rows invalid, an atomic
        entity such as accounts or opening balances had any error, or `on_error` was abort). Writes are audited
        (`import.uploaded`, `import.previewed`, `import.confirmed`, `import.completed|partial|failed` plus the
        per-record events); the uploaded file is deleted once the job is final.
      parameters:
        - { name: job, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Job after confirmation (queued for large files)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ImportJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /imports/{job}/errors:
    get:
      tags: [Imports]
      summary: Download the partial-failure report (CSV)
      description: One line per row error (`row`, `field`, `code`, `message`) followed by the original cell values. Cells that could run as spreadsheet formulas are neutralised with a leading apostrophe. 404 `no_error_report` when the job has no errors.
      parameters:
        - { name: job, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: CSV report
          content:
            text/csv: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No report for this job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /customers:
    get:
      tags: [Parties]
      summary: List customers
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: branch_id, in: query, schema: { type: string } }
      responses:
        '200': { description: Customers }
    post:
      tags: [Parties]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation' }
  /suppliers:
    get:
      tags: [Parties]
      summary: List suppliers
      responses:
        '200': { description: Suppliers }
    post:
      tags: [Parties]
      summary: Create a supplier
      responses:
        '201': { description: Created }

  /tour-packages:
    get:
      tags: [Bookings]
      summary: List branch-scoped tourism packages with departures (bookings.view)
      responses:
        '200': { description: Packages and departure seat counts }
    post:
      tags: [Bookings]
      summary: Create domestic, international, pilgrimage, corporate, private, or standalone program (bookings.create)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category, execution_type, currency, base_price_minor, estimated_cost_minor]
              properties:
                name: { type: string }
                category: { type: string, enum: [domestic, international, umrah, hajj, corporate, day_trip, other] }
                execution_type: { type: string, enum: [fixed, private, standalone] }
                description: { type: string }
                destination: { type: string }
                currency: { type: string }
                base_price_minor: { type: integer, minimum: 0 }
                estimated_cost_minor: { type: integer, minimum: 0 }
      responses:
        '201': { description: Package created }
        '422': { $ref: '#/components/responses/Validation' }
  /tour-packages/{package}:
    get:
      tags: [Bookings]
      summary: Get program with scheduled departures
      parameters:
        - { name: package, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Package details }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tour-packages/{package}/departures:
    post:
      tags: [Bookings]
      summary: Add a capacity-controlled date to a fixed program
      parameters:
        - { name: package, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starts_on, capacity]
              properties:
                starts_on: { type: string, format: date }
                ends_on: { type: string, format: date }
                capacity: { type: integer, minimum: 1 }
      responses:
        '201': { description: Departure created }
        '422': { $ref: '#/components/responses/Validation' }
  /tour-departures/{departure}/close:
    post:
      tags: [Bookings]
      summary: Close a scheduled departure to new booking confirmations
      parameters:
        - { name: departure, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Departure closed }
  /bookings:
    get:
      tags: [Bookings]
      summary: List bookings
      description: >-
        Each row also carries `invoice` (additive, 2026-11-14): `null`, or the booking's live (not voided)
        customer invoice as `{number, status, currency, total_minor, outstanding_minor}`. It is readable with
        `bookings.view`, so roles that cannot list invoices still see where a booking stands.
      parameters:
        - { name: needs_invoice, in: query, description: 'Additive filter (2026-11-14). 1 returns confirmed, in-progress and completed bookings that have no live customer invoice (the accounting worklist).', schema: { type: boolean } }
        - { name: status, in: query, schema: { type: string } }
        - { name: customer_id, in: query, schema: { type: string } }
        - { name: branch_id, in: query, schema: { type: string } }
      responses:
        '200': { description: Bookings }
    post:
      tags: [Bookings]
      summary: Create a draft booking
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingInput' }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation' }
  /bookings/{id}:
    get:
      tags: [Bookings]
      summary: Booking with customer, items and status history (requires bookings.view)
      description: Adds `payments_count` (distinct receipts allocated to the booking) and `invoices_count` to the booking payload.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Booking
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
    patch:
      tags: [Bookings]
      summary: Edit a draft or quoted booking (requires bookings.update)
      description: >-
        Allowed only while nothing financial exists for the booking: no
        payments, invoices, supplier obligations or journal entries. Confirmed
        bookings are corrected with adjustment documents instead. Omitting
        `items` keeps the current service lines; sending `items` replaces them
        and recalculates totals and tax.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingInput' }
      responses:
        '200': { description: Updated booking }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /bookings/{id}/invoice:
    post:
      tags: [Bookings]
      summary: Create an invoice draft from the booking's service and tax snapshot
      description: >-
        Creates one linked customer invoice draft using the booked customer,
        currency, service quantities and booked tax. Requires invoices.create.
        On issue, if the booking already posted revenue, its journal entry is
        reused only when the invoice matches the full booking value, currency,
        customer and tax. Never posts duplicate revenue or receivables.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Invoice draft created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /bookings/{id}/transition:
    post:
      tags: [Bookings]
      summary: Apply a lifecycle transition
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [quoted, confirmed, in_progress, completed, closed, cancelled, no_show]
                reason: { type: string }
      responses:
        '200': { description: Transitioned }
        '409': { $ref: '#/components/responses/Conflict' }
  /bookings/{id}/cancel:
    post:
      tags: [Bookings]
      summary: Cancel a booking with policy computation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Cancelled with fee/refund preview }
  /bookings/{id}/margin-approval:
    post:
      tags: [Bookings]
      summary: Request approval for a negative-margin booking
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        '200': { description: Approval requested and audited }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /bookings/{id}/margin-approval/approve:
    post:
      tags: [Bookings]
      summary: Approve a pending negative-margin exception (requester cannot approve)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Approval granted and audited }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /collections/open-invoices:
    get:
      tags: [Payments]
      summary: Open customer invoices of one customer, for the receipt and apply dialogs (requires payments.create)
      description: >-
        Additive (2026-11-14). A collection-scoped lookup so a cashier, who holds `payments.create` but not
        `invoices.view`, can pick the invoice a receipt settles. Returns only issued customer invoices that still owe,
        in the active branch, with the fields those dialogs show.
      parameters:
        - { name: customer_id, in: query, required: true, schema: { type: string }, description: Customer public id }
        - { name: currency, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string }, description: Invoice number }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Open invoices }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /payments:
    get:
      tags: [Payments]
      summary: List customer receipts
      responses:
        '200': { description: Payments }
    post:
      tags: [Payments]
      summary: Record a customer receipt (idempotent)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInput' }
      responses:
        '201': { description: Recorded }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /payments/{id}/cancel:
    post:
      tags: [Payments]
      summary: Cancel a receipt (reverses the receipt and allocation postings, releases booking allocations; idempotent)
      description: Requires permission payments.reverse. Refused with 422 while a requested/approved refund or an active invoice application exists.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        '200': { description: 'Cancelled (status cancelled, unallocated_minor 0)' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /supplier-payments/{id}/cancel:
    post:
      tags: [Payments]
      summary: Cancel a supplier payment (reverses its postings; idempotent)
      description: Requires permission supplier_payments.reverse. Refused with 422 while applied to obligations or invoices.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        '200': { description: Cancelled }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /refunds:
    get:
      tags: [Payments]
      summary: List refunds (requires payments.view)
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Paginated refunds
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Refund' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Payments]
      summary: Request a refund
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Requested }
        '409': { $ref: '#/components/responses/Conflict' }
  /refunds/{id}/approve:
    post:
      tags: [Payments]
      summary: Approve and post a refund
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Approved }
        '403': { $ref: '#/components/responses/Forbidden' }

  /invoices:
    get:
      tags: [Accounting]
      summary: List customer and supplier invoices
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [customer_invoice, supplier_invoice, credit_note] } }
        - { name: status, in: query, schema: { type: string, enum: [draft, submitted, approved, issued, voided] } }
        - { name: party_type, in: query, schema: { type: string, enum: [customer, supplier] } }
        - { name: party_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Invoices }
    post:
      tags: [Accounting]
      summary: Create a draft customer or supplier invoice (idempotent)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /invoices/{invoice}:
    get:
      tags: [Accounting]
      summary: Get an invoice with its lines
      parameters:
        - { name: invoice, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Invoice }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
    patch:
      tags: [Accounting]
      summary: Edit a draft invoice
      parameters:
        - { name: invoice, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceInput' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /invoices/{invoice}/collections:
    post:
      tags: [Accounting]
      summary: Collect a customer invoice in full or partially using one or more payment methods
      description: >-
        Creates separate posted receipts and invoice applications for each
        payment tranche in one database transaction. All-or-nothing; cannot
        collect more than the remaining invoice balance. The invoice must
        already be issued. Requires payments.create.
      parameters:
        - { name: invoice, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receipts]
              properties:
                receipts:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [amount_minor, cash_account_id, payment_method_id, paid_at]
                    properties:
                      amount_minor: { type: integer, minimum: 1 }
                      cash_account_id: { type: string, description: Public ID of a cash or bank account }
                      payment_method_id: { type: string, description: Public ID of an active payment method }
                      paid_at: { type: string, format: date }
                      fx_rate: { type: number, exclusiveMinimum: 0, description: Required for foreign-currency receipts }
      responses:
        '201': { description: Invoice balance plus individually posted receipts and applications }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /invoices/{invoice}/submit:
    post:
      tags: [Accounting]
      summary: Submit a draft invoice for approval
      parameters:
        - { name: invoice, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Submitted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /invoices/{invoice}/approve:
    post:
      tags: [Accounting]
      summary: Approve a submitted invoice (idempotent)
      parameters:
        - { name: invoice, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Approved }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /invoices/{invoice}/issue:
    post:
      tags: [Accounting]
      summary: Issue (post) an approved invoice through the ledger (idempotent)
      parameters:
        - { name: invoice, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Issued and posted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /invoices/{invoice}/void:
    post:
      tags: [Accounting]
      summary: Void a draft or submitted invoice
      parameters:
        - { name: invoice, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Voided }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /invoices/{invoice}/credit-note:
    post:
      tags: [Accounting]
      summary: Create a credit note for an issued invoice (idempotent)
      parameters:
        - { name: invoice, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                series: { type: string }
                issue_date: { type: string, format: date }
                total_minor: { type: integer }
                memo: { type: string }
      responses:
        '201': { description: Credit note created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /invoices/{invoice}/pdf:
    get:
      tags: [Accounting]
      summary: Download a server-rendered invoice or credit-note PDF
      description: >-
        Renders the stored invoice or credit note as an A4 PDF: company
        letterhead, bilingual labels, bill-to/supplier block, line items,
        totals, outstanding balance and FX provenance. Generated from the
        immutable issue-time snapshot only; it does not post or mutate any
        accounting state. Requires invoices.view and a branch the caller can
        access. Throttled like report exports and audited as invoice.exported
        without party names or amounts. Draft, submitted, approved and void
        documents carry an explicit status band; the document is not asserted
        to be a jurisdiction-specific statutory tax invoice (DEC-028).
      parameters:
        - { name: invoice, in: path, required: true, schema: { type: string } }
        - { name: language, in: query, schema: { type: string, enum: [ar, en, bilingual], default: bilingual } }
      responses:
        '200':
          description: PDF document
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /reports/pipeline:
    get:
      tags: [CRM, Reports]
      summary: Lead pipeline metrics by stage, source, and owner
      description: >-
        Cohort view of leads captured inside the selected period (by created_at)
        using their current stage, status, owner, and source. Scoped to the
        active branch (X-Branch-Id). `by_stage` and `by_source` sum to
        `totals.captured`, so the report reconciles with the lead list.
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [today, thisMonth, lastMonth, customRange], default: thisMonth } }
        - { name: from, in: query, description: 'Required with period=customRange', schema: { type: string, format: date } }
        - { name: to, in: query, description: 'Required with period=customRange', schema: { type: string, format: date } }
      responses:
        '200':
          description: Pipeline totals and breakdowns
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PipelineReport' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /reports/trial-balance:
    get:
      tags: [Reports]
      summary: Trial balance for a period/branch
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: branch_id, in: query, schema: { type: string } }
        - name: currency
          in: query
          description: Limit to lines posted in this transaction currency and sum original-currency amounts (`basis=original`). Omit for base-currency totals.
          schema: { type: string, minLength: 3, maxLength: 3 }
        - { name: pre_closing, in: query, description: 'Exclude year-end closing entries and show pre-close balances', schema: { type: boolean, default: false } }
        - { name: max_level, in: query, description: 'Roll every posting up to this chart-of-accounts depth (root = 1) without double counting', schema: { type: integer, minimum: 1, maximum: 20 } }
        - { name: cost_center_id, in: query, description: 'Limit to the analytical portion allocated to this cost center (public id)', schema: { type: string } }
        - { name: adjustments, in: query, description: 'Period-end adjustment voucher scope: include, exclude, or only', schema: { type: string, enum: [include, exclude, only], default: include } }
      responses:
        '200': { description: 'Trial balance with opening, period movements, closing balances and balance totals. `interbranch` carries the inter-branch clearing check: this branch closing receivable/payable, and (for users with branches.view_all) the global figures as of the period end, which must net to zero (`balanced`).' }
  /reports/trial-balance/export:
    get:
      tags: [Reports]
      summary: Trial balance export (requires reports.export; audited)
      description: >-
        CSV layout is stable: Code, Name (EN), Name (AR), Opening debit,
        Opening credit, Debit, Credit, Closing debit, Closing credit, Abnormal
        (Yes or blank), Currency. Amounts are decimal strings in the report
        currency; the last row is the Total row with blank Code and Name (EN).
        Note that `Abnormal` was added after the first release, so consumers
        that read columns by position must select by header name.
        All report export endpoints accept `format=csv|xlsx|pdf` and
        `language=ar|en|bilingual`. XLSX money cells are numeric (number-formatted
        to the currency exponent) and dates are real date cells; text that starts
        with `=`, `+`, `-` or `@` is prefixed with an apostrophe in every format.
        PDF uses the bundled DejaVu Sans font with Arabic shaping and right-to-left
        layout, a letterhead from settings (`general.company_name_ar|en`, optional
        `general.company_logo`, branch, period, currency), a repeated table header
        and "page n / N" on every page, and is limited to 5,000 rows (422 beyond).
        Exports share the `report-exports` throttle: 20 per minute per user,
        6 per minute for PDF (429 beyond). Branch scope follows the active branch,
        exactly as on screen.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: currency, in: query, schema: { type: string, minLength: 3, maxLength: 3 } }
        - { name: max_level, in: query, schema: { type: integer, minimum: 1, maximum: 20 } }
        - { name: cost_center_id, in: query, schema: { type: string } }
        - { name: adjustments, in: query, schema: { type: string, enum: [include, exclude, only] } }
        - { name: format, in: query, schema: { type: string, enum: [csv, xlsx, pdf], default: csv } }
        - { name: language, in: query, schema: { type: string, enum: [ar, en, bilingual], default: bilingual } }
      responses:
        '200':
          description: UTF-8 CSV with BOM; formula-like cells are neutralised
          content:
            text/csv:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports/general-ledger:
    get:
      tags: [Reports]
      summary: General ledger for one account (descendants included) with opening, running and closing balance
      description: Posted entries only, scoped to the active branch (X-Branch-Id). Balances are debit minus credit.
      parameters:
        - { name: account_id, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: currency, in: query, description: 'Original-currency view of one transaction currency', schema: { type: string, minLength: 3, maxLength: 3 } }
        - { name: party_type, in: query, schema: { type: string, enum: [customer, supplier, employee] } }
        - { name: party_id, in: query, description: 'Public id; required with party_type', schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: 'Ledger with pagination meta and source-document/party drilldown fields'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneralLedger' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /reports/general-ledger/export:
    get:
      tags: [Reports]
      summary: General ledger export (requires reports.export; audited; max 50,000 rows)
      parameters:
        - { name: account_id, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: currency, in: query, schema: { type: string, minLength: 3, maxLength: 3 } }
        - { name: party_type, in: query, schema: { type: string, enum: [customer, supplier, employee] } }
        - { name: party_id, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [csv, xlsx, pdf], default: csv } }
        - { name: language, in: query, schema: { type: string, enum: [ar, en, bilingual], default: bilingual } }
      responses:
        '200':
          description: UTF-8 CSV with BOM
          content:
            text/csv:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /reports/income-statement:
    get:
      tags: [Reports]
      summary: Income statement with optional comparison period and variance
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: compare_from, in: query, description: 'Prior-period start; required with compare_to', schema: { type: string, format: date } }
        - { name: compare_to, in: query, description: 'Prior-period end; required with compare_from', schema: { type: string, format: date } }
      responses:
        '200': { description: 'Income statement plus comparison and variance when requested' }
  /reports/income-statement/export:
    get:
      tags: [Reports]
      summary: Income statement export (requires reports.export; audited)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: format, in: query, schema: { type: string, enum: [csv, xlsx, pdf], default: csv } }
        - { name: language, in: query, schema: { type: string, enum: [ar, en, bilingual], default: bilingual } }
      responses:
        '200': { description: UTF-8 CSV with BOM }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports/balance-sheet:
    get:
      tags: [Reports]
