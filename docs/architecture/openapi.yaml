  /leads:
    get:
      tags: [CRM]
      summary: List leads
      responses:
        '200': { description: Leads }
    post:
      tags: [CRM]
      summary: Create a lead
      description: >-
        A capture matching an existing lead in the same branch by normalized
        phone/email inside `crm.duplicate_window_days` is still created, but it
        carries `duplicate_of` and `duplicate_reason` so the match is visible and
        linked rather than silently duplicated. Set the window to 0 to disable.
      responses:
        '201': { description: Created }
  /leads/{id}/convert:
    post:
      tags: [CRM]
      summary: Convert a lead to a customer and/or booking (once)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Converted }
        '409': { $ref: '#/components/responses/Conflict' }

  /lead-sources:
    get:
      tags: [CRM]
      summary: List configurable lead sources (requires leads.view)
      description: Ordered by code. Inactive sources are omitted unless `include_inactive` is true.
      parameters:
        - { name: include_inactive, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LeadSource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [CRM]
      summary: Create a lead source (requires leads.manage_rules)
      description: >-
        The code is optional, blank generates `src-001`, ... A supplied code is lower-cased, must match `alpha_dash`, and is immutable afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadSourceInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LeadSource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /lead-sources/{code}:
    patch:
      tags: [CRM]
      summary: Rename or (de)activate a lead source (requires leads.manage_rules)
      description: The `code` in the path identifies the record; any `code` in the body is ignored.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadSourceInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LeadSource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [CRM]
      summary: Delete an unused lead source (requires leads.manage_rules)
      description: >-
        Refused with 422 when the source is the fallback `other` source or is
        referenced by a lead or an assignment rule; deactivate it instead.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'Deleted: `{ data: { code, deleted: true } }`' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /lead-stages:
