        currency: { type: string }
        fx_rate: { type: string, example: '1.0000000000' }
        fx_rate_date: { type: string, format: date }
        fx_rate_source: { type: string, default: manual }
        memo: { type: string }
        post: { type: boolean, default: true }
        lines:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/JournalLineInput' }
    CustomerInput:
      type: object
      required: [type, name_ar, name_en, branch_id]
