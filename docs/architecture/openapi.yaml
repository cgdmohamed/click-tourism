openapi: 3.1.0
info:
  title: Tourism ERP API
  version: 0.1.0-draft
  description: |
    Draft contract for the self-hosted Tourism ERP. Additive changes within v1.
    Money is serialized as a decimal string plus the authoritative minor-unit integer.
    Every endpoint is authorized by policy and branch scope.
  contact:
    name: Architecture
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: IAM
  - name: Platform
  - name: Accounting
  - name: Commissions
  - name: Schedules
  - name: Fixed Assets
  - name: Treasury
  - name: Parties
  - name: Imports
  - name: Bookings
  - name: Payments
  - name: Reports
  - name: CRM
  - name: Webhooks

paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Authenticate and issue a Sanctum token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string, default: web }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      responses:
        '204': { description: Revoked }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user, roles, permissions, branches
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
    patch:
      tags: [Auth]
      summary: Update own profile (locale and password)
      description: Changes the caller's locale and/or password. A password change requires `current_password` and revokes every other Sanctum token, keeping only the token used for this request. Audited as `user.profile_updated` / `user.password_changed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                locale: { type: string, enum: [ar, en] }
                current_password: { type: string, format: password }
                password: { type: string, format: password, minLength: 12 }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }

  /mcp/tokens:
    get:
      tags: [Auth]
      summary: List the caller's own MCP tokens (no secrets); all users' tokens with `?all=1` and `mcp.admin`
      description: Read-only MCP tokens (ability `mcp:read`, ADR-0016). Callable only with a normal login token; MCP tokens themselves get 403 `mcp_scope_denied`. `all=1` needs the permission `mcp.admin` (otherwise 403 `forbidden`) and adds a `user` object (id, name, email) to each row.
      parameters:
        - { name: all, in: query, required: false, schema: { type: boolean }, description: List every user's MCP tokens (permission `mcp.admin`) }
      responses:
        '200':
          description: Own MCP tokens, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/McpToken' }
                  meta:
                    type: object
                    description: Installation limits, so a client can offer only valid expiry choices
                    properties:
                      default_minutes: { type: integer, example: 480 }
                      max_minutes: { type: integer, example: 1440 }
                      max_active_per_user: { type: integer, example: 10 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Auth]
      summary: Create a read-only MCP token (permission `mcp.use`, setting `mcp.enabled`)
      description: Returns the plaintext token exactly once. The token carries only the `mcp:read` ability and may call only the allowlisted read-only GET routes of the MCP tools (search, customers, suppliers, bookings, invoices, payments, expenses, leads, party-statement, aging, trial-balance, income-statement and `GET /mcp/context`); everything else is 403 `mcp_scope_denied`. Refused with 403 `mcp_disabled` while the setting `mcp.enabled` is false (the default). Default lifetime 8h (`MCP_TOKEN_DEFAULT_MINUTES`), maximum 24h (`MCP_TOKEN_MAX_MINUTES`). At most 10 active MCP tokens per user. Audited as `mcp.token_created`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                expires_in_minutes: { type: integer, minimum: 5, maximum: 1440, description: Defaults to 480 }
      responses:
        '201':
          description: Created; `token` is shown only in this response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/McpToken'
                      - type: object
                        properties:
                          token: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /mcp/tokens/{id}:
    delete:
      tags: [Auth]
      summary: Revoke one of the caller's own MCP tokens (any user's with `mcp.admin`)
      description: Audited as `mcp.token_revoked`; an administrator revocation of another user's token also records `owner_id` and `revoked_by_admin`. Without `mcp.admin`, another user's token or an unknown id returns 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Token not found }

  /mcp/context:
    get:
      tags: [Auth]
      summary: Branches the token's user may use (MCP gateway helper)
      description: Allowed for MCP tokens (it is not an MCP tool) and for login tokens. The gateway uses it to check that a pinned `MCP_BRANCH_ID` belongs to the token's user and fails closed otherwise. Same rule as `BranchScope`. No profile data, no permissions. Refused with 403 `mcp_disabled` for an MCP token while `mcp.enabled` is false. Rate limited by `mcp-read`; not counted in the row budget.
      responses:
        '200':
          description: Branch public ids
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [user_id, branches]
                    properties:
                      user_id: { type: string }
                      branches: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /mcp/status:
    get:
      tags: [Auth]
      summary: MCP connection status and recent connections (permission `settings.view`)
      description: |
        Installation-level MCP usage for the Settings screen (ADR-0018). Counts every user's MCP tokens (Sanctum tokens named `mcp:`) and lists the 10 most recently used, ordered by `last_used_at` descending (never-used last), then id descending. A "recent connection" is the token's `last_used_at`, i.e. the last authenticated MCP request made with it. Token values, hashes and abilities are never returned. Callable only with a normal login token; an MCP token gets 403 `mcp_scope_denied`.
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [enabled, tokens, last_connection_at, recent]
                    properties:
                      enabled: { type: boolean, description: 'Setting `mcp.enabled` (default false)' }
                      tokens:
                        type: object
                        required: [active, expired, total]
                        properties:
                          active: { type: integer, description: 'Not expired: no expiry date or one in the future' }
                          expired: { type: integer }
                          total: { type: integer }
                      last_connection_at: { type: [string, 'null'], format: date-time, description: 'Maximum `last_used_at` across MCP tokens, or null when none was ever used' }
                      recent:
                        type: array
                        maxItems: 10
                        items:
                          type: object
                          required: [id, name, state, created_at, last_used_at, expires_at, user]
                          properties:
                            id: { type: integer }
                            name: { type: string, description: 'Token name without the `mcp:` prefix' }
                            state: { type: string, enum: [active, expired] }
                            created_at: { type: string, format: date-time }
                            last_used_at: { type: [string, 'null'], format: date-time }
                            expires_at: { type: [string, 'null'], format: date-time }
                            user:
                              type: [object, 'null']
                              properties:
                                id: { type: string }
                                name: { type: string }
                                email: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/sessions:
    get:
      tags: [Auth]
      summary: The signed-in user's own devices (login tokens), newest use first (GAP-CORE-04)
      description: Only the caller's own login tokens (not MCP tokens, never another user's). No token value or hash is returned.
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        device: { type: string }
                        created_at: { type: string, format: date-time }
                        last_used_at: { type: [string, 'null'], format: date-time }
                        expires_at: { type: [string, 'null'], format: date-time }
                        current: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Auth]
      summary: Sign every other device out; this session and MCP tokens stay (audited)
      responses:
        '200': { description: 'data.revoked = number of devices signed out' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/sessions/{session}:
    delete:
      tags: [Auth]
      summary: Sign one of my own devices out (audited); 404 for anyone else's or an MCP token
      parameters:
        - { name: session, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 'data.revoked = 1, data.current = whether it was this session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /exports:
    get:
      tags: [Reports]
      summary: The signed-in user's recent background exports in the active branch (ADR-0025, GAP-RPT-02)
      responses:
        '200':
          description: Newest first, at most 20
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ExportJob' }
    post:
      tags: [Reports]
      summary: Queue a report export that runs in the background (permission `reports.export`)
      description: |
        Re-runs the normal `/reports/{report}/export` route as the caller when a queue worker picks the job up, so permissions, branch scope, filters and the `report.exported` audit row are those of the synchronous export; only the row cap is higher (`EXPORTS_ASYNC_MAX_ROWS`, default 200000). `params` are the report's own filters, validated by that route when the job runs, so a bad filter makes the job `failed` with the route's message. The file exists only when the job `succeeded`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report, format]
              properties:
                report: { type: string, enum: [trial-balance, general-ledger, income-statement, balance-sheet, aging, aging-reconciliation, party-statement, profitability, sales, commissions, tax, cost-center-pl, cost-center-unallocated] }
                format: { type: string, enum: [csv, xlsx, pdf] }
                language: { type: string, enum: [ar, en, bilingual] }
                params: { type: object, additionalProperties: { type: string }, description: 'The report filters (from, to, account, currency, ...)' }
      responses:
        '201':
          description: The queued job
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ExportJob' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: 'Unknown report or format' }

  /exports/{export}:
    get:
      tags: [Reports]
      summary: Status of one of my exports (404 for anyone else's)
      parameters:
        - { name: export, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The job
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ExportJob' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Reports]
      summary: Remove a finished export and its file (409 while it is queued or running)
      parameters:
        - { name: export, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Still running' }

  /exports/{export}/download:
    get:
      tags: [Reports]
      summary: Download the file of a succeeded export (audited as `export.downloaded`)
      parameters:
        - { name: export, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'The complete file (CSV, XLSX or PDF)' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Not ready (code export_not_ready)' }
        '410': { description: 'Expired (code export_expired); run the export again' }

  /report-schedules:
    get:
      tags: [Reports]
      summary: The signed-in user's scheduled report e-mails in the active branch (ADR-0026, permission `reports.schedule`)
      responses:
        '200':
          description: Schedules
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ReportSchedule' }
    post:
      tags: [Reports]
      summary: Create a schedule that e-mails a report file to up to 10 addresses
      description: |
        Runs as the creator (their permissions and branch) at 06:00 server time through the SMTP settings of the environment. A `period` preset (`yesterday`, `previous_week`, `previous_month`, `month_to_date`, `year_to_date`, `last_30_days`) sets `from`, `to` and `as_of` at each run; fixed filters go in `params`. Nothing is mailed when the export fails or while the mailer is `log`, `array` or `null` (`GET /feature-flags` exposes `mail_configured`). Five consecutive failures pause the schedule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report, format, frequency, recipients]
              properties:
                name: { type: string, maxLength: 100 }
                report: { type: string }
                format: { type: string, enum: [csv, xlsx, pdf] }
                frequency: { type: string, enum: [daily, weekly, monthly] }
                day: { type: integer, minimum: 1, maximum: 28, description: 'weekly: 1 (Monday) to 7; monthly: 1 to 28' }
                period: { type: string, enum: [yesterday, previous_week, previous_month, month_to_date, year_to_date, last_30_days] }
                params: { type: object, additionalProperties: { type: string } }
                recipients: { type: array, minItems: 1, maxItems: 10, items: { type: string, format: email } }
      responses:
        '201':
          description: The schedule
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ReportSchedule' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: 'Invalid report, period, frequency or e-mail address' }

  /report-schedules/{schedule}:
    patch:
      tags: [Reports]
      summary: Change or pause one of my schedules (re-activating resets the failure count)
      parameters:
        - { name: schedule, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'The schedule' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Reports]
      summary: Delete one of my schedules
      parameters:
        - { name: schedule, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /report-schedules/{schedule}/run:
    post:
      tags: [Reports]
      summary: Send the report now; the outcome is in `last_status` (sent, failed, mail_not_configured)
      parameters:
        - { name: schedule, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The schedule after the run
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ReportSchedule' }
        '404': { $ref: '#/components/responses/NotFound' }

  /assistant/chat:
    post:
      tags: [Auth]
      summary: One turn of the read-only in-product assistant (permission `assistant.use`)
      description: |
        The client sends the whole conversation (ADR-0017); the turn is also saved for the user's chat history unless `assistant.history_retention_days` is 0 (ADR-0022), and `conversation_id` names the saved chat. The model may call only the 15 read tools of the MCP catalogue; each call runs as the signed-in user through the normal GET route, so permissions, branch scope (`X-Branch-Id`), contact masking and the row budget apply as for MCP. Tool results are wrapped as untrusted data. When `assistant.redact_pii` is true, phone numbers, e-mail addresses and tax ids are replaced before anything is sent to the provider. The answer is plain text; `citations` are built by the server from the tool calls made in this turn. Errors: 403 `assistant_disabled` (setting `assistant.enabled` off), 403 `assistant_not_accepted` (the data-processing notice was never accepted, ADR-0018; checked before the key), 503 `assistant_not_configured` (provider `none` or no key in the environment), 429 `assistant_budget_exceeded` (daily token budget per user), 429 `assistant_rate_limited` (limiter `assistant-chat`), 502 `assistant_provider_error`. Audited as `assistant.chat` (no content) and `assistant.denied`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  minItems: 1
                  maxItems: 40
                  description: The conversation so far; the last item must have role `user`. Roles `system` and `tool` are refused.
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string, maxLength: 4000 }
                locale: { type: string, enum: [ar, en] }
                conversation_id: { type: string, maxLength: 26, description: 'Saved chat to continue (ADR-0022); an unknown or foreign id starts a new chat' }
      responses:
        '200':
          description: The answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [answer, citations, usage, truncated]
                    properties:
                      answer: { type: string, description: 'Plain text, no HTML, images or links' }
                      citations:
                        type: array
                        items:
                          type: object
                          required: [tool, entity, id, route, as_of]
                          properties:
                            tool: { type: string, example: erp_invoice_get }
                            entity: { type: string, enum: [search, customer, supplier, booking, invoice, payment, expense, lead, report] }
                            id: { type: string, nullable: true, description: 'Public id of the cited record; null for a list or report call' }
                            route: { type: string, example: /invoices/01HX }
                            as_of: { type: string, format: date-time }
                            labels: { type: array, items: { type: string }, description: 'Document number or names of the cited row; the screen links them in the answer (ADR-0022)' }
                      actions:
                        type: array
                        description: 'Confirmation cards of the actions prepared in this turn (ADR-0023); nothing is saved until the user confirms'
                        items: { $ref: '#/components/schemas/AssistantActionCard' }
                      usage:
                        type: object
                        properties:
                          prompt: { type: integer }
                          completion: { type: integer }
                          total: { type: integer }
                      truncated: { type: boolean, description: 'A tool result was cut, the tool-call cap was reached or the model output was cut' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { description: Rate limit or daily token budget used up }
        '502': { description: The provider failed (`assistant_provider_error`) }
        '503': { description: No provider key configured (`assistant_not_configured`) }

  /assistant/chat/stream:
    post:
      tags: [Auth]
      summary: Same turn as /assistant/chat, answered as newline-delimited JSON (ADR-0022)
      description: |
        Same request, permission and refusals as `/assistant/chat` (refusals are the normal JSON errors and happen before streaming starts). A started turn answers `200` with `application/x-ndjson`, one JSON object per line: `{"type":"thinking"}` before each model round, `{"type":"tool","tool":"erp_invoices_list","entity":"invoice"}` before each catalogue call (names only), then `{"type":"answer","data":{...}}` (the `/assistant/chat` payload plus `conversation_id`) or `{"type":"error","code":"assistant_provider_error","message":"..."}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  minItems: 1
                  maxItems: 40
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string, maxLength: 4000 }
                locale: { type: string, enum: [ar, en] }
                conversation_id: { type: string, maxLength: 26 }
      responses:
        '200': { description: 'NDJSON event stream', content: { application/x-ndjson: { schema: { type: string } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /assistant/actions/{id}/confirm:
    post:
      tags: [Auth]
      summary: The user confirms an action the assistant prepared; it runs as the user (ADR-0023)
      description: |
        Replays the prepared request through the normal API route with the signed-in user as actor, the action's branch in `X-Branch-Id` and `Idempotency-Key: assistant-<id>`. The route's own permission, validation and audit apply, so the result can be `status: failed` with the route's message (for example `forbidden` when the permission was revoked). Errors: 404 (not yours), 409 `assistant_action_decided` (already confirmed, rejected or failed), 409 `assistant_action_branch_mismatch`, 410 `assistant_action_expired` (15 minutes).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The card with its new status (`confirmed` with `result.entity` / `result.id`, or `failed` with `error`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AssistantActionCard' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Already decided or prepared in another branch }
        '410': { description: Expired }

  /assistant/actions/{id}/reject:
    post:
      tags: [Auth]
      summary: Discard an action the assistant prepared (ADR-0023)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The card with status `rejected` (an already decided action is returned unchanged)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AssistantActionCard' }
        '404': { $ref: '#/components/responses/NotFound' }

  /assistant/conversations:
    get:
      tags: [Auth]
      summary: The signed-in user's saved assistant chats in the active branch (ADR-0022)
      responses:
        '200':
          description: Newest first, at most 100
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        last_message_at: { type: string, format: date-time }
    delete:
      tags: [Auth]
      summary: Delete all of the signed-in user's saved chats in the active branch
      responses:
        '200': { description: 'data.deleted = number of chats removed' }

  /assistant/conversations/{id}:
    get:
      tags: [Auth]
      summary: Open one saved chat (owner only; 404 for anyone else)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The chat with its messages in order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      title: { type: string }
                      messages:
                        type: array
                        items:
                          type: object
                          properties:
                            role: { type: string, enum: [user, assistant] }
                            content: { type: string }
                            citations: { type: array, items: { type: object } }
                            truncated: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Auth]
      summary: Delete one saved chat (owner only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /assistant/key:
    put:
      tags: [Auth]
      summary: Save the assistant provider key (permission `settings.update`)
      description: |
        Stores the provider API key encrypted and flagged secret; it is write-only and never returned by any endpoint (`GET /settings` shows no value, `GET /feature-flags` shows only `assistant_key_source`: `settings`, `env` or `none`). A saved key wins over the `OPENAI_API_KEY` environment value. The audit trail records the change without the key. Throttled to 10 requests a minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string, minLength: 20, maxLength: 300, description: 'No whitespace' }
      responses:
        '200':
          description: Key saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      key_source: { type: string, enum: [settings, env, none] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: 'Key missing, too short or containing whitespace' }
    delete:
      tags: [Auth]
      summary: Remove the saved assistant provider key (permission `settings.update`)
      description: Deletes the saved key; an environment key, if any, then applies.
      responses:
        '200':
          description: Key removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      key_source: { type: string, enum: [settings, env, none] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /assistant/models:
    get:
      tags: [Auth]
      summary: Models the configured assistant provider offers (permission `settings.view`)
      description: |
        Read-only model discovery for the Settings, Assistant model picker (ADR-0018); saving a chosen model still needs `settings.update`. Only chat-capable ids are returned: embeddings, audio/transcribe/TTS/realtime, image, moderation, search, codex and legacy completion models are filtered out. `recommended` follows a fixed preference list (`gpt-4.1-mini`, `gpt-4o-mini`, `gpt-4.1`, `gpt-4o`, `o4-mini`, `o3-mini`, `gpt-4-turbo`, `gpt-3.5-turbo`), then the newest id containing `mini`, then the newest remaining id; it is null when the filtered list is empty. The list is fetched on every call (nothing is cached) and the provider key is never exposed. Discovery needs only the key: while `assistant.provider` is still the default `none`, the first provider whose key exists in the environment is used, so no setting has to be saved first. Errors: 503 `assistant_not_configured` when no provider key is saved in Settings or present in the server environment, 502 `assistant_provider_error` when the provider fails (its response body is never copied into the answer).
      responses:
        '200':
          description: Available chat models and the recommended one
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [key_configured, provider, recommended, models]
                    properties:
                      key_configured: { type: boolean, description: 'Always true on a 200; a missing key is a 503' }
                      provider: { type: string, example: openai }
                      recommended: { type: string, nullable: true, description: 'Model id to preselect; null when the filtered list is empty' }
                      models:
                        type: array
                        items:
                          type: object
                          required: [id, recommended]
                          properties:
                            id: { type: string, example: gpt-4.1-mini }
                            recommended: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { description: The provider failed (`assistant_provider_error`) }
        '503': { description: 'No provider key in the environment (`assistant_not_configured`)' }

  /branches:
    get:
      tags: [Platform]
      summary: List branches visible to the user
      responses:
        '200':
          description: Branches
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Branch' }
    post:
      tags: [Platform]
      summary: Create a branch
      description: >-
        The code is optional; blank or omitted generates the next free code (BR-01 style) and returns it. A supplied code is validated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /settings:
    get:
      tags: [Platform]
      summary: Read installation settings (secrets redacted)
      responses:
        '200': { description: Settings }
    put:
      tags: [Platform]
      summary: Update settings
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }

  /feature-flags:
    get:
      tags: [Platform]
      summary: Non-sensitive installation flags (any authenticated user, no extra permission)
      responses:
        '200':
          description: Flags derived from settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [tax_enabled, credit_limit_policy, base_currency, refund_segregation, mcp_enabled]
                    properties:
                      tax_enabled: { type: boolean }
                      credit_limit_policy: { type: string, enum: [off, warn, block] }
                      base_currency: { type: string, example: EGP }
                      refund_segregation: { type: boolean }
                      mcp_enabled: { type: boolean, description: Setting `mcp.enabled` (default false); MCP tokens work only while true }
                      assistant_enabled: { type: boolean, description: 'The assistant can answer: `assistant.enabled` is true, the data-processing notice is accepted, a provider is chosen and its key is set in the environment' }
                      assistant_provider: { type: string, nullable: true, description: 'Provider name (`openai`) while the assistant is enabled' }
                      assistant_key_configured: { type: boolean, description: 'The selected provider''s credential is present in the environment (never a setting)' }
                      assistant_accepted: { type: boolean, description: 'The data-processing notice was accepted (setting `assistant.data_processing_accepted_at` is set)' }
                      assistant_model: { type: string, description: 'Model id the assistant will use: setting `assistant.model`, or the configured default when blank' }
                      assistant_redact_pii: { type: boolean, description: 'Setting `assistant.redact_pii`' }
                      assistant_privacy_url: { type: string, description: 'Optional https link for the data-processing notice (setting `assistant.privacy_url`)' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /decisions:
    get:
      tags: [Platform]
      summary: List unresolved product/accounting decisions (requires settings.view)
      responses:
        '200':
          description: Unresolved decisions mirroring docs/product/decisions-needed.md
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Decision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /audit-events:
    get:
      tags: [Platform]
      summary: Browse the append-only audit trail (requires audit.view)
      description: |
        Newest-first audit rows. Branch users see only the branches assigned to
        them; holders of `branches.view_all` see every branch and may filter one.
      parameters:
        - { name: actor, in: query, schema: { type: string }, description: 'Actor public id, name or email fragment' }
        - { name: action, in: query, schema: { type: string }, description: 'Action prefix, e.g. lead.' }
        - { name: entity_type, in: query, schema: { type: string } }
        - { name: entity_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: branch, in: query, schema: { type: string }, description: 'Branch public id (must be an allowed branch)' }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - name: X-Branch-Id
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Paginated audit events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /audit-events/export:
    get:
      tags: [Platform]
      summary: Export the filtered audit trail as CSV (requires audit.export)
      description: 'Limited to 50,000 rows; the export itself is recorded as an `audit.exported` event.'
      parameters:
        - { name: actor, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: entity_type, in: query, schema: { type: string } }
        - { name: entity_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: branch, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - name: X-Branch-Id
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: UTF-8 CSV attachment
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /health:
    get:
      tags: [Platform]
      security: []
      summary: Liveness and dependency status (database, cache, redis, queue, scheduler)
      description: Returns 503 only when the database is down; other failures report `degraded`.
      responses:
        '200':
          description: ok or degraded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Database unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /ready:
    get:
      tags: [Platform]
      security: []
      summary: Readiness probe (database reachable)
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ready: { type: boolean }
        '503': { description: Not ready }

  /currencies:
    get:
      tags: [Platform]
      summary: List currencies (active and inactive; pickers filter on is_active)
      responses:
        '200': { description: Currencies }
    post:
      tags: [Platform]
      summary: Create a currency (settings.update, audited)
      description: >-
        The code is 3 uppercase letters (ISO 4217) and immutable after creation. Exponent 0-3. This is the one master-data code that is NOT generated: an ISO code cannot be invented, so the web form offers a picker of common ISO currencies (prefilling code, name, symbol and exponent) plus an `Other` option for manual entry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CurrencyInput' }
      responses:
        '201': { description: Created (includes is_base and in_use) }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /currencies/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string, minLength: 3, maxLength: 3 } }
    get:
      tags: [Platform]
      summary: Read one currency with is_base and in_use (settings.view)
      responses:
        '200': { description: Currency }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Unknown currency }
    patch:
      tags: [Platform]
      summary: Edit name, symbol, exponent or active flag (settings.update, audited)
      description: >
        The code cannot change. The exponent can change only while the currency is unused
        (no fx rate, journal, document, account, cash account, booking, invoice, payment or any other
        record references it; the base currency counts as used). The base currency cannot be deactivated.
        Deactivated currencies stay on old documents but disappear from pickers for new ones.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CurrencyUpdate' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Unknown currency }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Platform]
      summary: Delete an unused currency (settings.update, audited)
      description: Refused with 422 when the currency is the base currency or is referenced anywhere; deactivate it instead.
      responses:
        '200': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Unknown currency }
        '422': { $ref: '#/components/responses/Validation' }
  /branding:
    get:
      tags: [Platform]
      summary: Public company branding (login page); names and logo flag only, no secrets or paths
      security: []
      responses:
        '200':
          description: Branding
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      company_name_ar: { type: string }
                      company_name_en: { type: string }
                      has_logo: { type: boolean }
                      logo_version: { type: string, nullable: true, description: Cache-busting token for the logo URL }
  /branding/logo:
    get:
      tags: [Platform]
      summary: Public company logo image (PNG or JPEG); 404 when no logo is set
      security: []
      responses:
        '200':
          description: The logo image
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        '404': { description: No logo }
  /settings/logo:
    post:
      tags: [Platform]
      summary: Upload the report/letterhead logo (settings.update, audited)
      description: >
        multipart/form-data field "logo". PNG or JPEG only, decided from the file content (SVG, GIF and
        others are rejected), at most 1 MB and 16-4000 px per side. Stored under storage/app/branding with a
        random server-generated name; the previous uploaded file is deleted. Existing path values in
        general.company_logo keep working.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo: { type: string, format: binary }
      responses:
        '200': { description: Branding after the change }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Platform]
      summary: Remove the logo and delete the uploaded file (settings.update, audited)
      responses:
        '200': { description: Branding after the change }
        '403': { $ref: '#/components/responses/Forbidden' }
  /fx-rates:
    get:
      tags: [Platform]
      summary: List FX rates
      parameters:
        - { name: currency, in: query, schema: { type: string } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: FX rates }
    post:
      tags: [Platform]
      summary: Record a manual FX rate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency, rate, rate_date]
              properties:
                currency: { type: string, minLength: 3, maxLength: 3 }
                rate: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
                rate_date: { type: string, format: date }
                source: { type: string, default: manual }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation' }

  /accounts:
    get:
      tags: [Accounting]
      summary: Chart of accounts (flat list; build the tree from parent_id)
      description: >-
        Each row also carries `classification` and `control_party_type`, plus additive read-only party
        fields for ADR-0015 party subledger accounts (null on ordinary accounts): `party_type`
        (customer|supplier|employee), `party_role` (receivable|payable|advance|custody|payable_balance),
        `party_name_ar`, `party_name_en`.
      responses:
        '200': { description: Accounts }
    post:
      tags: [Accounting]
      summary: Create an account
      description: >-
        `code` is optional. When blank or omitted the next free code under `parent_id` is generated
        (sibling pattern: highest numeric child plus the step between the last two children; with no numeric
        child the parent code plus a two-digit counter; a root account takes the next hundred above the
        roots of its type). A supplied code is accepted and validated (unique, max 20), so accountants keep
        their own numbering. Use `GET /accounts/next-code` to preview the suggestion. The code can still be
        edited on update until the account has postings.
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation' }
  /accounts/next-code:
    get:
      tags: [Accounting]
      summary: Suggest the next free account code (accounts.create)
      description: >-
        Read-only preview of the code `POST /accounts` would generate for a blank code. Pass `parent_id`
        (the account type is then taken from the parent) or, for a root account, `type`.
      parameters:
        - { name: parent_id, in: query, schema: { type: string }, description: Parent account id }
        - { name: type, in: query, schema: { type: string, enum: [asset, liability, equity, revenue, expense] }, description: Required when parent_id is absent }
      responses:
        '200': { description: 'The suggested code, as data.code' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /cash-accounts:
    get:
      tags: [Accounting]
      summary: Registered cash and bank accounts with ledger balances (falls back to the chart of accounts until any are registered)
      parameters:
        - { name: include_inactive, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Cash accounts }
    post:
      tags: [Accounting]
      summary: Register a cash or bank account against a postable asset account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashAccountInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /cash-accounts/{cashAccount}:
    patch:
      tags: [Accounting]
      summary: Update a registered cash or bank account
      parameters:
        - { name: cashAccount, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashAccountInput' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /transfers:
    get:
      tags: [Accounting]
      summary: List transfers between cash and bank accounts
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Transfers }
    post:
      tags: [Accounting]
      summary: Create and post a same-currency or cross-currency transfer (idempotent)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferInput' }
      responses:
        '201': { description: Posted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /transfers/{transfer}:
    get:
      tags: [Accounting]
      summary: Get a transfer
      parameters:
        - { name: transfer, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Transfer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /transfers/{transfer}/reverse:
    post:
      tags: [Accounting]
      summary: Reverse a posted transfer exactly once
      parameters:
        - { name: transfer, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '200': { description: Reversed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /expense-categories:
    get:
      tags: [Accounting]
      summary: List expense categories mapped to postable expense accounts
      parameters:
        - { name: include_inactive, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Expense categories }
    post:
      tags: [Accounting]
      summary: Create an expense category
      description: >-
        The code is optional; blank or omitted generates the next free code (EXP-001 style) and returns it. A supplied code is validated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseCategoryInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /expense-categories/{category}:
    patch:
      tags: [Accounting]
      summary: Update an expense category
      parameters:
        - { name: category, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseCategoryInput' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /expenses:
    get:
      tags: [Accounting]
      summary: List expenses
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, submitted, approved, rejected, cancelled, reversed] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Expenses }
    post:
      tags: [Accounting]
      summary: Create a draft expense, optionally submitting it for approval (idempotent)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /expenses/{expense}:
    get:
      tags: [Accounting]
      summary: Get an expense
      parameters:
        - { name: expense, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Expense }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
    patch:
      tags: [Accounting]
      summary: Edit a draft expense
      parameters:
