      summary: Create domestic, international, pilgrimage, corporate, private, or standalone program (bookings.create)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category, execution_type, currency, base_price_minor, estimated_cost_minor]
              properties:
                name: { type: string }
                category: { type: string, enum: [domestic, international, umrah, hajj, corporate, day_trip, other] }
                execution_type: { type: string, enum: [fixed, private, standalone] }
                description: { type: string }
                destination: { type: string }
                currency: { type: string }
                base_price_minor: { type: integer, minimum: 0 }
                estimated_cost_minor: { type: integer, minimum: 0 }
      responses:
        '201': { description: Package created }
        '422': { $ref: '#/components/responses/Validation' }
  /tour-packages/{package}:
    get:
      tags: [Bookings]
      summary: Get program with scheduled departures
      parameters:
        - { name: package, in: path, required: true, schema: { type: string } }
