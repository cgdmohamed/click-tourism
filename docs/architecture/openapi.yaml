    get:
      tags: [Accounting]
      summary: Suggested next fiscal year (requires periods.view)
      description: Derived from the configured fiscal year start and the existing years; used as the default for `POST /fiscal-periods`.
      responses:
        '200':
          description: Suggestion (starts_on, ends_on, name)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /fiscal-periods/{period}/status:
    patch:
      tags: [Accounting]
      summary: Open, soft-close or close a fiscal period (requires periods.manage)
      description: Refused with 422 for periods of a closed fiscal year (reopen the year instead) and when closing a period that still has draft journal entries.
      parameters:
        - { name: period, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, soft_closed, closed] }
                reason: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Period status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      status: { type: string, enum: [open, soft_closed, closed] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
