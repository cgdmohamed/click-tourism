      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CostCenterInput' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
