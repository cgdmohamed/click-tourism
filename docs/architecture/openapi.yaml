            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /accounts/export:
    get:
      tags: [Accounting]
      summary: Export the chart of accounts as CSV (requires accounts.view)
      description: UTF-8 CSV with a BOM, in the same column layout the import accepts, so an export can be re-imported.
      responses:
        '200':
          description: chart-of-accounts.csv attachment
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /accounts/import:
    post:
      tags: [Accounting]
      summary: Import or preview a chart of accounts from CSV (requires accounts.update)
      description: Preview and real import share one validation pass; any row error rejects the whole file with 422 and `row_errors`. Parents are linked after all rows exist, so file order does not matter.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'CSV file, max 10 MB' }
                preview_only: { type: boolean, description: Validate and return the preview without writing }
      responses:
        '200':
          description: Preview (`preview`, `total`) or import result (`imported`, `preview`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total: { type: integer }
                      imported: { type: integer }
                      preview: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Validation failed (`message`, `code` validation_failed, `row_errors`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
