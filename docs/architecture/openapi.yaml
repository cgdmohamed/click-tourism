openapi: 3.1.0
info:
  title: Tourism ERP API
  version: 0.1.0-draft
  description: |
    Draft contract for the self-hosted Tourism ERP. Additive changes within v1.
    Money is serialized as a decimal string plus the authoritative minor-unit integer.
    Every endpoint is authorized by policy and branch scope.
  contact:
    name: Architecture
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Platform
  - name: Accounting
  - name: Parties
  - name: Bookings
  - name: Payments
  - name: Reports
  - name: CRM
  - name: Webhooks

paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Authenticate and issue a Sanctum token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string, default: web }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      responses:
        '204': { description: Revoked }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user, roles, permissions, branches
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }

  /branches:
    get:
      tags: [Platform]
      summary: List branches visible to the user
      responses:
        '200':
          description: Branches
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Branch' }
    post:
      tags: [Platform]
      summary: Create a branch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /settings:
    get:
      tags: [Platform]
      summary: Read installation settings (secrets redacted)
      responses:
        '200': { description: Settings }
    put:
      tags: [Platform]
      summary: Update settings
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }

  /decisions:
    get:
      tags: [Platform]
      summary: List unresolved product/accounting decisions (requires settings.view)
      responses:
        '200':
          description: Unresolved decisions mirroring docs/product/decisions-needed.md
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Decision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /health:
    get:
      tags: [Platform]
      security: []
      summary: Liveness and dependency status (database, cache, redis, queue, scheduler)
      description: Returns 503 only when the database is down; other failures report `degraded`.
      responses:
        '200':
          description: ok or degraded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Database unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /ready:
    get:
      tags: [Platform]
      security: []
      summary: Readiness probe (database reachable)
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ready: { type: boolean }
        '503': { description: Not ready }

  /currencies:
    get:
      tags: [Platform]
      summary: List enabled currencies
      responses:
        '200': { description: Currencies }
  /fx-rates:
    get:
      tags: [Platform]
      summary: List FX rates
      parameters:
        - { name: currency, in: query, schema: { type: string } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: FX rates }
    post:
      tags: [Platform]
      summary: Record a manual FX rate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency, rate, rate_date]
              properties:
                currency: { type: string, minLength: 3, maxLength: 3 }
                rate: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
                rate_date: { type: string, format: date }
                source: { type: string, default: manual }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation' }

  /accounts:
    get:
      tags: [Accounting]
      summary: Chart of accounts tree
      responses:
        '200': { description: Accounts }
    post:
      tags: [Accounting]
      summary: Create an account
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation' }
  /cash-accounts:
    get:
      tags: [Accounting]
      summary: Registered cash and bank accounts with ledger balances (falls back to the chart of accounts until any are registered)
      parameters:
        - { name: include_inactive, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Cash accounts }
    post:
      tags: [Accounting]
      summary: Register a cash or bank account against a postable asset account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashAccountInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /cash-accounts/{cashAccount}:
    patch:
      tags: [Accounting]
      summary: Update a registered cash or bank account
      parameters:
        - { name: cashAccount, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashAccountInput' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /transfers:
    get:
      tags: [Accounting]
      summary: List transfers between cash and bank accounts
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Transfers }
    post:
      tags: [Accounting]
      summary: Create and post a same-currency or cross-currency transfer (idempotent)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferInput' }
      responses:
        '201': { description: Posted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /transfers/{transfer}:
    get:
      tags: [Accounting]
      summary: Get a transfer
      parameters:
        - { name: transfer, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Transfer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /transfers/{transfer}/reverse:
    post:
      tags: [Accounting]
      summary: Reverse a posted transfer exactly once
      parameters:
        - { name: transfer, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '200': { description: Reversed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /expense-categories:
    get:
      tags: [Accounting]
      summary: List expense categories mapped to postable expense accounts
      parameters:
        - { name: include_inactive, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Expense categories }
    post:
      tags: [Accounting]
      summary: Create an expense category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseCategoryInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /expense-categories/{category}:
    patch:
      tags: [Accounting]
      summary: Update an expense category
      parameters:
        - { name: category, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseCategoryInput' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /expenses:
    get:
      tags: [Accounting]
      summary: List expenses
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, submitted, approved, rejected, cancelled, reversed] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Expenses }
    post:
      tags: [Accounting]
      summary: Create a draft expense, optionally submitting it for approval (idempotent)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /expenses/{expense}:
    get:
      tags: [Accounting]
      summary: Get an expense
      parameters:
        - { name: expense, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Expense }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
    patch:
      tags: [Accounting]
      summary: Edit a draft expense
      parameters:
        - { name: expense, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /expenses/{expense}/submit:
    post:
      tags: [Accounting]
      summary: Submit a draft expense for approval
      parameters:
        - { name: expense, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Submitted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /expenses/{expense}/cancel:
    post:
      tags: [Accounting]
      summary: Cancel an unposted expense
      parameters:
        - { name: expense, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Cancelled }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /expenses/{expense}/approve:
    post:
      tags: [Accounting]
      summary: Approve a submitted expense and post it to the ledger (idempotent)
      parameters:
        - { name: expense, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Approved and posted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /expenses/{expense}/reject:
    post:
      tags: [Accounting]
      summary: Reject a submitted expense with a reason
      parameters:
        - { name: expense, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '200': { description: Rejected }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /expenses/{expense}/reverse:
    post:
      tags: [Accounting]
      summary: Reverse an approved expense exactly once
      parameters:
        - { name: expense, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '200': { description: Reversed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /opening-balances:
    get:
      tags: [Accounting]
      summary: List opening balance batches
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, posted, reversed] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Opening balance batches }
    post:
      tags: [Accounting]
      summary: Create a draft opening balance batch; each currency must balance on its own
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpeningBalanceInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /opening-balances/{batch}:
    get:
      tags: [Accounting]
      summary: Get an opening balance batch with its lines
      parameters:
        - { name: batch, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Opening balance batch }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
    delete:
      tags: [Accounting]
      summary: Discard a draft opening balance batch
      parameters:
        - { name: batch, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Discarded }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
  /opening-balances/{batch}/reconciliation:
    get:
      tags: [Accounting]
      summary: Reconcile a batch against the ledger and AR/AP control accounts
      parameters:
        - { name: batch, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Reconciliation report }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /opening-balances/{batch}/post:
    post:
      tags: [Accounting]
      summary: Post a draft opening balance batch as one journal entry per currency (idempotent)
      parameters:
        - { name: batch, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Posted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /opening-balances/{batch}/reverse:
    post:
      tags: [Accounting]
      summary: Reverse a posted opening balance batch by reversing each journal entry
      parameters:
        - { name: batch, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '200': { description: Reversed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /fiscal-years/{fiscalYear}/close-checks:
    get:
      tags: [Accounting]
      summary: Pre-close validation checks for a fiscal year
      parameters:
        - { name: fiscalYear, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Close checks }
  /fiscal-years/{fiscalYear}/close:
    post:
      tags: [Accounting]
      summary: "Close a fiscal year: post one closing entry per branch moving profit and loss into retained earnings"
      parameters:
        - { name: fiscalYear, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Closed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /fiscal-years/{fiscalYear}/reopen:
    post:
      tags: [Accounting]
      summary: Reopen a closed fiscal year by reversing its closing entries
      parameters:
        - { name: fiscalYear, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '200': { description: Reopened }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /fiscal-periods:
    get:
      tags: [Accounting]
      summary: List fiscal periods and status
      responses:
        '200': { description: Periods }
  /journal-entries:
    get:
      tags: [Accounting]
      summary: List journal entries
      responses:
        '200': { description: Entries }
    post:
      tags: [Accounting]
      summary: Create and optionally post a journal entry
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JournalEntryInput' }
      responses:
        '201': { description: Created }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /journal-entries/{id}/reverse:
    post:
      tags: [Accounting]
      summary: Reverse a posted entry
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '201': { description: Reversal posted }
        '409': { $ref: '#/components/responses/Conflict' }

  /customers:
    get:
      tags: [Parties]
      summary: List customers
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: branch_id, in: query, schema: { type: string } }
      responses:
        '200': { description: Customers }
    post:
      tags: [Parties]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation' }
  /suppliers:
    get:
      tags: [Parties]
      summary: List suppliers
      responses:
        '200': { description: Suppliers }
    post:
      tags: [Parties]
      summary: Create a supplier
      responses:
        '201': { description: Created }

  /bookings:
    get:
      tags: [Bookings]
      summary: List bookings
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: customer_id, in: query, schema: { type: string } }
        - { name: branch_id, in: query, schema: { type: string } }
      responses:
        '200': { description: Bookings }
    post:
      tags: [Bookings]
      summary: Create a draft booking
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingInput' }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation' }
  /bookings/{id}/transition:
    post:
      tags: [Bookings]
      summary: Apply a lifecycle transition
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [quoted, confirmed, in_progress, completed, closed, cancelled, no_show]
                reason: { type: string }
      responses:
        '200': { description: Transitioned }
        '409': { $ref: '#/components/responses/Conflict' }
  /bookings/{id}/cancel:
    post:
      tags: [Bookings]
      summary: Cancel a booking with policy computation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Cancelled with fee/refund preview }

  /payments:
    get:
      tags: [Payments]
      summary: List customer receipts
      responses:
        '200': { description: Payments }
    post:
      tags: [Payments]
      summary: Record a customer receipt (idempotent)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInput' }
      responses:
        '201': { description: Recorded }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /refunds:
    post:
      tags: [Payments]
      summary: Request a refund
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Requested }
        '409': { $ref: '#/components/responses/Conflict' }
  /refunds/{id}/approve:
    post:
      tags: [Payments]
      summary: Approve and post a refund
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Approved }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/trial-balance:
    get:
      tags: [Reports]
      summary: Trial balance for a period/branch
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: branch_id, in: query, schema: { type: string } }
        - name: currency
          in: query
          description: Limit to lines posted in this transaction currency and sum original-currency amounts (`basis=original`). Omit for base-currency totals.
          schema: { type: string, minLength: 3, maxLength: 3 }
        - { name: pre_closing, in: query, description: Exclude year-end closing entries and show pre-close balances, schema: { type: boolean, default: false } }
      responses:
        '200': { description: Trial balance }
  /reports/trial-balance/export:
    get:
      tags: [Reports]
      summary: Trial balance as CSV (requires reports.export; audited)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: currency, in: query, schema: { type: string, minLength: 3, maxLength: 3 } }
      responses:
        '200':
          description: UTF-8 CSV with BOM; formula-like cells are neutralised
          content:
            text/csv:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports/general-ledger:
    get:
      tags: [Reports]
      summary: General ledger for one account (descendants included) with opening, running and closing balance
      description: Posted entries only, scoped to the active branch (X-Branch-Id). Balances are debit minus credit.
      parameters:
        - { name: account_id, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: currency, in: query, description: 'Original-currency view of one transaction currency', schema: { type: string, minLength: 3, maxLength: 3 } }
        - { name: party_type, in: query, schema: { type: string, enum: [customer, supplier] } }
        - { name: party_id, in: query, description: Public id; required with party_type, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Ledger with pagination meta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneralLedger' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /reports/general-ledger/export:
    get:
      tags: [Reports]
      summary: General ledger as CSV (requires reports.export; audited; max 50,000 rows)
      parameters:
        - { name: account_id, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: currency, in: query, schema: { type: string, minLength: 3, maxLength: 3 } }
        - { name: party_type, in: query, schema: { type: string, enum: [customer, supplier] } }
        - { name: party_id, in: query, schema: { type: string } }
      responses:
        '200':
          description: UTF-8 CSV with BOM
          content:
            text/csv:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /reports/income-statement:
    get:
      tags: [Reports]
      summary: Income statement
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Income statement }
  /reports/balance-sheet:
    get:
      tags: [Reports]
      summary: Balance sheet as of a date
      parameters:
        - { name: as_of, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Balance sheet }
  /reports/aging:
    get:
      tags: [Reports]
      summary: AR/AP aging
      parameters:
        - { name: type, in: query, required: true, schema: { type: string, enum: [ar, ap] } }
        - { name: as_of, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Aging buckets }

  /leads:
    get:
      tags: [CRM]
      summary: List leads
      responses:
        '200': { description: Leads }
    post:
      tags: [CRM]
      summary: Create a lead
      responses:
        '201': { description: Created }
  /leads/{id}/convert:
    post:
      tags: [CRM]
      summary: Convert a lead to a customer and/or booking (once)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Converted }
        '409': { $ref: '#/components/responses/Conflict' }

  /webhooks/meta:
    get:
      tags: [Webhooks]
      security: []
      summary: Meta webhook verification challenge
      responses:
        '200': { description: Challenge echoed }
    post:
      tags: [Webhooks]
      security: []
      summary: Meta Lead Ads event (signature verified, deduplicated)
      responses:
        '200': { description: Accepted or duplicate }
        '403': { description: Invalid signature }
  /webhooks/whatsapp:
    get:
      tags: [Webhooks]
      security: []
      summary: WhatsApp webhook verification challenge
      responses:
        '200': { description: Challenge echoed }
    post:
      tags: [Webhooks]
      security: []
      summary: WhatsApp inbound message (signature verified, deduplicated)
      responses:
        '200': { description: Accepted or duplicate }
        '403': { description: Invalid signature }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Permission or branch scope denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Validation:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: State, idempotency, or concurrency conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
        code: { type: string }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
        requestId: { type: string }
    Decision:
      type: object
      properties:
        id: { type: string, example: DEC-001 }
        type: { type: string, example: ACC }
        title_en: { type: string }
        title_ar: { type: string }
        blocks: { type: string }
        status: { type: string, enum: [open, decided] }
    Health:
      type: object
      properties:
        data:
          type: object
          properties:
            status: { type: string, enum: [ok, degraded, down] }
            version: { type: string }
            checks:
              type: object
              properties:
                app: { type: object, properties: { status: { type: string } } }
                database: { type: object, properties: { status: { type: string }, latency_ms: { type: integer } } }
                cache: { type: object, properties: { status: { type: string }, driver: { type: string } } }
                redis: { type: object, properties: { status: { type: string, enum: [ok, down, not_configured] } } }
                queue: { type: object, properties: { status: { type: string }, driver: { type: string }, failed_jobs: { type: integer } } }
                scheduler: { type: object, properties: { status: { type: string, enum: [ok, stale, unknown] }, last_run_at: { type: [string, 'null'] } } }
            unresolved_decisions:
              type: array
              items: { $ref: '#/components/schemas/Decision' }
    GeneralLedger:
      type: object
      properties:
        data:
          type: object
          properties:
            currency: { type: string }
            basis: { type: string, enum: [base, original] }
            account: { type: object }
            from: { type: string, format: date }
            to: { type: string, format: date }
            opening_minor: { type: integer }
            total_debit_minor: { type: integer }
            total_credit_minor: { type: integer }
            closing_minor: { type: integer }
            lines:
              type: array
              items:
                type: object
                properties:
                  entry_id: { type: string }
                  number: { type: string }
                  entry_date: { type: string, format: date }
                  memo: { type: [string, 'null'] }
                  description: { type: [string, 'null'] }
                  account_code: { type: string }
                  source_type: { type: [string, 'null'] }
                  currency: { type: string }
                  debit_minor: { type: integer }
                  credit_minor: { type: integer }
                  base_debit_minor: { type: integer }
                  base_credit_minor: { type: integer }
                  balance_minor: { type: integer }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            last_page: { type: integer }
            total: { type: integer }
            per_page: { type: integer }
    Money:
      type: object
      required: [amount, currency, amountMinor]
      properties:
        amount: { type: string, example: '1234.50' }
        amountMinor: { type: integer, example: 123450 }
        currency: { type: string, example: EGP }
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        locale: { type: string, enum: [ar, en] }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
        branches:
          type: array
          items: { $ref: '#/components/schemas/Branch' }
    Branch:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name_ar: { type: string }
        name_en: { type: string }
        accounting_mode: { type: string, enum: [dimension, customer, independent] }
        is_active: { type: boolean }
    BranchInput:
      type: object
      required: [code, name_ar, name_en]
      properties:
        code: { type: string, maxLength: 20 }
        name_ar: { type: string }
        name_en: { type: string }
        accounting_mode: { type: string, enum: [dimension, customer, independent], default: dimension }
    Account:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name_ar: { type: string }
        name_en: { type: string }
        type: { type: string, enum: [asset, liability, equity, revenue, expense] }
        parent_id: { type: string, nullable: true }
        is_postable: { type: boolean }
        is_active: { type: boolean }
    JournalLineInput:
      type: object
      required: [account_id]
      properties:
        account_id: { type: string }
        debit_minor: { type: integer, minimum: 0, default: 0 }
        credit_minor: { type: integer, minimum: 0, default: 0 }
        party_type: { type: string, enum: [customer, supplier, payee], nullable: true }
        party_id: { type: string, nullable: true }
        description: { type: string }
    JournalEntryInput:
      type: object
      required: [entry_date, branch_id, currency, fx_rate, lines]
      properties:
        entry_date: { type: string, format: date }
        branch_id: { type: string }
        currency: { type: string }
        fx_rate: { type: string, example: '1.0000000000' }
        fx_rate_date: { type: string, format: date }
        fx_rate_source: { type: string, default: manual }
        memo: { type: string }
        post: { type: boolean, default: true }
        lines:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/JournalLineInput' }
    CustomerInput:
      type: object
      required: [type, name_ar, name_en, branch_id]
      properties:
        type: { type: string, enum: [individual, company] }
        name_ar: { type: string }
        name_en: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        tax_id: { type: string }
        branch_id: { type: string }
        credit_limit_minor: { type: integer, default: 0 }
    BookingItemInput:
      type: object
      required: [service_type, description, quantity, unit_cost_minor, unit_sell_minor]
      properties:
        service_type: { type: string, enum: [flight, hotel, transport, visa, program, other] }
        supplier_id: { type: string, nullable: true }
        description: { type: string }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        quantity: { type: number, default: 1 }
        unit_cost_minor: { type: integer, minimum: 0 }
        unit_sell_minor: { type: integer, minimum: 0 }
        cost_currency: { type: string }
        sell_currency: { type: string }
        tax_profile_id: { type: string, nullable: true }
    BookingInput:
      type: object
      required: [customer_id, branch_id, owner_user_id, start_date, currency, fx_rate, items]
      properties:
        customer_id: { type: string }
        branch_id: { type: string }
        owner_user_id: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        pax_adults: { type: integer, minimum: 1, default: 1 }
        pax_children: { type: integer, minimum: 0, default: 0 }
        pax_infants: { type: integer, minimum: 0, default: 0 }
        currency: { type: string }
        fx_rate: { type: string }
        notes: { type: string }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/BookingItemInput' }
    PaymentInput:
      type: object
      required: [customer_id, branch_id, cash_account_id, amount_minor, currency, fx_rate]
      properties:
        customer_id: { type: string }
        booking_id: { type: string, nullable: true }
        branch_id: { type: string }
        method: { type: string, enum: [cash, bank_transfer, card, wallet] }
        cash_account_id: { type: string }
        amount_minor: { type: integer, minimum: 1 }
        currency: { type: string }
        fx_rate: { type: string }
        paid_at: { type: string, format: date-time }
        allocations:
          type: array
          items:
            type: object
            required: [booking_id, amount_minor]
            properties:
              booking_id: { type: string }
              amount_minor: { type: integer, minimum: 1 }
    CashAccount:
      type: object
      properties:
        id: { type: string }
        cash_account_id: { type: string }
        code: { type: string }
        name_ar: { type: string }
        name_en: { type: string }
        kind: { type: string, enum: [cash, bank] }
        currency: { type: string }
        bank_name: { type: string, nullable: true }
        account_last4: { type: string, nullable: true }
        is_active: { type: boolean }
        registered: { type: boolean }
        balance_minor: { type: integer, nullable: true }
        balance_currency: { type: string, nullable: true }
    CashAccountInput:
      type: object
      required: [kind, name_ar, name_en, currency]
      properties:
        kind: { type: string, enum: [cash, bank] }
        name_ar: { type: string }
        name_en: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        account_id: { type: string }
        account_code: { type: string }
        branch_id: { type: string }
        bank_name: { type: string }
        account_last4: { type: string, pattern: '^\\d{4}$' }
    Transfer:
      type: object
      properties:
        id: { type: string }
        number: { type: string }
        transfer_date: { type: string, format: date }
        from: { $ref: '#/components/schemas/CashAccount' }
        to: { $ref: '#/components/schemas/CashAccount' }
        from_currency: { type: string }
        from_amount_minor: { type: integer }
        from_fx_rate: { type: string }
        to_currency: { type: string }
        to_amount_minor: { type: integer }
        to_fx_rate: { type: string }
        fee_minor: { type: integer }
        memo: { type: string, nullable: true }
        status: { type: string, enum: [posted, reversed] }
        journal_entry_id: { type: string, nullable: true }
    TransferInput:
      type: object
      required: [from_cash_account_id, to_cash_account_id, transfer_date, amount_minor]
      properties:
        from_cash_account_id: { type: string }
        to_cash_account_id: { type: string }
        transfer_date: { type: string, format: date }
        amount_minor: { type: integer, minimum: 1 }
        to_amount_minor: { type: integer, minimum: 1 }
        from_fx_rate: { type: string }
        to_fx_rate: { type: string }
        fee_minor: { type: integer, minimum: 0, default: 0 }
        memo: { type: string }
    Expense:
      type: object
      properties:
        id: { type: string }
        number: { type: string }
        expense_date: { type: string, format: date }
        category: { $ref: '#/components/schemas/ExpenseCategory' }
        payee_type: { type: string, enum: [none, supplier] }
        payee_name: { type: string, nullable: true }
        cash_account_id: { type: string, nullable: true }
        currency: { type: string }
        fx_rate: { type: string }
        amount_minor: { type: integer }
        tax_minor: { type: integer }
        net_minor: { type: integer }
        description: { type: string }
        reference: { type: string, nullable: true }
        status: { type: string, enum: [draft, submitted, approved, rejected, cancelled, reversed] }
        rejection_reason: { type: string, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        journal_entry_id: { type: string, nullable: true }
    ExpenseInput:
      type: object
      required: [category_id, expense_date, amount_minor, currency, description]
      properties:
        category_id: { type: string }
        expense_date: { type: string, format: date }
        amount_minor: { type: integer, minimum: 1 }
        tax_minor: { type: integer, minimum: 0, default: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        fx_rate: { type: string }
        description: { type: string }
        reference: { type: string }
        payee_type: { type: string, enum: [none, supplier] }
        payee_id: { type: string }
        payee_name: { type: string }
        cash_account_id: { type: string }
        submit: { type: boolean, default: false }
    ExpenseCategory:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name_ar: { type: string }
        name_en: { type: string }
        account_id: { type: string }
        account_code: { type: string }
        is_active: { type: boolean }
    ExpenseCategoryInput:
      type: object
      required: [code, name_ar, name_en, account_id]
      properties:
        code: { type: string, maxLength: 30 }
        name_ar: { type: string }
        name_en: { type: string }
        account_id: { type: string }
    OpeningBalanceBatch:
      type: object
      properties:
        id: { type: string }
        branch_id: { type: string }
        as_of_date: { type: string, format: date }
        memo: { type: string, nullable: true }
        status: { type: string, enum: [draft, posted, reversed] }
        posted_at: { type: string, format: date-time, nullable: true }
        reversal_reason: { type: string, nullable: true }
        lines:
          type: array
          items: { $ref: '#/components/schemas/OpeningBalanceLine' }
    OpeningBalanceLine:
      type: object
      properties:
        account: { $ref: '#/components/schemas/Account' }
        currency: { type: string }
        fx_rate: { type: string }
        debit_minor: { type: integer }
        credit_minor: { type: integer }
        party_type: { type: string, nullable: true }
        party_id: { type: string, nullable: true }
        description: { type: string, nullable: true }
    OpeningBalanceInput:
      type: object
      required: [as_of_date, lines]
      properties:
        as_of_date: { type: string, format: date }
        memo: { type: string }
        lines:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/OpeningBalanceLineInput' }
    OpeningBalanceLineInput:
      type: object
      required: [account_id]
      properties:
        account_id: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        fx_rate: { type: string }
        debit_minor: { type: integer, minimum: 0, default: 0 }
        credit_minor: { type: integer, minimum: 0, default: 0 }
        party_type: { type: string, enum: [customer, supplier], nullable: true }
        party_id: { type: string }
        description: { type: string }
    FiscalYear:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        status: { type: string, enum: [open, closed] }
        closed_at: { type: string, format: date-time, nullable: true }
        close_count: { type: integer }
        periods:
          type: array
          items: { type: object }
