  /accounting-documents:
    get:
      tags: [Accounting]
      summary: List accounting documents / vouchers
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [receipt_voucher, payment_voucher, transfer_voucher, adjustment_voucher, refund_voucher] } }
        - { name: status, in: query, schema: { type: string, enum: [draft, submitted, approved, posted, voided, rejected, cancelled] } }
        - { name: party_type, in: query, schema: { type: string, enum: [customer, supplier, employee] } }
        - { name: party_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Documents }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Accounting]
      summary: Create a draft voucher with balanced lines (idempotent)
      description: >-
        Lines must balance (total debit equals total credit). Tax breakdown per
        line is recorded as document metadata; vouchers do not auto-post tax
        lines (DEC-036).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountingDocumentInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /accounting-documents/{document}:
    get:
      tags: [Accounting]
      summary: Get a document with its lines, journal entry and reversals
      parameters:
        - { name: document, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Document }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
    patch:
      tags: [Accounting]
      summary: Edit a draft document (lines re-validated, totals recomputed)
      parameters:
        - { name: document, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountingDocumentInput' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /accounting-documents/{document}/submit:
    post:
      tags: [Accounting]
      summary: Submit a draft document for approval (idempotent)
      parameters:
        - { name: document, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Submitted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /accounting-documents/{document}/approve:
    post:
      tags: [Accounting]
      summary: Approve a submitted document (idempotent; maker-checker enforced via documents.segregation)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: document, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Approved }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /accounting-documents/{document}/post:
    post:
      tags: [Accounting]
      summary: Post an approved document to the ledger (idempotent — exactly one journal entry)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: document, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Posted with journal_entry_id }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /accounting-documents/{document}/cancel:
    post:
      tags: [Accounting]
      summary: Cancel a draft or submitted document (posted documents are corrected instead)
      parameters:
        - { name: document, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Cancelled }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /accounting-documents/{document}/reject:
    post:
      tags: [Accounting]
      summary: Reject a submitted document with a reason
      parameters:
        - { name: document, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        '200': { description: Rejected }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /accounting-documents/{document}/correct:
    post:
      tags: [Accounting]
      summary: Create the linked reversal document for a posted document (submitted for approval)
      description: >-
        Swaps every line debit/credit, keeps the original trail via
        reversal_of_id, and leaves the reversal in the submitted state so it
        goes through the normal approval workflow.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: document, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 255 }
                series: { type: string, maxLength: 10 }
                memo: { type: string, maxLength: 255 }
      responses:
        '201': { description: Reversal document created (submitted) }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }

  /bank-statements:
    get:
      tags: [Treasury]
      summary: List imported bank statements
      parameters:
        - { name: cash_account_id, in: query, schema: { type: string }, description: Registered cash account public id }
      responses:
        '200': { description: Statements }
        '403': { $ref: '#/components/responses/Forbidden' }
  /bank-statements/import:
    post:
      tags: [Treasury]
      summary: Import a CSV or XLSX bank statement for a registered bank account
      description: >-
        Amounts use bank convention: money in the bank is positive (the book
        debits the bank account), money out is negative. Duplicate lines from
        overlapping statements are skipped and reported. Re-uploading the exact
        same file is rejected. Only base-currency bank accounts are supported
        until DEC-037 is decided.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/BankStatementImportInput' }
      responses:
        '201': { description: Statement imported with imported_lines and skipped_duplicates }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /bank-statements/{statement}:
    get:
      tags: [Treasury]
      summary: Get an imported statement with its lines
      parameters:
        - { name: statement, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Statement }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /reconciliations:
    get:
      tags: [Treasury]
      summary: List reconciliation sessions
      parameters:
        - { name: cash_account_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [open, approved] } }
        - { name: period_from, in: query, schema: { type: string, format: date } }
        - { name: period_to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Sessions }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Treasury]
      summary: Open a reconciliation session for a bank account and period
      description: >-
        The opening book balance is derived from posted journal lines dated
        before the period start, so the session always reconciles against the
        general ledger rather than a manual figure.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankReconciliationInput' }
      responses:
        '201': { description: 'Session with computed summary, lines, candidates and differences' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /reconciliations/{reconciliation}:
    get:
      tags: [Treasury]
      summary: Get a reconciliation with bank lines, book lines, matches and differences
      parameters:
        - { name: reconciliation, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Reconciliation detail }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /reconciliations/{reconciliation}/auto-match:
    post:
      tags: [Treasury]
      summary: Match unambiguous one-to-one candidates (never posts)
      description: >-
        Only candidates with a single bank line and a single book line of the
        same amount and direction inside tolerance and the date window are
        matched. Ambiguous pairs are counted and left for human review.
      parameters:
        - { name: reconciliation, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'Result with created, ambiguous, remaining and refreshed reconciliation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /reconciliations/{reconciliation}/matches:
    post:
      tags: [Treasury]
      summary: Match bank lines to journal lines as one group (split matches allowed)
      description: >-
        All items in one request form a single match group. Every bank line and
        journal line in the group must be fully consumed within tolerance;
        partial matches are rejected in v1. A journal line can only be consumed
        by one session.
      parameters:
        - { name: reconciliation, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankReconciliationMatchInput' }
      responses:
        '200': { description: Updated reconciliation detail }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /reconciliations/{reconciliation}/matches/{group}:
    delete:
      tags: [Treasury]
      summary: Remove a match group and release its lines
      parameters:
        - { name: reconciliation, in: path, required: true, schema: { type: string } }
        - { name: group, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated reconciliation detail }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /reconciliations/{reconciliation}/adjustment-voucher:
    post:
      tags: [Treasury]
      summary: Propose a draft adjustment voucher for unrecorded bank items
      description: >-
        Creates a draft adjustment_voucher through the normal document workflow
        (bank charges to accounting.bank_charges_account_code, interest to
        accounting.bank_interest_account_code). Nothing is posted until the
        voucher is submitted, approved and posted; the voucher is dated on the
        oldest selected bank line so it can be matched within the date window.
      parameters:
        - { name: reconciliation, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankAdjustmentVoucherInput' }
      responses:
        '201': { description: Draft adjustment voucher and updated reconciliation }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /reconciliations/{reconciliation}/approve:
    post:
      tags: [Treasury]
      summary: Approve and lock a reconciled session (idempotent)
      description: >-
        Refused while unrecorded bank items remain or the adjusted balances do
        not agree within tolerance. Approved sessions store a JSON snapshot and
        stay locked until reopened (see reopen) or corrected by a new session.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: reconciliation, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Approved session with snapshot }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /reconciliations/{reconciliation}/reopen:
    post:
      tags: [Treasury]
      summary: Reopen the newest approved session of an account (requires reconciliation.approve)
      description: Requires a reason; audited. Only the newest approved session per account can be reopened.
      parameters:
        - { name: reconciliation, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: Reopened session }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /accounting-schedules:
    get:
      tags: [Schedules]
      summary: List accrual, prepayment and deferred revenue schedules
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [prepaid_expense, deferred_revenue, accrued_expense, accrued_revenue] } }
        - { name: status, in: query, schema: { type: string, enum: [draft, active, completed, cancelled] } }
