  # ---------------------------------------------------------------------------
  # Operations added by the OpenAPI sync (docs/architecture README, "Contract
  # coverage"). OpenApiCoverageTest keeps this file and routes/api.php aligned.
  # ---------------------------------------------------------------------------
  /demo/status:
    get:
      tags: [Platform]
      security: []
      summary: Demo-mode status (public, throttled)
      description: Reports whether the installation runs in demo mode and when the next scheduled reset happens. `reset_seconds`, `next_reset_at` and `generation` are null when demo mode is off.
      responses:
        '200':
          description: Demo status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      reset_seconds: { type: integer, nullable: true }
                      next_reset_at: { type: string, nullable: true }
                      generation: { type: [string, integer, 'null'] }
        '429': { $ref: '#/components/responses/RateLimited' }
  /search:
    get:
      tags: [Platform]
      summary: Cross-entity quick search for the header (authenticated, throttled)
      description: Results are branch-scoped and each group is returned only when the caller holds the matching `.view` permission. Queries shorter than 2 characters return no groups. Up to 5 items per group.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        '200':
          description: Result groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total: { type: integer }
                      groups:
                        type: array
                        items:
                          type: object
                          properties:
                            type: { type: string, example: customers }
                            items:
                              type: array
                              items:
                                type: object
                                properties:
                                  id: { type: string }
                                  title_ar: { type: string }
                                  title_en: { type: string }
                                  subtitle: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /decisions/{id}/resolve:
    post:
      tags: [Platform]
      summary: Record the resolution of a product/accounting decision (requires settings.update)
      description: Stored in the settings registry and audited as `decision.resolved`. Unknown decision ids return 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, note]
              properties:
                status: { type: string, enum: [approved, rejected, deferred] }
                option: { type: string, maxLength: 100 }
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Resolution recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      resolution:
                        type: object
                        properties:
                          status: { type: string, enum: [approved, rejected, deferred] }
                          option: { type: string }
                          note: { type: string }
                          decided_by: { type: string }
                          decided_by_name: { type: string }
                          decided_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Unknown decision }
        '422': { $ref: '#/components/responses/Validation' }
