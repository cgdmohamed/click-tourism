  /fixed-assets:
    get:
      tags: [Fixed Assets]
      summary: List the fixed-asset register
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, active, fully_depreciated, disposed] } }
        - { name: category, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200': { description: Assets }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Fixed Assets]
      summary: Register a draft asset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixedAssetInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /fixed-assets/{asset}:
    get:
      tags: [Fixed Assets]
      summary: Read an asset with mappings, calculations and lifecycle links
      parameters:
        - { name: asset, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Asset
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/FixedAsset' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
    patch:
      tags: [Fixed Assets]
      summary: Update a draft asset
      parameters:
        - { name: asset, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixedAssetInput' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /fixed-assets/{asset}/capitalize:
    post:
      tags: [Fixed Assets]
      summary: Approve capitalization and post the asset cost through the ledger
      parameters:
        - { name: asset, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Capitalized asset }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { description: 'Below threshold, duplicate posting, or closed period' }
  /fixed-assets/{asset}/transfer:
    post:
      tags: [Fixed Assets]
      summary: Transfer an asset between branches, cost centers or custodians
      description: >-
        A change of branch posts two balanced journals at net book value, one
        per branch (events `transfer_out` and `transfer_in` of source
        `fixed_asset_transfer`), through the inter-branch clearing accounts
        (`accounting.interbranch_receivable_account_code` /
        `interbranch_payable_account_code`): source Dr accumulated depreciation,
        Dr inter-branch receivable, Cr cost; destination Dr cost, Cr accumulated
        depreciation, Cr inter-branch payable. Amounts are base-currency register
        figures. Both branches must be in the actor's branch scope (403
        otherwise) and the transfer date must fall in an open period (422).
        Cost-center or custodian changes within a branch post nothing.
      parameters:
        - { name: asset, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixedAssetTransferInput' }
      responses:
        '201': { description: 'Transfer recorded (with cost, accumulated depreciation, NBV and the two journal references) and asset attribution updated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /fixed-asset-transfers/{transfer}/reverse:
    post:
      tags: [Fixed Assets]
      summary: Reverse an inter-branch transfer (both journals reversed, asset returns to its previous branch)
      description: >-
        Only the latest transfer of an asset, while nothing was depreciated or
        impaired since and the asset is not disposed. Requires assets.approve
        and journal.reverse.
      parameters:
        - { name: transfer, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 255 } } }
      responses:
        '200': { description: Transfer with is_reversed true and the restored asset }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /fixed-assets/{asset}/dispose:
    post:
      tags: [Fixed Assets]
      summary: Dispose, sell or retire an asset and post the linked journal entry
      parameters:
        - { name: asset, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixedAssetDisposalInput' }
      responses:
        '200': { description: Disposed asset with gain/loss and journal reference }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /fixed-assets/{asset}/impairments:
    post:
      tags: [Fixed Assets]
      summary: Create an impairment adjustment voucher (applied only after it is posted)
      parameters:
        - { name: asset, in: path, required: true, schema: { type: string } }
      responses:
        '201': { description: Draft or submitted adjustment voucher }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/Validation' }
  /fixed-assets/{asset}/impairments/{document}/apply:
    post:
      tags: [Fixed Assets]
      summary: Apply a posted impairment voucher to the register
      parameters:
        - { name: asset, in: path, required: true, schema: { type: string } }
        - { name: document, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Register updated with the impairment }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '422': { description: 'Voucher not linked, not posted, or already applied' }
  /fixed-assets/{asset}/schedule:
