name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (PHP 8.2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, intl, mbstring, pdo_sqlite, pdo_pgsql, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: |
          if ! vendor/bin/pint --test; then
            vendor/bin/pint
            git diff -- app/
            exit 1
          fi

      - name: Run tests
        run: php artisan test

      - name: Audit dependencies
        run: composer audit

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage threshold on src/lib)
        run: npm run test:coverage

      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate

      - name: Build
        run: npm run build

  e2e:
    name: Browser E2E (Playwright, seeded SQLite)
    runs-on: ubuntu-latest
    env:
      DEMO_PASSWORD: 'e2e-password-123'
      E2E_ADMIN_PASSWORD: 'e2e-password-123'
      # Disposable install: lets the payment/refund spec approve the accounting policy.
      E2E_APPROVE_POLICY: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, intl, mbstring, pdo_sqlite, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Seed a disposable installation
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate:fresh --seed --force

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  backend-coverage:
    name: Backend coverage (pcov, non-blocking report)
    runs-on: ubuntu-latest
    # GAP-QA-03: report only. Accounting-engine target is 80%; promote to a
    # gate (`--min`) once the first recorded number is known to clear it.
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, intl, mbstring, pdo_sqlite, zip
          coverage: pcov
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Accounting engine coverage
        run: |
          vendor/bin/phpunit --coverage-text --colors=never > coverage.txt
          tail -n 6 coverage.txt
          # Line coverage of app/Modules/Accounting, summed from the per-class report.
          awk '/^App\\Modules\\Accounting/{f=1;next} /^[A-Za-z]/{f=0} f && /Lines:/{s=$0; sub(/.*Lines: *[0-9.]+% *\( */,"",s); sub(/\).*/,"",s); split(s,a,"/"); gsub(/ /,"",a[1]); gsub(/ /,"",a[2]); c+=a[1]; t+=a[2]} END{printf "Accounting engine: %d/%d lines = %.1f%% (target 80%%)\n",c,t,100*c/t}' coverage.txt | tee -a "$GITHUB_STEP_SUMMARY"

  postgres-integration:
    name: PostgreSQL 16 (migrations and financial integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tourism_test
          POSTGRES_USER: tourism
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tourism -d tourism_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: tourism_test
      DB_USERNAME: tourism
      DB_PASSWORD: ci-test-only
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      DEMO_SEED: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, intl, mbstring, pdo_pgsql, pdo_sqlite, zip
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Assert PostgreSQL connection is in use
        run: |
          php artisan config:clear
          php artisan tinker --execute="if (config('database.default') !== 'pgsql') { throw new RuntimeException('PostgreSQL connection was not selected'); }"
      - name: Migrate on PostgreSQL
        run: php artisan migrate --force
      - name: Demo baseline restore (PostgreSQL 16 server, any pg_dump version)
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: tourism_test
          PGUSER: tourism
          PGPASSWORD: ci-test-only
        run: sh docker/test-demo-restore.sh
      - name: Run financial integration tests on PostgreSQL
        run: |
          php artisan test --filter="(PostingServiceTest|PaymentServiceTest|InvoiceTest|FinancialReportsReconciliationTest|SupplierSettlementTest|BookingServiceTest|InstallCommandTest|VerifyLedgerCommandTest|VerifyCredentialsCommandTest|UserSeederSafetyTest)"
      # Release gate (docs/deployment/release-checklist.md): each rehearsal creates and
      # drops its own erp_rehearsal_* databases, so it cannot disturb tourism_test.
      - name: Release rehearsals (fresh install, backup/restore, N-1 upgrade, rollback)
        working-directory: .
        run: sh scripts/release/rehearse-all.sh

  coolify-compose-validate:
    name: Coolify Compose validation and API image build
    runs-on: ubuntu-latest
    env:
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" # scan-secrets: allow (CI placeholder, not a real key)
      APP_URL: "https://erp.example.invalid"
      POSTGRES_PASSWORD: "ci-only-production-password"
      DEMO_APP_KEY: "base64:BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=" # scan-secrets: allow (CI placeholder, not a real key)
      DEMO_DB_PASSWORD: "ci-only-demo-password"
      DEMO_URL: "https://demo.example.invalid"
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone Docker Compose definitions
        run: |
          docker compose -f docker-compose.coolify.yml config --quiet
          docker compose -f docker-compose.demo.coolify.yml config --quiet
      - name: Validate demo and application entrypoint scripts
        run: |
          sh -n backend/docker/entrypoint.sh
          sh -n backend/docker/demo-reset-loop.sh
          sh -n backend/docker/demo-restore-db.sh
          sh -n backend/docker/test-demo-restore.sh
          for f in scripts/release/*.sh; do sh -n "$f"; done
      - name: Build Laravel nginx API image
        run: docker build -f deploy/Dockerfile.api -t click-tourism-api:ci .
      - name: Build Laravel PHP-FPM image
        run: docker build -f backend/Dockerfile -t click-tourism-backend:ci backend
      - name: Secret and default-credential scan (repository and built backend image)
        run: IMAGE=click-tourism-backend:ci sh scripts/release/scan-secrets.sh
